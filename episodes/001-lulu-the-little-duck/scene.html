<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
const DUR=47, SC=[0,5,11,18,25,32,40,47];
function render(t){
  const [i,lt]=sceneAt(t,SC);
  let n=0,behind='',props='',chars='',pops='',cap='';
  const JT=[2.6,3.7,4.8];
  const watcher=(x,joy)=>{const dj=jumps(lt,[joy],.5,40);
    return shadow(x,522,58,-dj.y)+place(x,520+dj.y,duck({eye:blink(t,0),wing:lt>joy?32*Math.abs(Math.sin(lt*10)):0}),{sx:dj.sx,sy:dj.sy,rot:Math.sin(lt*2)*2});};
  switch(i){
  case 0:{
    const j=jumps(lt,[1.3,2.3,3.3],.6,30);
    chars=shadow(640,522,70,-j.y)+place(640,520+j.y,duck({wing:20+20*Math.sin(lt*9),eye:blink(t,0)}),{s:1.15,sx:j.sx,sy:j.sy});
    pops=pop('<tspan fill="#FF5D8F">L</tspan><tspan fill="#FF9F1C">u</tspan><tspan fill="#19B8A6">l</tspan><tspan fill="#7B5CFF">u</tspan>',640,160,150,'#FF5D8F',lt,.4,-3)
        +pop('the Little Duck',640,236,58,'#2D2A6E',lt,1.0);
    break;}
  case 1:{
    const x=lerp(-130,520,eio(prog(lt,.2,2.8))), mv=(lt>.2&&lt<2.8)?1:0;
    const wob=mv*Math.sin(lt*13)*7, bob=-mv*Math.abs(Math.sin(lt*13))*9;
    const j=jumps(lt,[3.3,4.4],.55,40);
    const wing=lt>3?30+28*Math.sin((lt-3)*11):mv*10*Math.sin(lt*13);
    chars=shadow(x,522,62,-j.y-bob)+place(x,520+bob+j.y,duck({wing,eye:blink(t,0)}),{rot:wob,sx:j.sx,sy:j.sy,s:1.1})
         +butterfly(930+70*Math.sin(lt*.9),320+45*Math.sin(lt*1.7),Math.abs(Math.sin(t*14)));
    cap=caption('This is Lulu.',lt,.4);
    pops=pop('Hello, Lulu!',640,200,96,'#FF5D8F',lt,3.0,-2);
    break;}
  case 2:{
    const j=jumps(lt,JT,.8,170);
    props=`<ellipse cx="900" cy="546" rx="230" ry="38" fill="#4DB8F0"/><ellipse cx="900" cy="543" rx="205" ry="29" fill="#7DD3FA"/>`;
    JT.forEach(a=>{const v=prog(lt,a+.8,a+1.4);if(v>0&&v<1)props+=`<ellipse cx="900" cy="544" rx="${92+v*100}" ry="${17+v*13}" fill="none" stroke="#fff" stroke-width="4" opacity="${1-v}"/>`;});
    props+=`<ellipse cx="900" cy="543" rx="90" ry="17" fill="#3FA34D"/><ellipse cx="900" cy="540" rx="90" ry="15" fill="#58C063"/>`;
    chars=watcher(360,5.9)+place(900,540+j.y,frog({eye:blink(t,1.3)}),{s:1.1,sx:j.sx,sy:j.sy});
    cap=caption('Lulu sees a frog.',lt,.4);
    pops=pop('Jump,',300,170,84,'#16A34A',lt,JT[0]+.1,-6)+pop('jump,',590,150,84,'#0EA5A0',lt,JT[1]+.1,3)+pop('jump!',880,170,84,'#16A34A',lt,JT[2]+.1,6);
    break;}
  case 3:{
    const j=jumps(lt,JT,.7,90), xs=[1040,950,1040,950];let bx=1040;
    JT.forEach((a,k)=>{const u=prog(lt,a,a+.7);if(u>0)bx=lerp(xs[k],xs[k+1],u);});
    props=carrot(690,548,1)+carrot(755,560,.85);
    chars=watcher(360,5.9)+shadow(bx,522,50,-j.y)+place(bx,520+j.y,bunny({eye:blink(t,.7),ear:(-j.y/90)*14+Math.sin(lt*2)*2}),{sx:j.sx,sy:j.sy});
    cap=caption('Lulu sees a bunny.',lt,.4);
    pops=pop('Hop,',270,170,84,'#FF5D8F',lt,JT[0]+.1,-6)+pop('hop,',530,150,84,'#A855F7',lt,JT[1]+.1,3)+pop('hop!',790,170,84,'#FF5D8F',lt,JT[2]+.1,6);
    break;}
  case 4:{
    const pos=tt=>{const w=tt*1.7;return [880+190*Math.sin(w)+(1-eout(prog(tt,0,1.3)))*520,335+58*Math.sin(2*w)];};
    const [bx,by]=pos(lt), dx=pos(lt+.02)[0]-bx;
    let trail='';for(let k=2;k<=8;k++){const q=pos(lt-k*.08);trail+=`<circle cx="${q[0]}" cy="${q[1]}" r="${6.5-k*.5}" fill="#fff" opacity="${.8-k*.08}"/>`;}
    let wig=0;JT.forEach(a=>{if(lt>a&&lt<a+.5)wig=13*Math.sin((lt-a)*38)*Math.sin(Math.PI*(lt-a)/.5);});
    props=flower(790,535,110,'#FF5D8F',t,4)+flower(905,548,140,'#FFE14D',t,5,1,'#FF8C1A')+flower(1015,535,95,'#B58CFF',t,6);
    chars=watcher(340,5.9)+trail+place(bx,by,bee({flap:Math.sin(t*55)}),{rot:wig,flip:dx>0});
    cap=caption('Lulu sees a bee.',lt,.4);
    pops=pop('Buzz,',300,170,84,'#F08A00',lt,JT[0]+.1,-6)+pop('buzz,',590,150,84,'#4A3420',lt,JT[1]+.1,3)+pop('buzz!',880,170,84,'#F08A00',lt,JT[2]+.1,6);
    break;}
  case 5:{
    const p=eio(prog(lt,.4,2.6));
    ['#FF5A5F','#FF9F1C','#FFD23F','#3DCC6E','#3FA9F5','#9B6BFF'].forEach((c,k)=>{const r=360-k*20,len=Math.PI*r;
      behind+=`<path d="M${640-r},470 A${r},${r} 0 0 1 ${640+r},470" fill="none" stroke="${c}" stroke-width="21" stroke-dasharray="${len} ${len}" stroke-dashoffset="${len*(1-p)}"/>`;});
    const T0=[2.9,4.1,5.3,6.5];
    const a=jumps(lt,T0,.6,60), b=jumps(lt,T0.map(v=>v+.15),.6,60), c=jumps(lt,T0.map(v=>v+.3),.6,60);
    chars=shadow(230,522,58,-a.y)+place(230,520+a.y,duck({eye:blink(t,0),wing:lt>2.9?30*Math.abs(Math.sin(lt*10)):0}),{sx:a.sx,sy:a.sy})
         +shadow(470,527,60,-b.y)+place(470,525+b.y,frog({eye:blink(t,1.3)}),{s:1.05,sx:b.sx,sy:b.sy})
         +shadow(800,522,50,-c.y)+place(800,520+c.y,bunny({eye:blink(t,.7),ear:(-c.y/60)*12}),{sx:c.sx,sy:c.sy})
         +place(1040,360+14*Math.sin(lt*3),bee({flap:Math.sin(t*55)}),{rot:4*Math.sin(lt*2)});
    for(let k=0;k<9;k++){const q=lt-(2.6+k*.45);if(q>0){const y=610-q*110,x=110+k*132+25*Math.sin(q*2+k),o=clamp((y-50)/140)*clamp(q*3)*.9;
      if(y>40)props+=heart(x,y,1+(k%3)*.25,['#FF5D8F','#FF9F1C','#FFFFFF'][k%3],o);}}
    cap=caption('Now they all play!',lt,.4);
    pops=pop('Yay!',630,322,104,'#FF5D8F',lt,3.0,-4);
    break;}
  case 6:{
    n=eio(prog(lt,.3,2.4));
    const asleep=lt>2.0;
    chars=shadow(640,522,64)+place(640,520,duck({asleep,eye:blink(t,0)}),{s:1.1,sy:1+.025*Math.sin(lt*2.2),rot:asleep?-3:0});
    for(let k=0;k<3;k++){let q=lt-2.5-k*.9;if(q>0){q%=2.7;
      pops+=`<text x="${745+q*24+8*Math.sin(q*3)}" y="${388-q*46}" font-size="${28+q*11}" fill="#fff" opacity="${Math.sin(Math.PI*q/2.7)*.95}">z</text>`;}}
    cap=caption('Good night, Lulu.',lt,.5);
    pops+=pop('The End',640,210,112,'#FFE58A',lt,3.6,-3,'#2D2A6E');
    break;}
  }
  svg.innerHTML=bg(t,n,behind)+props+chars+nightTint(n)+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=`<defs>${skyGrad('g','#4DB9FF','#DDF5FF')}${CLIP}</defs><rect width="1280" height="720" fill="url(#g)"/>`;
  s+=cloud(120,110,1.3,.95)+sun(3,1185,95);
  s+=`<path d="M0,500 Q300,410 640,480 T1280,470 L1280,720 L0,720Z" fill="#9ADB6F"/>`;
  s+=`<path d="M0,580 Q380,510 760,565 T1280,550 L1280,720 L0,720Z" fill="#6CC24A"/>`;
  s+=flower(600,700,90,'#FF7FB0',0,0,.6)+flower(1060,705,90,'#FFD23F',0,2,.55,'#FF8C1A');
  s+=shadow(330,662,150)+place(322,658,duck({wing:22}),{s:2.15});
  s+=shadow(730,662,62)+place(730,660,frog(),{s:1.1})+shadow(915,662,52)+place(915,660,bunny(),{s:1.1})+place(1105,500,bee({flap:.3}),{s:1.1,rot:-6});
  s+=label(LULU,825,205,200,'#FF5D8F',-3)+label('the Little Duck',825,300,68,'#2D2A6E');
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
