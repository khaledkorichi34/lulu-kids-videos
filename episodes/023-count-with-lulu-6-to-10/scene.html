<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 23 - Count with Lulu: 6 to 10.  Title, one scene per number, finale.
   6 apples, 7 ladybirds, 8 balls, 9 butterflies, 10 flowers. */
const T0=.9, STEP=.6;                          // first thing appears; gap between things
const tcOf=N=>T0+(N-1)*STEP+1.0;               // moment everything has been counted
// scenes: title 4.5 s, then one per number (counting + 2.6 s with the caption), then the finale 7.5 s
const SC=[0,4.5];
for(let N=6;N<=10;N++)SC.push(+(SC[SC.length-1]+tcOf(N)+2.6).toFixed(2));
SC.push(+(SC[SC.length-1]+7.5).toFixed(2));
const DUR=SC[SC.length-1];
const COL=['#FF5D8F','#FF9F1C','#19B8A6','#7B5CFF','#3FA9F5'];
const NAMES=['6 apples','7 ladybirds','8 balls','9 butterflies','10 flowers'];

function badge(x,y,k,col,lt,t0){
  const u=prog(lt,t0+.1,t0+.4);if(u<=0)return '';
  const n=String(k+1);
  return `<g transform="translate(${x},${y}) scale(${back(u)})"><circle r="27" fill="#fff" stroke="${col}" stroke-width="5"/><text y="12" text-anchor="middle" font-size="${n.length>1?30:36}" fill="#2D2A6E">${n}</text></g>`;
}
function hearts(lt,t0){
  let s='';
  for(let k=0;k<9;k++){const q=lt-(t0+k*.4);if(q>0){const y=610-q*120,x=110+k*132+25*Math.sin(q*2+k),o=clamp((y-50)/140)*clamp(q*3)*.9;
    if(y>40)s+=heart(x,y,1+(k%3)*.25,['#FF5D8F','#FF9F1C','#FFFFFF'][k%3],o);}}
  return s;
}
const FL_COL=['#FF5D8F','#FFE14D','#B58CFF','#FF9F1C','#3FA9F5'];
const BF_COL=[['#FF8C42','#FFC94D'],['#B58CFF','#FFB3E0'],['#3FA9F5','#9BE7FF']];

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let props='',chars='',pops='',cap='',o={};
  if(i===0){
    const j=jumps(lt,[1.6,2.6],.6,30);
    chars=shadow(640,522,66,-j.y)+place(640,520+j.y,duck({wing:20+20*Math.sin(lt*9),eye:blink(t,0)}),{s:1.1,sx:j.sx,sy:j.sy});
    pops=pop('Count with',640,128,84,'#2D2A6E',lt,.3)+pop(LULU,640,262,140,'#FF5D8F',lt,.7,-3);
    for(let k=0;k<5;k++)pops+=pop(String(k+6),380+k*130,676,92,COL[k],lt,1.5+k*.3,(k%2?4:-4));
  }else if(i<=5){
    const N=i+5, col=COL[i-1], tc=tcOf(N);
    o={noSun:true,noFlowers:true,noClouds:true};
    const grow=k=>back(prog(lt,T0+k*STEP,T0+k*STEP+.35))*(lt>T0+k*STEP?1:0);
    const cheer=k=>jumps(lt,[tc+.2+k*.06],.55,40);
    const lj=jumps(lt,[tc+.2],.55,12);   // small hop: a bigger one would bump into the big number
    chars=shadow(220,522,52,-lj.y)+place(220,520+lj.y,duck({eye:blink(t,0),wing:lt>tc?30*Math.abs(Math.sin(lt*10)):0}),{s:.9,sx:lj.sx,sy:lj.sy});
    pops=pop(String(N),N===10?235:220,318,N===10?250:290,col,lt,.3,-4);
    for(let k=0;k<N;k++){
      const g=grow(k);if(g<=0)continue;
      const j=cheer(k), tk=T0+k*STEP;
      if(N===6){
        const x=500+k*135;
        props+=shadow(x,522,52,-j.y)+`<g transform="translate(${x},${520+j.y}) scale(${g*j.sx},${g*j.sy})">${apple(0,0,.8)}</g>`;
        pops+=badge(x,322,k,col,lt,tk);
      }else if(N===7){
        const x=470+k*118;
        chars+=shadow(x,522,44,-j.y)+place(x,520+j.y,ladybird({eye:blink(t,k*.7),wiggle:Math.sin(t*4+k)}),{s:.7*g,sx:j.sx,sy:j.sy});
        pops+=badge(x+8,362,k,col,lt,tk);
      }else if(N===8){
        const x=470+k*100, r=38;
        props+=shadow(x,522,34,-j.y)+`<g transform="translate(${x},${520+j.y}) scale(${g})">${ball(0,0,r,(k%2?1:-1)*Math.sin(lt*2+k)*12)}</g>`;
        pops+=badge(x,362,k,col,lt,tk);
      }else if(N===9){
        const x=[640,880,1120][k%3], y0=[180,330,480][Math.floor(k/3)], c=BF_COL[Math.floor(k/3)];
        const y=y0+8*Math.sin(t*2.4+k)+j.y*.6;
        chars+=place(x,y,bigButterfly({flap:.55+.45*Math.abs(Math.sin(t*5+k)),eye:blink(t,k*.5),col:c[0],col2:c[1]}),{s:.42*g});
        pops+=badge(x-82,y0-6,k,col,lt,tk);
      }else{
        const x=450+k*80, h=k%2?170:135, s=.85, c=FL_COL[k%5];
        props+=flower(x,525,h,c,t,k,s*g,k%5===1?'#FF8C1A':'#FFB703');
        pops+=badge(x,525-h*s-75,k,col,lt,tk);
      }
    }
    cap=caption(NAMES[i-1],lt,tc-.2);
  }else{
    const j=jumps(lt,[3.5,4.6,5.7],.6,35);
    o={noSun:true,noClouds:true};
    props=hearts(lt,3.2);
    chars=shadow(640,522,66,-j.y)+place(640,520+j.y,duck({wing:25+25*Math.sin(lt*10),eye:blink(t,0)}),{s:1.1,sx:j.sx,sy:j.sy});
    const X=[180,400,620,840,1080];
    for(let k=0;k<5;k++)pops+=pop(String(k+6),X[k],215,170,COL[k],lt,.4+k*.5,(k%2?5:-5));
    cap=caption('Great counting!',lt,3.2);
  }
  svg.innerHTML=bg(t,0,'',o)+props+chars+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=`<defs>${skyGrad('g','#4DB9FF','#DDF5FF')}${CLIP}</defs><rect width="1280" height="720" fill="url(#g)"/>`;
  s+=cloud(130,110,1.3,.95)+sun(3,1185,95);
  s+=`<path d="M0,500 Q300,410 640,480 T1280,470 L1280,720 L0,720Z" fill="#9ADB6F"/>`;
  s+=`<path d="M0,580 Q380,510 760,565 T1280,550 L1280,720 L0,720Z" fill="#6CC24A"/>`;
  s+=shadow(330,662,150)+place(322,658,duck({wing:22}),{s:2.15});
  s+=label('6',660,330,230,COL[0],-6)+label('to',830,300,90,'#2D2A6E')+label('10',1010,330,230,COL[4],4);
  s+=label('Count with',820,460,70,'#2D2A6E')+label(LULU,820,610,150,'#FF5D8F',-2);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
