<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 26 - ABC with Lulu: letters P to T with a first word each. Title, one scene per letter, finale. */
const SC=[0,4.5,12.5,20.5,28.5,36.5,44.5,51];
const DUR=SC[SC.length-1];
const INK='#2D2A6E';
// letter scene timing: letter pops at TL, the thing appears at TT, caption 1 at C1, Lulu hops + caption 2 at C2
const TL=.5, TT=1.6, C1=2.0, C2=4.8;
const L=[['P','p','pear','#7CB518'],['Q','q','quack','#FF5D8F'],['R','r','rainbow','#E63946'],['S','s','snail','#F28C28'],['T','t','turtle','#2FA37A']];
const grow=(lt,t0)=>lt>t0?back(prog(lt,t0,t0+.45)):0;
const letterPop=(k,x,y,size,lt,t0)=>pop(`${L[k][0]} ${L[k][1]}`,x,y,size,L[k][3],lt,t0,k%2?3:-3);
const word=k=>`<tspan fill="${L[k][3]}">${L[k][2][0]}</tspan>${L[k][2].slice(1)}`;
const X=820;
const wobble=(lt,t0)=>lt>t0?6*Math.sin((lt-t0)*6)*clamp(1-(lt-t0)/2):0;
function sparkles(x,y,lt,t0){let sp='';
  if(lt>t0)for(let m=0;m<4;m++){const q=lt-t0-m*.3;if(q>0&&q<1.2)sp+=sparkle(x+[-110,115,-90,100][m],[380,350,450,430][m],1.2,clamp(1-q/1.2));}
  return sp;}
// a speech bubble that grows from its centre
function bubble2(x,y,w,h,tx,ty,txt,size,g,rot=0){
  if(g<=0)return '';
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${g}) translate(${-x},${-y})">${speech(x,y,w,h,tx,ty,txt,size,L[1][3])}</g>`;
}

function thing(k,lt,t,g){
  if(g<=0)return '';
  if(k===0)return shadow(X,522,74*g)+`<g transform="rotate(${wobble(lt,C2)} ${X} 520)">${pear(X,520,1.15*g)}</g>`+sparkles(X,0,lt,C2);
  if(k===1){const r=wobble(lt,TT+.3)+wobble(lt,C2);
    return bubble2(790,385,190,88,400,425,'Quack!',76,g,r);}
  if(k===3){const x=lerp(1160,X,eout(prog(lt,TT,TT+3)));
    return shadow(x+10,522,120)+place(x,520,snail({eye:blink(t,.6),look:Math.sin(lt*2)}),{s:1.1});}
  if(k===4){const u=prog(lt,TT,TT+3), x=lerp(1170,X,u);
    return shadow(x,522,100)+place(x,520,turtle({eye:blink(t,1.1),step:u<1?lt*7:0}),{s:1.3});}
  return '';
}

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let props='',chars='',pops='',cap='',o={noSun:true,noClouds:true},n=0,behind='';
  if(i===0){
    o={};
    const j=jumps(lt,[1.4,2.4],.6,30);
    chars=shadow(640,522,66,-j.y)+place(640,520+j.y,duck({wing:20+20*Math.sin(lt*9),eye:blink(t,0)}),{s:1.1,sx:j.sx,sy:j.sy});
    pops=pop('ABC with',640,128,84,INK,lt,.3)+pop(LULU,640,262,140,'#FF5D8F',lt,.7,-3);
    L.forEach((l,k)=>{pops+=pop(l[0],240+k*200,680,96,l[3],lt,1.5+k*.3,k%2?5:-5);});
  }else if(i<=5){
    const k=i-1;
    if(k===2){ // R is for rainbow: a soft rainbow grows across the sky behind the hills
      behind=rainbow(X+20,520,290,eio(prog(lt,TT,TT+2.2)),.9);
    }
    const hops=k===1?[TT-.05,C2+.1]:[C2+.1];
    const j=jumps(lt,hops,.6,26);
    chars=shadow(300,522,52,-j.y)+place(300,520+j.y,duck({eye:blink(t,.3),wing:(lt>C2||(k===1&&lt>TT-.1&&lt<TT+.8))?20*Math.abs(Math.sin(lt*9)):0}),{s:.85,sx:j.sx,sy:j.sy});
    chars+=thing(k,lt,t,grow(lt,TT));
    if(k===2&&lt>C2)chars+=sparkles(X,0,lt,C2);
    pops=letterPop(k,640,200,170,lt,TL);
    cap=lt>=C2?caption(`${L[k][0]}, ${L[k][1]}, ${word(k)}!`,lt,C2,`${L[k][0]}, ${L[k][1]}, ${L[k][2]}!`):caption(`${L[k][0]} is for ${word(k)}`,lt,C1,`${L[k][0]} is for ${L[k][2]}`);
  }else{
    o={noClouds:true,noSun:true,noFlowers:true};
    const xs=[160,400,640,880,1120];
    L.forEach((l,k)=>{
      const g=grow(lt,.3+k*.35), x=xs[k], j=jumps(lt,[3.9+k*.12],.55,20);
      if(g>0){
        if(k===0)chars+=shadow(x,522,56*g,-j.y)+pear(x,520+j.y,.78*g);
        if(k===1)chars+=shadow(x,522,40*g,-j.y)+place(x-20,520+j.y,duck({eye:blink(t,.5)}),{s:.55*g})+bubble2(x,372,78,38,x+18,440,'Quack!',32,g);
        if(k===2)chars+=rainbow(x,516+j.y,118*g,1,.95);
        if(k===3)chars+=shadow(x,522,70*g,-j.y)+place(x,520+j.y,snail({eye:blink(t,.9)}),{s:.55*g});
        if(k===4)chars+=shadow(x,522,60*g,-j.y)+place(x-10,520+j.y,turtle({eye:blink(t,1.4)}),{s:.65*g});
      }
      pops+=pop(l[0],x,230,120,l[3],lt,.3+k*.35,k%2?4:-4);
    });
    cap=lt>=3.8?caption('Well done!',lt,3.8):caption('P, Q, R, S, T!',lt,1.2);
  }
  svg.innerHTML=bg(t,n,behind,o)+props+chars+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=`<defs>${skyGrad('g','#4DB9FF','#DDF5FF')}${CLIP}</defs><rect width="1280" height="720" fill="url(#g)"/>`;
  s+=rainbow(640,700,420,1,.9);
  s+=`<path d="M0,500 Q300,410 640,480 T1280,470 L1280,720 L0,720Z" fill="#9ADB6F"/>`;
  s+=`<path d="M0,580 Q380,510 760,565 T1280,550 L1280,720 L0,720Z" fill="#6CC24A"/>`;
  s+=shadow(640,662,120)+place(620,658,duck({wing:30}),{s:1.8});
  s+=shadow(230,662,90)+pear(230,662,1.25);
  s+=shadow(1060,662,110)+place(1050,660,turtle({}),{s:1.25});
  s+=label('P',230,380,150,L[0][3],-6)+label('T',1060,430,150,L[4][3],6);
  s+=label('ABC with',640,120,96,INK)+label(LULU,640,230,96,'#FF5D8F',-3);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
