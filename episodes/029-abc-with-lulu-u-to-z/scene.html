<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 29 - ABC with Lulu: letters U to Z with a first word each. Title, one scene per letter, finale. */
const SC=[0,4.5,12.5,20.5,28.5,36.5,44.5,52.5,60];
const DUR=SC[SC.length-1];
const INK='#2D2A6E';
// letter scene timing: letter pops at TL, the thing appears at TT, caption 1 at C1, Lulu hops + caption 2 at C2
const TL=.5, TT=1.6, C1=2.0, C2=4.8;
const L=[['U','u','umbrella','#E63946'],['V','v','vase','#7B5CFF'],['W','w','watermelon','#2FA37A'],['X','x','xylophone','#FF8C1A'],['Y','y','yogurt','#FF5D8F'],['Z','z','zebra','#2979E8']];
const grow=(lt,t0)=>lt>t0?back(prog(lt,t0,t0+.45)):0;
const letterPop=(k,x,y,size,lt,t0)=>pop(`${L[k][0]} ${L[k][1]}`,x,y,size,L[k][3],lt,t0,k%2?3:-3);
const word=k=>`<tspan fill="${L[k][3]}">${L[k][2][0]}</tspan>${L[k][2].slice(1)}`;
const X=820;
const wobble=(lt,t0)=>lt>t0?6*Math.sin((lt-t0)*6)*clamp(1-(lt-t0)/2):0;
function sparkles(x,lt,t0){let sp='';
  if(lt>t0)for(let m=0;m<4;m++){const q=lt-t0-m*.3;if(q>0&&q<1.2)sp+=sparkle(x+[-120,125,-100,110][m],[380,350,450,430][m],1.2,clamp(1-q/1.2));}
  return sp;}
// gentle rain from the little cloud onto Lulu's umbrella (cx = umbrella centre)
function rain(cx,lt,t0){
  if(lt<t0)return '';let s='';
  for(let m=0;m<9;m++){const dx=[-80,-40,0,40,80,-60,-20,20,60][m], ph=m*.23;
    const q=((lt-t0+ph)%0.9)/0.9, x=cx+dx, yEnd=297-77*(1-Math.pow(dx/119,2));
    if(lt-t0+ph<0.9&&lt-t0<ph)continue;
    s+=raindrop(x,lerp(150,yEnd,q),.9,clamp((1-q)*4));}
  return s;}
// xylophone with a mallet tapping the six bars in turn from t0 (one bar every .35 s)
const TAP=.35;
function xylo(x,lt,g,t0){
  const k=Math.floor((lt-t0)/TAP), on=lt>=t0&&k<6, ht=on?lt-t0-k*TAP:0, s=1.1*g;
  let m;
  if(on){const bx=x+(-125+k*50)*s, by=520-(72+(110-k*12)/2)*s-4, lift=Math.abs(Math.sin(ht/TAP*Math.PI))*26;
    m=xyloMallet(bx+8,by-lift,1,20);}
  else m=lt<t0?'':xyloMallet(x+190*s,520-6,1,-160);
  return shadow(x,524,180*g)+xylophone(x,520,s,on?k:-1,ht)+m;
}

function thing(k,lt,t,g){
  if(g<=0)return '';
  if(k===1)return shadow(X,522,70*g)+`<g transform="rotate(${wobble(lt,C2)} ${X} 520)">${vase(X,520,1.1*g,t)}</g>`+sparkles(X,lt,C2);
  if(k===2)return shadow(X,522,150*g)+`<g transform="rotate(${wobble(lt,C2)*.6} ${X} 520)">${watermelon(X,520,1.1*g)}</g>`+sparkles(X,lt,C2);
  if(k===3)return xylo(X,lt,g,TT+.7);
  if(k===4)return shadow(X,522,76*g)+`<g transform="rotate(${wobble(lt,C2)} ${X} 520)">${yogurt(X,520,1.1*g)}</g>`+sparkles(X,lt,C2);
  if(k===5){const u=prog(lt,TT,TT+3), x=lerp(1180,X,eout(u));
    return shadow(x+10,522,110)+place(x,520,zebra({eye:blink(t,1.1),step:u<1?lt*7:0,tail:Math.sin(lt*3),nod:lt>C2?5*Math.sin((lt-C2)*6)*clamp(1-(lt-C2)/2):0}),{s:1});}
  return '';
}

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let props='',chars='',pops='',cap='',o={noSun:true,noClouds:true},n=0,behind='';
  if(i===0){
    o={};
    const j=jumps(lt,[1.4,2.4],.6,30);
    chars=shadow(640,522,66,-j.y)+place(640,520+j.y,duck({wing:20+20*Math.sin(lt*9),eye:blink(t,0)}),{s:1.1,sx:j.sx,sy:j.sy});
    pops=pop('ABC with',640,128,84,INK,lt,.3)+pop(LULU,640,262,140,'#FF5D8F',lt,.7,-3);
    L.forEach((l,k)=>{pops+=pop(l[0],190+k*180,680,96,l[3],lt,1.5+k*.3,k%2?5:-5);});
  }else if(i<=6){
    const k=i-1;
    const j=jumps(lt,[C2+.1],.6,26);
    if(k===0){ // U is for umbrella: Lulu opens her umbrella and a little rain cloud sprinkles on it
      const g=prog(lt,TT,TT+.8);
      props=rainCloud(325,105,.85,blink(t,.4))+rain(325,lt,TT+.9);
      if(lt>TT)chars+=umbrella(325,520-62+j.y,.95,eout(g),wobble(lt,C2)*.6);
      chars+=shadow(300,522,52,-j.y)+place(300,520+j.y,duck({eye:blink(t,.3),wing:-20}),{s:.85,sx:j.sx,sy:j.sy});
      if(lt>C2)chars+=sparkles(330,lt,C2).replace(/x=/g,'x=');
    }else{
      chars=shadow(300,522,52,-j.y)+place(300,520+j.y,duck({eye:blink(t,.3),wing:lt>C2?20*Math.abs(Math.sin(lt*9)):0}),{s:.85,sx:j.sx,sy:j.sy});
      chars+=thing(k,lt,t,grow(lt,TT));
    }
    pops=letterPop(k,640,200,170,lt,TL);
    cap=lt>=C2?caption(`${L[k][0]}, ${L[k][1]}, ${word(k)}!`,lt,C2,`${L[k][0]}, ${L[k][1]}, ${L[k][2]}!`):caption(`${L[k][0]} is for ${word(k)}`,lt,C1,`${L[k][0]} is for ${L[k][2]}`);
  }else{
    o={noClouds:true,noSun:true,noFlowers:true};
    const xs=[130,340,550,760,970,1170];
    L.forEach((l,k)=>{
      const g=grow(lt,.3+k*.35), x=xs[k], j=jumps(lt,[4.2+k*.12],.55,20);
      if(g>0){
        if(k===0)chars+=shadow(x,522,50*g,-j.y)+umbrella(x+10,520+j.y,.62*g,1,-6);
        if(k===1)chars+=shadow(x,522,46*g,-j.y)+vase(x,520+j.y,.62*g,t);
        if(k===2)chars+=shadow(x,522,80*g,-j.y)+watermelon(x,520+j.y,.6*g);
        if(k===3)chars+=shadow(x,522,95*g,-j.y)+xylophone(x,520+j.y,.56*g);
        if(k===4)chars+=shadow(x,522,48*g,-j.y)+yogurt(x,520+j.y,.66*g);
        if(k===5)chars+=shadow(x,522,60*g,-j.y)+place(x-14,520+j.y,zebra({eye:blink(t,1.4),tail:Math.sin(lt*3)}),{s:.62*g});
      }
      pops+=pop(l[0],x,230,120,l[3],lt,.3+k*.35,k%2?4:-4);
    });
    cap=lt>=4.1?caption('Well done!',lt,4.1):caption('U, V, W, X, Y, Z!',lt,1.4);
  }
  svg.innerHTML=bg(t,n,behind,o)+props+chars+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=`<defs>${skyGrad('g','#4DB9FF','#DDF5FF')}${CLIP}</defs><rect width="1280" height="720" fill="url(#g)"/>`;
  s+=`<path d="M0,500 Q300,410 640,480 T1280,470 L1280,720 L0,720Z" fill="#9ADB6F"/>`;
  s+=`<path d="M0,580 Q380,510 760,565 T1280,550 L1280,720 L0,720Z" fill="#6CC24A"/>`;
  s+=shadow(230,662,140)+watermelon(230,660,1.05);
  s+=shadow(1060,662,110)+place(1040,660,zebra({}),{s:1.2});
  s+=shadow(640,662,110)+umbrella(650,658-118,1.25,1,0)+place(610,658,duck({wing:-20}),{s:1.6});
  s+=label('W',250,470,150,L[2][3],-6)+label('Z',1110,330,150,L[5][3],6);
  s+=label('ABC with',640,92,86,INK)+label(LULU,640,182,86,'#FF5D8F',-3);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
