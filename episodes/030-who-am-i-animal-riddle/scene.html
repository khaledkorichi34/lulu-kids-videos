<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 30 - Who am I? An animal riddle.  Title, three clues (I eat grass, I look a bit like a horse
   (ears peek over the bush), black and white stripes), "Who am I?", the reveal (a zebra walks out),
   fact 1 (every zebra has its own stripes), fact 2 (a baby zebra is called a foal), goodbye. */
const SC=[0,5.5,12.5,19.5,26.5,32.5,39.5,46.5,53.5,60], DUR=60;
const NAVY='#2D2A6E', PURPLE='#7B5CFF', GREEN='#1F7F37', ORANGE='#E76F2E', INK='#2D2A3A';
const BX=740, BS=1.5, ZS=.85;                      // bush centre and scale, zebra scale
const lulu=(x,lt,t,hops,h=20,s=.95,wave=false,flip=false)=>{
  const j=jumps(lt,hops,.6,h), w=wave?20+20*Math.sin(lt*9):0;
  return shadow(x,522,56*s/.95,-j.y)+place(x,520+j.y,duck({eye:blink(t,0),wing:w}),{s,sx:j.sx,sy:j.sy,flip});
};
const qmark=(t)=>label('?',BX,470+4*Math.sin(t*3),110,'#fff',0,GREEN,.12);
const grow=(lt,t0)=>lt>t0?back(prog(lt,t0,t0+.4)):0;
const Z=(x,t,o={},s=ZS,flip=false,y=520)=>place(x,y,zebra(Object.assign({eye:blink(t,.5),tail:Math.sin(t*2.2)},o)),{s,flip});
function icon(x,y,g,inner){
  if(g<=0)return '';
  return `<g transform="translate(${x},${y}) scale(${g})"><defs><clipPath id="ic"><circle r="88"/></clipPath></defs>
  <circle r="92" fill="#fff" stroke="#FFD23F" stroke-width="7"/><g clip-path="url(#ic)">${inner}</g></g>`;
}
function grassIcon(t){
  let s='<rect x="-100" y="30" width="200" height="70" fill="#8FD16A"/>';
  const bl=[[-50,-40],[-25,-60],[0,-70],[25,-58],[50,-42],[-38,-20],[38,-22]];
  bl.forEach((b,k)=>{const sw=6*Math.sin(t*2+k);s+=`<path d="M${b[0]-10},40 Q${b[0]+sw},${b[1]} ${b[0]+sw*1.5},${b[1]-10} Q${b[0]+4},${b[1]+30} ${b[0]+10},40 Z" fill="${k%2?'#3FA34D':'#57B947'}"/>`;});
  return s;
}
function stripeIcon(){
  let s='<rect x="-100" y="-100" width="200" height="200" fill="#fff"/>';
  for(let k=-3;k<=3;k++)s+=`<path d="M${k*44-12},-100 Q${k*44+14},0 ${k*44-12},100" stroke="${INK}" stroke-width="20" fill="none"/>`;
  return s;
}
function sparkles(x,y,lt,t0){
  const u=prog(lt,t0,t0+1.2);if(u<=0||u>=1)return '';
  let s='';for(let k=0;k<6;k++){const a=k*Math.PI/3+.4, d=40+u*110;s+=sparkle(x+Math.cos(a)*d,y+Math.sin(a)*d*.7,1.3,1-u);}
  return s;
}

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let props='',chars='',pops='',cap='',o={noClouds:true};
  const sky=cloud(130+10*Math.sin(t*.3),100,.9,.95)+(i>=6&&i<=7?'':cloud(430+8*Math.sin(t*.25+1),255,.75,.9));
  if(i===0){
    chars=lulu(330,lt,t,[1.3,2.3],30,1.1,true);
    props=bush(BX+170,520,1.1);
    pops=pop('Who am I?',640,165,120,PURPLE,lt,.3,-3);
    cap=caption('A riddle with '+LULU,lt,1.8);
  }else if(i>=1&&i<=3){
    const N=i;
    if(N===2){ // the ears peek over the bush and wiggle
      const up=80*(prog(lt,1.4,2.2)-prog(lt,5.4,6.2));
      props+=Z(BX-30,t,{nod:6*Math.sin(lt*3)},ZS,false,520-up);
    }
    props+=bush(BX,520,BS)+qmark(t);
    if(N===1)props+=icon(1110,370,grow(lt,2.4),grassIcon(t));
    if(N===3)props+=icon(1110,370,grow(lt,2.4),stripeIcon());
    chars=lulu(230,lt,t,[3.2]);
    pops=pop('Clue '+N,640,150,100,ORANGE,lt,.3);
    cap=caption(['','I eat grass all day long.','I look a bit like a horse.','I have black and white stripes.'][N],lt,1.2);
  }else if(i===4){
    props=bush(BX+18*Math.sin(lt*14)*prog(lt,4.2,4.5)*(1-prog(lt,5.6,6)),520,BS)+qmark(t);
    chars=lulu(230,lt,t,[]);
    pops=pop('grass',360,160,64,GREEN,lt,.3)+pop('horse',640,160,64,ORANGE,lt,.9)+pop('stripes',920,160,64,INK,lt,1.5);
    cap=caption('Who am I? Can you guess?',lt,2.2);
  }else if(i===5){
    const u=eio(prog(lt,.5,3.5)), zx=lerp(BX-30,1010,u), walking=u>0&&u<1;
    props=shadow(zx+20,522,150)+Z(zx,t,{step:walking?lt*9:0,nod:lt>3.6?6*Math.sin(lt*5):0});
    props+=bush(BX-170,520,1.2);
    props+=sparkles(zx+20,400,lt,3.6);
    chars=lulu(230,lt,t,[3.9,4.6],30,.95,lt>3.8);
    pops=pop('A zebra!',640,165,120,ORANGE,lt,3.6,-3);
    cap=caption('I am a zebra!',lt,4.1);
  }else if(i===6){
    o={noFlowers:true,noClouds:true};
    const ZX=700;
    props=shadow(ZX+30,522,220)+Z(ZX,t,{nod:4*Math.sin(lt*1.6)},1.3);
    chars=lulu(170,lt,t,[],0,.85);
    pops=pop('Did you know?',640,150,86,PURPLE,lt,.3);
    const a1=prog(lt,1.4,1.8);
    if(a1>0)pops+=`<path d="M470,320 Q540,300 600,350" stroke="${NAVY}" stroke-width="7" fill="none" stroke-linecap="round" opacity="${a1}"/>`+pop('stripes',400,320,62,INK,lt,1.4);
    cap=lt<4.4?caption('Every zebra has its own stripes.',lt,1.4):caption('No two zebras are the same!',lt,4.4);
  }else if(i===7){
    o={noFlowers:true,noClouds:true};
    const fx=lerp(1040,930,eio(prog(lt,.3,2.2)));
    props=shadow(620,522,180)+Z(600,t,{nod:5*Math.sin(lt*1.4),v:1},1.1);
    props+=shadow(fx+12,522,100)+Z(fx,t,{v:2,step:lt<2.2?lt*10:0,nod:-6*Math.sin(lt*2)},.6,true);
    chars=lulu(170,lt,t,[],0,.85);
    pops=pop('Did you know?',640,150,86,PURPLE,lt,.3);
    const a2=prog(lt,2.4,2.8);
    if(a2>0)pops+=`<path d="M1060,300 Q1060,340 1010,372" stroke="${NAVY}" stroke-width="7" fill="none" stroke-linecap="round" opacity="${a2}"/>`+pop('foal',1090,285,62,ORANGE,lt,2.4);
    cap=lt<4.4?caption('A baby zebra is called a foal.',lt,1.2):caption('The foal stays close to its mum.',lt,4.4);
  }else{
    props=heart(640,300+6*Math.sin(t*3),1.4,'#FF7FB0',.85*prog(lt,2,2.5))+heart(700,250+6*Math.sin(t*3+1),1,'#FF9AA2',.85*prog(lt,2.3,2.8));
    props+=shadow(830,522,150)+Z(840,t,{v:1,nod:5*Math.sin(lt*3)},ZS,true);
    props+=shadow(1060,522,90)+Z(1070,t,{v:2,nod:-6*Math.sin(lt*3)},.55,true);
    chars=lulu(400,lt,t,[1.0,1.8],26,.95,true);
    pops=pop('Bye bye!',640,160,110,PURPLE,lt,.4,-2);
    cap=caption('Bye bye, zebras!',lt,1.6);
  }
  svg.innerHTML=bg(t,0,'',o)+sky+props+chars+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=`<defs>${skyGrad('g','#4DB9FF','#DDF5FF')}${CLIP}</defs><rect width="1280" height="720" fill="url(#g)"/>`;
  s+=cloud(140,110,1.2,.95);
  s+=`<path d="M0,500 Q300,410 640,480 T1280,470 L1280,720 L0,720Z" fill="#9ADB6F"/>`;
  s+=`<path d="M0,580 Q380,510 760,565 T1280,550 L1280,720 L0,720Z" fill="#6CC24A"/>`;
  s+=shadow(175,662,100)+place(170,658,duck({wing:22}),{s:1.5});
  s+=place(960,646,zebra({}),{s:.85})+bush(950,665,1.35)+label('?',950,590,170,'#fff',0,GREEN,.12);
  s+=label('Who',640,190,150,'#FF5D8F',-3)+label('am I?',660,350,150,PURPLE,-3);
  s+=label('A riddle with '+LULU,640,465,60,NAVY);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
