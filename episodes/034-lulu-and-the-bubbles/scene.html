<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 34 - Lulu and the Bubbles. Lulu has a bubble wand and blows bubbles (whoosh!).
   Pip the kitten hops and pops them (pop, pop, pop). Lulu blows slowly and makes a big, big bubble;
   it floats over to Bunny and pops on her nose (hee hee!). The sun goes down, bye-bye bubbles,
   and the three friends fall asleep while one last little bubble floats up into the night sky. */
const DUR=48, SC=[0,5,12,19,26,33,40,48];
const NAVY='#2D2A6E', PINK='#FF5D8F', PURPLE='#7B5CFF', GOLD='#FFE58A';
const LX=320, BX=680, PX=1000;
const RING=[LX+150,410];                       // centre of the wand's ring while Lulu blows
const hsh=k=>{const v=Math.sin(k*12.9898+34.7)*43758.5453;return v-Math.floor(v);};

const lulu=(lt,t,o={})=>{
  const x=o.x!=null?o.x:LX, j=jumps(lt,o.hops||[],.6,o.h||26), w=o.wave?20+20*Math.sin(lt*9):0;
  let s=shadow(x,522,60,-j.y)+place(x,520+j.y,duck({eye:o.eye!=null?o.eye:blink(t,0),wing:w,asleep:o.asleep}),{s:1,sx:j.sx,sy:j.sy*(o.sy||1),rot:o.rot||0});
  if(o.wand)s+=bubbleWand(x+150,410+j.y,.8,35);
  return s;
};
const bunnyAt=(lt,t,o={})=>{
  const x=o.x!=null?o.x:BX, j=jumps(lt,o.hops||[],.5,o.h||26);
  return shadow(x,522,52,-j.y)+place(x,520+j.y,bunny({eye:o.eye!=null?o.eye:blink(t,.8),ear:o.ear||0}),{s:1,sx:j.sx,sy:j.sy*(o.sy||1)});
};
const pip=(lt,t,o={})=>{
  const x=o.x!=null?o.x:PX, j=jumps(lt,o.hops||[],.6,o.h||26);
  return shadow(x,522,56,-j.y)+place(x,520+j.y+(o.bob||0),kitten({eye:o.eye!=null?o.eye:blink(t,1.3),tail:Math.sin(t*2.2),asleep:o.asleep,tilt:o.tilt||0}),{s:.95,sx:j.sx,sy:j.sy*(o.sy||1)});
};
const hopList=(a,b,step)=>{const r=[];for(let s=a;s<b-.01;s+=step)r.push(s);return r;};
// a stream of little bubbles from the wand: one every `every` seconds between a and b (scene time)
function stream(lt,t,a,b,every,id,maxX=1240){
  let s='';
  for(let k=0;;k++){const tb=a+k*every;if(tb>=b||tb>lt)break;
    const age=lt-tb, life=4.2;if(age>life)continue;
    const h1=hsh(k+id*50),h2=hsh(k+id*50+.5),h3=hsh(k+id*50+.25);
    const r=(22+16*h1)*eout(clamp(age/.35));
    const x=RING[0]+28+age*(80+50*h2), y=RING[1]-age*(18+38*h3)+16*Math.sin(age*2.2+k);
    if(x>maxX)continue;
    const o=Math.min(1,(life-age)/.6,(maxX-x)/90);
    s+=soapBubble(x,y,r,o,t+k);
  }
  return s;
}
const sideClouds=(t,n)=>cloud(130+12*Math.sin(t*.3),262,.6,1-n*.85);

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let n=0,props='',chars='',bub='',pops='',cap='',o={},behind='';
  switch(i){
  case 0:{
    // title: Lulu blows bubbles
    chars=lulu(lt,t,{wand:true,hops:[.4],h:20});
    bub=stream(lt,t,1.1,5,.32,0);
    pops=pop(`${LULU}<tspan fill="${NAVY}">’s Bubbles</tspan>`,590,165,104,PINK,lt,.4,-3);
    break;}
  case 1:{
    // Lulu has a bubble wand; she blows: whoosh!
    const puff=lt>2.8&&lt<3.4?1+.06*Math.sin(Math.PI*prog(lt,2.8,3.4)):1;
    chars=lulu(lt,t,{wand:true,sy:puff,hops:[6.4],h:22});
    bub=stream(lt,t,3.1,6.6,.25,1);
    cap=lt<2.8?caption('Lulu has a bubble wand.',lt,.3):caption('She blows. Whoosh!',lt,2.8);
    pops=pop('Bubbles!',760,165,96,PURPLE,lt,3.8,-3);
    break;}
  case 2:{
    // Pip the kitten comes and pops the bubbles: pop, pop, pop!
    const w=eio(prog(lt,.3,2.2)), px=lerp(1440,PX,w);
    const HOP=[3.3,4.2,5.1], tgt=[[PX-16,262],[PX+8,258],[PX-4,262]];
    chars=lulu(lt,t,{wand:true,hops:[6.0],h:22})+pip(lt,t,{x:px,bob:w>0&&w<1?-8*Math.abs(Math.sin(lt*7)):0,hops:HOP,h:40});
    HOP.forEach((h,k)=>{const tp=h+.3, ts=tp-2.6, u=prog(lt,ts,tp);
      if(lt>=ts&&lt<tp){const q=u, x=lerp(RING[0]+30,tgt[k][0],q), y=lerp(RING[1],tgt[k][1],q)-30*Math.sin(Math.PI*q);
        bub+=soapBubble(x,y,30*eout(clamp((lt-ts)/.35)),1,t+k);}
      bub+=bubblePop(tgt[k][0],tgt[k][1],30,prog(lt,tp,tp+.5));});
    cap=lt<3.0?caption('Here comes Pip!',lt,.3):caption('Pop! Pop! Pop!',lt,3.0);
    pops=pop('Hello, Pip!',640,160,80,PURPLE,lt,2.3,-3);
    break;}
  case 3:{
    // Lulu blows slowly: a big, big bubble
    const g=eio(prog(lt,.8,3.0)), R=70*g, fl=eio(prog(lt,3.4,6.6));
    const bx=lerp(RING[0]+R+4,700,fl), by=lerp(RING[1]-R*.15,300,fl)+6*Math.sin(lt*2);
    const puff=lt>.8&&lt<3?1+.04*Math.sin(lt*3):1;
    chars=lulu(lt,t,{wand:true,sy:puff})+pip(lt,t,{tilt:lt>3?-10:0,hops:[3.4],h:22});
    if(R>1)bub=soapBubble(bx,by,R,1,t*.5);
    cap=lt<3.0?caption('Lulu blows slowly.',lt,.3):caption('A big, big bubble!',lt,3.0);
    pops=pop('Wow!',880,165,96,PINK,lt,3.4,4);
    break;}
  case 4:{
    // Bunny hops in; the big bubble lands on her nose: pop! hee hee!
    const w=eio(prog(lt,.3,2.4)), bx=lerp(-120,BX,w);
    const fl=eio(prog(lt,0,3.6)), x=lerp(700,BX+4,fl), y=lerp(300,330,fl)+6*Math.sin(lt*2)*(1-fl);
    const giggle=lt>4&&lt<6?3*Math.sin(lt*16):0;
    chars=bunnyAt(lt,t,{x:bx,hops:w<1?hopList(.3,2.4,.5):[4.2],h:24,ear:giggle*3,eye:lt>4&&lt<5.5?.15:null})
      +lulu(lt,t,{hops:[4.4],h:22})+pip(lt,t,{hops:[4.6],h:22});
    props=bubbleWand(LX+110,516,.8,-90);
    if(lt<3.8)bub=soapBubble(x,y,70,1,t*.5);
    bub+=bubblePop(BX+4,330,70,prog(lt,3.8,4.5));
    cap=lt<3.8?caption('Here comes Bunny!',lt,.3):caption('Pop! Bunny giggles.',lt,3.8);
    pops=pop('Hee hee!',640,160,90,PURPLE,lt,4.2,-3);
    break;}
  case 5:{
    // sunset: bye-bye, bubbles
    n=lerp(0,.45,eio(prog(lt,2.5,7))); o={noSun:true,noMoon:true};
    behind=sun(t,1150,lerp(100,560,eio(prog(lt,2.5,7))));
    chars=lulu(lt,t,{wand:true})+bunnyAt(lt,t,{hops:[2.0,5.0],h:22})+pip(lt,t,{hops:[2.4,5.4],h:22});
    bub=stream(lt,t,.4,4.4,.35,5);
    cap=lt<3.6?caption('The sun goes down.',lt,.3):caption('Bye-bye, bubbles!',lt,3.6);
    break;}
  case 6:{
    // night: the friends sleep; one last little bubble floats up into the sky
    n=lerp(.45,1,eio(prog(lt,0,4))); o={noSun:true};
    props=bubbleWand(LX+110,516,.8,-90);
    const asleep=lt>1.6, br=k=>1+.025*Math.sin(lt*2.2+k);
    chars=shadow(LX,522,60)+place(LX,520,duck({asleep,eye:.45}),{s:1,sy:br(0),rot:asleep?-3:0})
         +shadow(BX,522,52)+place(BX,520,bunny({eye:asleep?.12:.45}),{s:1,sy:br(2)})
         +pip(lt,t,{asleep,eye:.45,sy:br(1)});
    const u=prog(lt,.6,7.4);
    if(u>0&&u<1)bub=soapBubble(lerp(450,520,u)+18*Math.sin(lt*1.6),lerp(470,230,u),28,Math.min(1,u*6,(1-u)*5),t);
    for(let k=0;k<3;k++){let q=lt-2.0-k*.9;if(q>0){q%=2.7;
      pops+=`<text x="${BX+40-q*24+8*Math.sin(q*3)}" y="${300-q*30}" font-size="${28+q*11}" fill="#fff" opacity="${Math.sin(Math.PI*q/2.7)*.95}">z</text>`;}}
    cap=caption('Good night, friends.',lt,.5);
    pops+=pop('The End',640,150,112,GOLD,lt,4.2,-3,NAVY);
    break;}
  }
  o.noClouds=true;
  svg.innerHTML=bg(t,n,sideClouds(t,n)+behind,o)+props+chars+bub+nightTint(n)+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=`<defs>${skyGrad('g','#5EC2FF','#DDF5FF')}${CLIP}</defs><rect width="1280" height="720" fill="url(#g)"/>`;
  s+=cloud(150,270,.7,1);
  s+=`<path d="M0,440 Q300,360 640,420 T1280,410 L1280,720 L0,720Z" fill="#9ADB6F"/>`;
  s+=`<path d="M0,520 Q380,470 760,505 T1280,490 L1280,720 L0,720Z" fill="#6CC24A"/>`;
  s+=place(250,650,duck({wing:22}),{s:1.25})+bubbleWand(250+150*1.25,650-110*1.25,1,35);
  s+=place(1040,650,kitten({tail:.5,tilt:-8}),{s:1.15});
  [[560,430,46,0],[700,330,70,1],[880,420,38,2],[640,540,30,3],[860,290,30,4],[1000,330,24,5]].forEach(b=>{s+=soapBubble(b[0],b[1],b[2],1,b[3]*1.7);});
  s+=label(`${LULU}<tspan fill="${NAVY}">’s Bubbles</tspan>`,640,150,130,PINK,-2);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
