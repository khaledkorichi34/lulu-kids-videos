<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script src="../../toolkit/rhymes.js"></script>
<script>
/* Episode 39 - Twinkle, Twinkle, Little Star by the pond (sing-along, second time for this rhyme, new
   setting and cast). Evening by a pond: the big star shines and its reflection twinkles in the water;
   Owl sits on a branch and flaps on every "twinkle"; verse 2: a little turtle walks in to listen;
   ending: Lulu and Turtle sleep, Owl keeps watch, "Good night, little star!" */
const BPM=92, START=5.0;
const LINES=rhymeTimes(RHYMES.twinkle,START,2,4,BPM);
const END=rhymeEnd(LINES);                 // about 70.2 s
const DUR=76, SC=[0,DUR];
const SPB=60/BPM;
const V2=LINES[6].t0;                      // second verse starts (about 39.5 s)
const SX=790, SY=210;                      // the big star
const PX=760, PY=562, PW=250;              // the pond
const LX=440, TXEND=1150;                  // Lulu, where Turtle stops

const GLOW='<defs><radialGradient id="glow"><stop offset="0" stop-color="#FFF3B8" stop-opacity=".5"/><stop offset="1" stop-color="#FFF3B8" stop-opacity="0"/></radialGradient></defs>';
function diamond(x,y,s,o){return `<path transform="translate(${x},${y}) scale(${s})" d="M0,-16 L11,0 L0,16 L-11,0Z" fill="#CFF3FF" opacity="${o}"/><path transform="translate(${x},${y}) scale(${s})" d="M0,-16 L3,0 L0,16 L-3,0Z" fill="#fff" opacity="${o}"/>`;}
function scenery(t){return tree(150,520,1)+branch(170,330,345,312)+reed(PX+PW-20,560,120,t,1)+reed(PX+PW-2,566,95,t,2);}

function render(t){
  const n=t<3?lerp(.5,1,eio(prog(t,0,3))):1;
  const li=currentLine(LINES,t), L=li>=0?LINES[li]:null, line=L?L.index:-1;
  const p=t<END+.5?beatPulse(LINES,t):0;
  const sway=t>START-.5&&t<END+.6?Math.sin(2*Math.PI*(t-START)/(2*SPB)):0;
  const sleep=t>END+1.4;
  let props='',chars='',sky='',pops='',cap='',glowfx='';

  // the star rises a little on "Up above the world so high"
  const up=line===2?eio(prog(t,L.t0,L.t0+1.2)):line===3?1-eio(prog(t,L.t0,L.t0+1.4)):0;
  const sg=back(prog(t,4.3,5.0))*(t>4.3?1:0);
  const sy=SY-50*up, sr=68*sg*(1+.12*p);

  // pond with the star's reflection twinkling in the water
  props+=scenery(t)+pond(PX,PY,PW)+lilyPad(PX-150,PY+4);
  if(sg>0){
    const ro=.55+.35*p;
    props+=`<g transform="translate(${SX},${PY-2}) scale(1,.3)" opacity="${ro.toFixed(2)}">${bigStar(0,0,sr*.55,'#FFE98A',-6*Math.sin(t*1.3))}</g>`;
    for(let k=0;k<2;k++){const q=((t-START+k*1.3)%2.6+2.6)%2.6/2.6;if(t>START)
      props+=`<ellipse cx="${SX}" cy="${PY-2}" rx="${(40+90*q).toFixed(1)}" ry="${(7+15*q).toFixed(1)}" fill="none" stroke="#fff" stroke-width="3" opacity="${(.5*(1-q)).toFixed(2)}"/>`;}
  }

  // Owl on the branch: flaps on every "twinkle", sways with the music
  const tw=(line===0||line===4)?p:0;
  chars+=place(330,308,owl({eye:blink(t,1.6),wing:8+40*tw,tilt:8*sway}),{s:.78});

  // Lulu sways by the pond
  chars+=shadow(LX,522,60)+place(LX,520-6*p,duck({eye:blink(t,0),asleep:sleep,wing:sleep?0:12+10*sway}),{s:1.0,rot:sleep?-3:4*sway});

  // verse 2: a little turtle walks in from the right to listen
  const ws=V2-4.5, we=V2-.8;
  if(t>ws){
    const u=eio(prog(t,ws,we)), tx=lerp(1380,TXEND,u), walking=t<we;
    chars+=shadow(tx,522,70)+place(tx,520-(walking?0:4*p),turtle({eye:sleep?1:blink(t,.9),asleep:sleep,step:walking?(t-ws)*7:0}),{s:.9,flip:true});
  }

  // the big star
  if(sg>0){
    sky+=GLOW+`<circle cx="${SX}" cy="${sy}" r="${160*sg*(1+.1*p)}" fill="url(#glow)"/>`;
    sky+=bigStar(SX,sy,sr,'#FFD93B',6*Math.sin(t*1.3),true,sleep?.15:blink(t,2));
  }
  // diamonds on "Like a diamond in the sky", one per syllable
  for(const Lx of LINES)if(Lx.index===3&&t>=Lx.t0&&t<Lx.t1+2.5){
    const fade=1-prog(t,Lx.t1+1.2,Lx.t1+2.5);
    Lx.words.forEach((w,k)=>{if(t>=w.t0){const a=-2.7+k*.9,s=back(prog(t,w.t0,w.t0+.3))*(1+.15*Math.sin(t*6+k));
      sky+=diamond(SX+170*Math.cos(a),SY+20+115*Math.sin(a),s*1.3,fade);}});
  }
  // a little wonder bubble above Lulu on "How I wonder what you are!"
  for(const Lx of LINES)if(Lx.index===1&&t>=Lx.t0-.2&&t<Lx.t1+.6){
    const o=prog(t,Lx.t0-.2,Lx.t0+.3)*(1-prog(t,Lx.t1,Lx.t1+.6));
    sky+=`<g opacity="${o}"><circle cx="505" cy="300" r="9" fill="#fff"/><circle cx="525" cy="272" r="13" fill="#fff"/><circle cx="555" cy="222" r="38" fill="#fff"/><text x="555" y="238" text-anchor="middle" font-size="46" fill="#7B5CFF">?</text></g>`;
  }

  // title, then the words of the song, then good night
  const to=1-prog(t,3.7,4.3);
  if(to>0)pops=`<g opacity="${to}">`+pop('Twinkle, Twinkle,',760,160,82,'#FFD23F',t,.4,-2,'#2D2A6E')+pop('Little Star',760,272,110,'#FFD23F',t,1.0,2,'#2D2A6E')+`</g>`;
  cap=t<END+1.4?karaoke(LINES,t,'#FF5D8F'):caption('Good night, little star!',t-END,1.6);
  if(sleep)for(let k=0;k<3;k++){let q=t-END-2-k*.9;if(q>0){q%=2.7;
    pops+=`<text x="${LX+70+q*22}" y="${360-q*40}" font-size="${26+q*10}" fill="#fff" opacity="${(Math.sin(Math.PI*q/2.7)*.95).toFixed(2)}">z</text>`;}}

  svg.innerHTML=bg(t,n,'',{noMoon:true})+props+chars+nightTint(.4*n)+sky+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=bg(0,1,'',{noMoon:true})+pond(760,600,300)+tree(120,560,1.05)+branch(140,365,330,345)+place(318,340,owl({wing:30}),{s:.85});
  s+=`<g transform="translate(900,598) scale(1,.3)" opacity=".7">${bigStar(0,0,60,'#FFE98A',-6)}</g>`;
  s+=shadow(470,662,110)+place(460,658,duck({wing:20}),{s:1.55});
  s+=nightTint(.4);
  s+=GLOW+`<circle cx="900" cy="200" r="230" fill="url(#glow)"/>`+bigStar(900,200,110,'#FFD93B',-6,true);
  s+=label('Twinkle, Twinkle,',915,420,72,'#FFD23F',-3,'#2D2A6E')+label('Little Star',915,520,100,'#FFD23F',-2,'#2D2A6E');
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
