<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 45 - Lulu and the Little Nest. Little Bird flies down to the tree: she needs a nest.
   Lulu finds three twigs (one, two, three). Little Bird carries them up to the branch, one by one,
   and the nest grows. Tweet, tweet! Thank you, Lulu! The sun goes down; Little Bird sleeps in her
   new nest and Lulu sleeps under the tree. */
const DUR=48, SC=[0,5,12,19,26,33,40,48];
const NAVY='#2D2A6E', PINK='#FF5D8F', PURPLE='#7B5CFF', BLUE='#2979E8', GREEN='#2FA37A', GOLD='#FFE58A', ORANGE='#FF9F1C';
const TX=210;                    // the tree
const NX=420, NY=304, NS=.62;    // the nest on the branch (bottom centre) and its size
const BS=.55;                    // Little Bird's size
const BX=380;                    // Little Bird's spot on the ground
const LX=780;                    // Lulu's spot (she faces left, towards the tree)
const TW=[470,560,650];          // three twigs on the ground

const scenery=()=>tree(TX,520,1)+branch(TX+40,330,NX+20,NY-2);
const lulu=(lt,t,o={})=>{
  const x=o.x!=null?o.x:LX, j=jumps(lt,o.hops||[],o.d||.6,o.h||26), w=o.wave?20+20*Math.sin(lt*9):(o.wing||0);
  return shadow(x,522,60,-j.y)+place(x,520+j.y+(o.bob||0),duck({eye:o.eye!=null?o.eye:blink(t,0),wing:w,asleep:o.asleep}),{s:1,sx:j.sx,sy:j.sy,flip:o.flip!==false,rot:o.rot||0});
};
// Little Bird: x,y = feet; fly = wings beating; flip = facing left; twig = carrying a twig in her beak
const birdAt=(x,y,t,o={})=>{
  const w=o.fly?-35+30*Math.sin(t*26):(o.wing||0);
  const tw=o.twig?stick(112,-112,1,6):'';
  return (o.noShadow?'':shadow(x,522,32,520-y))+place(x,y,bird({eye:o.eye!=null?o.eye:blink(t,.7),wing:w})+tw,{s:BS,flip:o.flip,sx:o.sx||1,sy:o.sy||1});
};
const arc=(a,b,u,h)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u)-h*Math.sin(Math.PI*u)];
// the nest grows with each twig: k = 0..3 twigs in it
const nestSize=k=>k<=0?0:NS*(.45+.55*k/3);
const nestB=k=>k>0?nestBack(NX,NY,nestSize(k)):'';
const nestF=k=>k>0?nestFront(NX,NY,nestSize(k)):'';
const SEAT=[NX,NY-2];        // where Little Bird sits in the finished nest

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let n=0,props='',chars='',front='',pops='',cap='',o={},behind='';
  switch(i){
  case 0:{
    // title: Lulu hops, Little Bird flies by
    o.noSun=true;
    const bx=lerp(1380,880,eio(prog(lt,.2,2.4))), by=lerp(250,330,eio(prog(lt,.2,2.4)))+10*Math.sin(lt*3);
    chars=lulu(lt,t,{x:420,hops:[.5,2.4],h:22,flip:false})+birdAt(bx,by,t,{fly:true,flip:true,noShadow:true});
    pops=pop(`${LULU}<tspan fill="${NAVY}"> and the Little Nest</tspan>`,640,165,72,PINK,lt,.4,-3);
    break;}
  case 1:{
    // Little Bird flies down to the tree; she needs a nest
    const u=eio(prog(lt,.3,2.4)), p=arc([-80,180],[BX,520],u,-60);
    props=scenery();
    const landed=lt>2.4;
    chars=lulu(lt,t,{hops:[3.0],h:20})+(landed?birdAt(BX,520+jumps(lt,[2.9,5.0],.45,18).y,t,{}):birdAt(p[0],p[1],t,{fly:true}));
    cap=lt<3.6?caption('Here comes Little Bird.',lt,.3):caption('She needs a nest.',lt,3.6);
    pops=pop('Tweet!',640,170,96,BLUE,lt,2.6,-4);
    break;}
  case 2:{
    // Lulu finds three twigs: one, two, three!
    o.noSun=true; o.noFlowers=true;
    const C=[2.6,3.6,4.6];
    props=scenery();
    TW.forEach((x,k)=>{const q=lt-C[k], b=q>0&&q<.5?-26*Math.sin(Math.PI*q/.5):0;
      props+=stick(x,514+b,.9,k%2?-4:4);
      if(q>0&&q<1.2)props+=sparkle(x+34,476,.8,1-q/1.2);});
    chars=birdAt(BX,520+jumps(lt,[5.8],.45,18).y,t,{})+lulu(lt,t,{hops:[.6],h:16,wave:lt>5.6});
    cap=lt<2.4?caption('Lulu finds some twigs.',lt,.3):caption('One, two, three twigs!',lt,2.4);
    pops=pop('One!',520,165,76,PINK,lt,C[0],-4)+pop('Two!',780,165,76,ORANGE,lt,C[1],3)+pop('Three!',1040,165,76,PURPLE,lt,C[2],-3);
    break;}
  case 3:{
    // Little Bird carries the twigs up to the branch, one by one; the nest grows
    let bx=BX,by=520,fly=false,flip=false,carry=false,inNest=0,taken=0;
    let prev=[BX,520];
    for(let k=0;k<3;k++){
      const a=.3+k*2.0, g=[TW[k],520];
      if(lt>=a)taken=k;
      if(lt>=a&&lt<a+.5){const p=arc(prev,g,eio(prog(lt,a,a+.5)),28);bx=p[0];by=p[1];fly=lt<a+.45;flip=g[0]<prev[0];}
      else if(lt>=a+.5&&lt<a+1.3){const p=arc(g,SEAT,eio(prog(lt,a+.5,a+1.3)),70);bx=p[0];by=p[1];fly=true;flip=true;carry=true;taken=k+1;}
      else if(lt>=a+1.3){bx=SEAT[0];by=SEAT[1];fly=false;flip=false;inNest=k+1;taken=k+1;}
      prev=SEAT;
    }
    // the bird is sitting on the nest only while it is there (between trips)
    props=scenery()+nestB(inNest);
    TW.forEach((x,k)=>{if(k>=taken)props+=stick(x,514,.9,k%2?-4:4);});
    const onNest=bx===SEAT[0]&&by===SEAT[1];
    const b=birdAt(bx,by,t,{fly,flip,twig:carry,noShadow:by<480});
    props+=onNest?b+nestF(inNest):nestF(inNest);
    for(let k=0;k<3;k++){const q=lt-(.3+k*2.0+1.3);if(q>0&&q<1.2)props+=sparkle(NX+70,NY-50,.9,1-q/1.2);}
    chars=(onNest?'':b)+lulu(lt,t,{hops:[2.3,6.3],h:18});
    cap=lt<3.4?caption('Little Bird takes a twig.',lt,.3):caption('Up, up to the branch!',lt,3.4);
    pops=pop('Up, up!',820,165,96,GREEN,lt,1.0,-3);
    break;}
  case 4:{
    // the new nest is ready: Little Bird sings, thank you, Lulu!
    props=scenery();
    for(let k=0;k<3;k++){let q=lt-3.6-k*.7;if(q>0){q%=2.2;props+=heart(NX-40+k*40+10*Math.sin(q*3),NY-60-q*48,.55,PINK,Math.sin(Math.PI*q/2.2));}}
    const sing=lt>1.0&&lt<3.2, j=jumps(lt,[1.2,2.0],.4,10);
    props+=nestBack(NX,NY,NS)+birdAt(SEAT[0],SEAT[1]+j.y,t,{noShadow:true,wing:sing?-20*Math.abs(Math.sin(lt*8)):0,sy:j.sy})+nestFront(NX,NY,NS);
    chars=lulu(lt,t,{hops:[4.0,4.8],h:28,wave:lt>5.5});
    cap=lt<3.4?caption('A cosy new nest!',lt,.3):caption('Thank you, Lulu!',lt,3.4);
    pops=pop('Tweet, tweet!',680,165,84,BLUE,lt,1.0,-3);
    break;}
  case 5:{
    // the sun goes down; Little Bird yawns
    n=lerp(0,.45,eio(prog(lt,.3,6.8))); o={noSun:true,noMoon:true};
    behind=sun(t,1150,lerp(100,560,eio(prog(lt,.3,6.8))));
    props=scenery()+nestBack(NX,NY,NS)+birdAt(SEAT[0],SEAT[1],t,{noShadow:true,eye:lt>3.6?.45:undefined})+nestFront(NX,NY,NS);
    chars=lulu(lt,t,{wave:lt>1.0&&lt<2.8,eye:lt>3.6?.5:undefined});
    cap=lt<3.4?caption('The sun goes down.',lt,.3):caption('Little Bird is sleepy.',lt,3.4);
    pops=pop('Yawn!',800,170,96,PURPLE,lt,4.0,-3);
    break;}
  case 6:{
    // night: Little Bird sleeps in her nest, Lulu sleeps under the tree
    n=lerp(.45,1,eio(prog(lt,0,4))); o={noSun:true};
    const asleep=lt>1.4, br=k=>1+.025*Math.sin(lt*2.2+k);
    props=scenery()+nestBack(NX,NY,NS)+birdAt(SEAT[0],SEAT[1],t,{noShadow:true,eye:asleep?.1:.45,sy:br(1)})+nestFront(NX,NY,NS);
    chars=shadow(LX,522,60)+place(LX,520,duck({asleep,eye:.45}),{s:1,sy:br(0),flip:true,rot:asleep?3:0});
    for(let k=0;k<3;k++){let q=lt-2.0-k*.9;if(q>0){q%=2.7;
      pops+=`<text x="${LX-40+q*24+8*Math.sin(q*3)}" y="${320-q*30}" font-size="${28+q*11}" fill="#fff" opacity="${Math.sin(Math.PI*q/2.7)*.95}">z</text>`;}}
    cap=caption('Good night, Little Bird.',lt,.5);
    pops+=pop('The End',760,150,112,GOLD,lt,4.2,-3,NAVY);
    break;}
  }
  o.noClouds=true;
  svg.innerHTML=bg(t,n,cloud(1000+12*Math.sin(t*.3),262,.6,1-n*.85)+behind,o)+props+chars+front+nightTint(n)+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=`<defs>${skyGrad('g','#5EC2FF','#DDF5FF')}${CLIP}</defs><rect width="1280" height="720" fill="url(#g)"/>`;
  s+=`<path d="M0,440 Q300,360 640,420 T1280,410 L1280,720 L0,720Z" fill="#9ADB6F"/>`;
  s+=`<path d="M0,520 Q380,470 760,505 T1280,490 L1280,720 L0,720Z" fill="#6CC24A"/>`;
  s+=tree(250,690,1.2)+branch(300,440,560,420);
  s+=nestBack(545,424,.85)+place(545,412,bird({wing:-20}),{s:.75,flip:true})+nestFront(545,424,.85);
  s+=heart(470,300,.7,PINK,.9)+heart(640,320,.55,PINK,.8);
  s+=place(930,660,duck({wing:24}),{s:1.25,flip:true});
  s+=stick(780,640,1.3,6);
  s+=label(`${LULU}<tspan fill="${NAVY}"> and the Little Nest</tspan>`,640,150,92,PINK,-2);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
