<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 51 - Lulu and the First Snow. Grey clouds come and the first snow falls; the grass turns white.
   A snowflake lands on Lulu's beak (hee hee, it tickles!). Pip the kitten comes to play: let's make a snowman!
   They roll a big snowball and a smaller one (roll, roll, roll), stack them with a little head on top,
   and the snowman says hello. The sun goes down, and Lulu, Pip and the snowman sleep in the soft snow. */
const DUR=54, SC=[0,5,11,17,24,31,38,46,54];
const NAVY='#2D2A6E', PINK='#FF5D8F', PURPLE='#7B5CFF', BLUE='#2979E8', GOLD='#FFE58A', ORANGE='#FF9F1C', TEAL='#19B8A6';
const SMX=700;     // where the snowman is built
const LX=470;      // Lulu's spot next to the snowman (faces right)
const PX=960;      // Pip's spot

// the snowy ground: same hills as bg(), white, u = 0..1 how much snow lies on the grass
function snowGround(u,n){
  if(u<=0)return '';
  return `<g opacity="${u}"><path d="M0,440 Q300,330 640,410 T1280,400 L1280,720 L0,720Z" fill="${mix('#EAF3FA','#8E9CC9',n)}"/><path d="M0,500 Q380,440 760,490 T1280,470 L1280,720 L0,720Z" fill="${mix('#FFFFFF','#A7B4DD',n)}"/></g>`;
}
// falling snow, o = how much
function snowfall(t,o=1,count=24){
  if(o<=0)return '';
  let s='';for(let k=0;k<count;k++){const x0=(k*97+30)%1280, sp=36+(k%5)*8, y=((t*sp+k*61)%640)-30, x=x0+18*Math.sin(t*.9+k);
    s+=snowflake(x,y,.5+(k%3)*.18,t*20+k*30,o*.95);}
  return s;
}
// soft grey snow clouds high in the sky (kept above the words)
const skyClouds=(t,o=1)=>cloud(180+10*Math.sin(t*.25),52,.8,o,'#E4E9EF')+cloud(560+8*Math.sin(t*.2+1),40,.7,o,'#F2F5F8')+cloud(980+10*Math.sin(t*.3+2),56,.8,o,'#E4E9EF');
const shade=(x,w)=>`<ellipse cx="${x}" cy="522" rx="${w}" ry="${w*.18}" fill="#7F93B0" opacity=".25"/>`;

const lulu=(lt,t,o={})=>{
  const x=o.x!=null?o.x:LX, j=jumps(lt,o.hops||[],o.d||.6,o.h||22), w=o.wave?20+20*Math.sin(lt*9):(o.wing!=null?o.wing:-25+6*Math.sin(lt*3));
  return shade(x,58*(1-clamp(-j.y/260)*.5))+place(x,520+j.y,duck({eye:o.eye!=null?o.eye:blink(t,0),wing:w,asleep:o.asleep}),{s:o.s||1,sx:j.sx*(o.sx||1),sy:j.sy*(o.sy||1),rot:o.rot||0});
};
const pip=(lt,t,o={})=>{
  const x=o.x!=null?o.x:PX, j=jumps(lt,o.hops||[],.5,o.h||26);
  return shade(x,50)+place(x,520+j.y,kitten({eye:o.eye!=null?o.eye:blink(t,1.1),tail:Math.sin(t*2),tilt:o.tilt||0,asleep:o.asleep}),{s:.85,sx:j.sx,sy:j.sy*(o.sy||1),rot:o.rot||0});
};
const sparkles=(x,y,lt,t0)=>{let s='';for(let k=0;k<5;k++){const q=lt-t0-k*.15;if(q>0&&q<1.4){const a=k*1.26;s+=sparkle(x+Math.cos(a)*(60+q*60),y+Math.sin(a)*(50+q*40),.9,Math.sin(Math.PI*q/1.4));}}return s;};

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let n=0,snowU=1,fall=1,props='',chars='',pops='',cap='',behind='',clouds=1;
  switch(i){
  case 0:{
    // title: Lulu in the garden, grey clouds come, the first flakes
    snowU=0; fall=prog(lt,2.5,5)*.4;
    chars=lulu(lt,t,{x:640,hops:[2.6],h:16,wave:lt>1&&lt<2.4});
    pops=pop(`${LULU}<tspan fill="${NAVY}"> and the First Snow</tspan>`,640,170,72,PINK,lt,.4,-3);
    break;}
  case 1:{
    // it is snowing! the grass turns white
    snowU=eio(prog(lt,.5,5.2)); fall=lerp(.4,1,prog(lt,0,1));
    chars=lulu(lt,t,{x:640,hops:[1.6,2.2],h:22,wave:lt>1.4&&lt<3});
    cap=lt<3.4?caption('Look! It is snowing!',lt,.3):caption('The grass turns white.',lt,3.4);
    pops=pop('Snow!',640,165,110,BLUE,lt,1.4,-4);
    break;}
  case 2:{
    // a snowflake lands on Lulu's beak; it tickles
    const bx=640+104, by=520-104;                 // tip of Lulu's beak
    const u=eio(prog(lt,.3,2.8));
    const fx=lerp(860,bx-4,u)+26*Math.sin(lt*2.2)*(1-u), fy=lerp(160,by-14,u);
    const giggle=lt>3.4&&lt<5.2?3*Math.sin((lt-3.4)*14):0;
    const melt=1-prog(lt,4.6,5.6);
    chars=lulu(lt,t,{x:640,rot:giggle,wing:lt>3.4&&lt<5.2?-10:undefined,eye:lt>3.4&&lt<5.2?.35:undefined});
    props=melt>0?snowflake(fx,fy+giggle,1.5,lt*25,melt):'';
    cap=lt<3.4?caption('A snowflake lands on Lulu.',lt,.3):caption('Hee hee! It tickles!',lt,3.4);
    pops=pop('Hee hee!',420,170,96,PINK,lt,3.6,-4);
    fall=.6;
    chars+=props; props='';
    break;}
  case 3:{
    // Pip the kitten comes to play: let's make a snowman!
    const px=lerp(1420,PX,eio(prog(lt,.4,2.2)));
    chars=lulu(lt,t,{hops:[2.6,5.0],h:20,wave:lt>2.4&&lt<4})+pip(lt,t,{x:px,hops:lt<2.4?[.5,1.0,1.5,2.0]:[5.2],h:24});
    cap=lt<3.4?caption('Pip comes to play.',lt,.3):caption("Let's make a snowman!",lt,3.4);
    pops=pop('Hello, Pip!',700,165,88,ORANGE,lt,2.4,-3);
    break;}
  case 4:{
    // roll, roll, roll: Lulu rolls a big snowball, Pip a smaller one
    const u=eio(prog(lt,.4,6.0));
    const r1=lerp(16,62,u), b1=lerp(260,SMX,u);
    const r2=lerp(14,45,u), b2=lerp(1150,890,u);
    const rot1=(b1-260)/r1*57, rot2=-(1150-b2)/r2*57;
    props=shade(b1,r1*.95)+snowball(b1,520,r1,rot1)+shade(b2,r2*.95)+snowball(b2,520,r2,rot2);
    chars=lulu(lt,t,{x:b1-r1-98,wing:-12+8*Math.sin(lt*10),sy:1+.02*Math.sin(lt*10)})+pip(lt,t,{x:b2+r2+46,tilt:6*Math.sin(lt*5)});
    cap=lt<3.4?caption('Roll, roll, roll!',lt,.3):caption('The snowballs grow big.',lt,3.4);
    pops=pop('Roll!',360,165,84,TEAL,lt,1.0,-5)+pop('Roll!',640,165,84,PURPLE,lt,1.6,3)+pop('Roll!',920,165,84,ORANGE,lt,2.2,-3);
    break;}
  case 5:{
    // stack them: middle ball up, little head on top, the snowman says hello
    const um=eio(prog(lt,.5,1.6));
    const mx=lerp(890,SMX,um), my=lerp(520,520-107,um)-90*Math.sin(Math.PI*um);
    const uh=eio(prog(lt,1.9,2.9));
    const hx=lerp(LX+40,SMX,uh), hy=lerp(520,520-188,uh)-110*Math.sin(Math.PI*uh);
    const face=prog(lt,3.1,3.6);
    props=shade(SMX,62);
    if(face<1) props+=`<g opacity="${1-face}">`+snowball(SMX,520,62)+snowball(mx,my,45)+(lt>1.5?snowball(hx,hy,34):'')+`</g>`;
    if(face>0) props+=`<g opacity="${face}">`+place(SMX,520,snowman({eye:blink(t,.8),arm:lt>4.2?.5+.5*Math.sin((lt-4.2)*5):0}),{s:1})+`</g>`;
    props+=sparkles(SMX,300,lt,3.1);
    chars=lulu(lt,t,{hops:[1.2,4.0,4.6],h:20})+pip(lt,t,{hops:[.9,4.2,4.8],h:22});
    cap=lt<3.2?caption('One, two, three balls.',lt,.3):caption('Hello, Snowman!',lt,3.2);
    pops=pop('1',SMX+130,483,70,PINK,lt,1.7)+pop('2',SMX+130,393,70,PURPLE,lt,2.2)+pop('3',SMX+130,323,70,TEAL,lt,2.9);
    if(lt>3.6)pops='';
    pops+=pop('Hooray!',SMX,165,96,PINK,lt,3.8,-3);
    break;}
  case 6:{
    // the sun goes down; bye-bye, snowy day
    n=lerp(0,.45,eio(prog(lt,.3,6))); fall=1-prog(lt,0,2.5); clouds=1-prog(lt,0,3);
    behind=sun(t,1150,lerp(250,560,eio(prog(lt,.3,6))));
    props=shade(SMX,62)+place(SMX,520,snowman({eye:lt>4?.45:blink(t,.8)}),{s:1});
    chars=lulu(lt,t,{eye:lt>3.6?.5:undefined})+pip(lt,t,{eye:lt>3.8?.5:undefined});
    cap=lt<3.4?caption('The sun goes down.',lt,.3):caption('Bye-bye, snowy day!',lt,3.4);
    pops=pop('Yawn!',LX,170,96,PURPLE,lt,4.2,-3);
    break;}
  case 7:{
    // night: Lulu, Pip and the snowman sleep; a few soft snowflakes
    n=lerp(.45,1,eio(prog(lt,0,4))); fall=.35*prog(lt,1.5,3); clouds=0;
    const asleep=lt>1.4, br=k=>1+.025*Math.sin(lt*2.2+k);
    props=shade(SMX,62)+place(SMX,520,snowman({asleep,eye:.45}),{s:1,sy:br(2)});
    chars=lulu(lt,t,{asleep,eye:.45,sy:br(0),rot:asleep?-3:0})+pip(lt,t,{asleep,eye:.45,sy:br(1),rot:asleep?3:0});
    for(let k=0;k<3;k++){let q=lt-2.0-k*.9;if(q>0){q%=2.7;
      pops+=`<text x="${LX-30-q*24+8*Math.sin(q*3)}" y="${320-q*30}" font-size="${28+q*11}" fill="#fff" opacity="${Math.sin(Math.PI*q/2.7)*.95}">z</text>`;}}
    cap=caption('Good night, Lulu and Pip.',lt,.5);
    pops+=pop('The End',640,150,112,GOLD,lt,4.2,-3,NAVY);
    break;}
  }
  const grey=n<1?`<rect width="1280" height="720" fill="#C8D8E8" opacity="${.35*(1-n)*(i<6?1:clouds)}"/>`:'';
  const back_=bg(t,n,grey+(clouds>0?skyClouds(t,clouds*(1-n*.6)):'')+behind,{noSun:true,noClouds:true,noFlowers:true,noMoon:i<7})+snowGround(snowU,n);
  svg.innerHTML=back_+props+chars+nightTint(n)+snowfall(t,fall*(1-n*.3))+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=`<defs>${skyGrad('g','#8FC7EE','#E3F1FA')}</defs><rect width="1280" height="720" fill="url(#g)"/>`;
  s+=cloud(160,60,.9,1,'#F2F5F8')+cloud(1120,70,.9,1,'#E4E9EF');
  s+=`<path d="M0,440 Q300,360 640,420 T1280,410 L1280,720 L0,720Z" fill="#DCEAF5"/>`;
  s+=`<path d="M0,520 Q380,470 760,505 T1280,490 L1280,720 L0,720Z" fill="#EEF5FB"/>`;
  s+=shade(860,70).replace('cy="522"','cy="664"')+place(860,662,snowman({arm:.8}),{s:1.25});
  s+=place(420,662,duck({wing:20}),{s:1.3});
  s+=place(1120,662,kitten({tilt:6}),{s:.95});
  for(let k=0;k<16;k++)s+=snowflake((k*173+60)%1280,240+(k*97)%420,.6+(k%3)*.25,k*25,.95);
  s+=label(`${LULU}<tspan fill="${NAVY}"> and the First Snow</tspan>`,640,160,92,PINK,-2);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
