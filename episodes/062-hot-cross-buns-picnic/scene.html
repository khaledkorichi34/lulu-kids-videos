<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script src="../../toolkit/rhymes.js"></script>
<script>
/* Episode 62 - Hot Cross Buns at an autumn picnic (sing-along). Lulu sits by her picnic blanket
   under an autumn tree; during the title the basket lid opens and three warm buns hop out onto
   the blanket. On "One a penny" one bun hops (big 1), on "two a penny" two buns hop (big 2).
   Verse 2: the puppy trots in. Verse 3: the little turtle walks in and the sky turns golden.
   Ending: one bun hops to each friend - "Yum! Buns to share!" */
const BPM=104, START=5.0;
const LINES=rhymeTimes(RHYMES.hotcross,START,3,4,BPM);
const END=rhymeEnd(LINES);                 // 37.31 s
const DUR=43, SC=[0,DUR];
const VS=[0,4,8].map(i=>LINES[i].t0);      // verse starts
const LX=300, KX=455, KY=532;              // Lulu, basket
const BX=[600,690,780], BY=540;            // buns on the blanket
const FX=[950,1140];                       // puppy, turtle
const ENTER=[[VS[1]-2.6,VS[1]-.2],[VS[2]-3.4,VS[2]-.2]];
const OUT=[1.6,2.2,2.8];                   // buns hop out of the basket
const GIVE=[END+.5,END+.9,END+1.3];        // buns hop to the friends
const DEST=[[LX+10,594],[FX[0]-10,594],[FX[1]-40,594]];

function lineAt(t){const li=currentLine(LINES,t);return li>=0&&t<LINES[li].t1+.05?LINES[li]:null;}
function dusk(t){return eio(prog(t,VS[2]-1.5,END+2));}

function bunHop(t,i){
  for(const L of LINES){if(L.index!==2)continue;
    const w=i===0?L.words[0]:L.words[4];
    const j=jump(t,w.t0,.42,46);if(j)return j;}
  return {y:0,sx:1,sy:1};
}

function leaves(t){
  let s='';
  for(let k=0;k<4;k++){
    const per=8, q=((t+k*2)%per)/per;
    const x=40+k*45+30*Math.sin(q*6+k)+q*110, y=240+q*250;
    s+=`<g opacity="${(Math.sin(Math.PI*q)*.95).toFixed(2)}">`+autumnLeaf(x,y,.9,40*Math.sin(q*7+k)+k*30,AUTUMN[k%3])+`</g>`;
  }
  return s;
}

function friendX(k,t){const [a,b]=ENTER[k];return lerp(1420,FX[k],eio(prog(t,a,b)));}

function render(t){
  const p=t>START-.2&&t<END+.4?beatPulse(LINES,t):0;
  const L=lineAt(t), li=L?L.index:-1, d=dusk(t);
  let back='',props='',chars='',front='',pops='',cap='';

  // soft hearts behind everyone at the end
  if(t>END+2.4)for(let k=0;k<4;k++){const q=((t-END-2.4)*.35+k*.25)%1;
    back+=heart(420+k*170,330-q*110,1.5,'#FF8FB1',Math.sin(Math.PI*q)*.8);}

  props+=picnicBlanket(640,575,.85);
  const lid=prog(t,1.0,1.5)*(1-prog(t,3.4,3.9));
  props+=picnicBasket(KX,KY,.8,lid);

  // the buns
  BX.forEach((x,i)=>{
    if(t<OUT[i])return;
    const o=prog(t,OUT[i],OUT[i]+.55), g=prog(t,GIVE[i],GIVE[i]+.8);
    let bx,by,s=1;
    if(o<1){const u=eio(o);bx=lerp(KX,x,u);by=lerp(KY-60,BY,u)-90*Math.sin(Math.PI*u);s=lerp(.6,1,u);}
    else if(g<=0){const h=bunHop(t,i), bob=(li===0||li===1||li===3)?4*p:0;
      front+=`<g transform="translate(${x},${BY+h.y-bob}) scale(${h.sx},${h.sy})">${bun(0,0,1,1,t+i*.37)}</g>`;return;}
    else{const [dx,dy]=DEST[i], u=eio(g);bx=lerp(x,dx,u);by=lerp(BY,dy,u)-110*Math.sin(Math.PI*u);
      props+=bun(bx,by,s,0,0);return;}   // given buns go behind the friends, no steam over them
    front+=bun(bx,by,s,1,t+i*.37);
  });

  // "1" and "2" for "One a penny, two a penny"
  for(const Lx of LINES){if(Lx.index!==2)continue;
    const off=Lx.t1, o=1-prog(t,off+.1,off+.5);
    if(o>0&&t>=Lx.t0-.05)pops+=`<g opacity="${o.toFixed(2)}">`+pop('1',BX[0],170,130,'#FF5D8F',t,Lx.words[0].t0)+pop('2',(BX[1]+BX[2])/2,170,130,'#19B8A6',t,Lx.words[4].t0)+`</g>`;
  }

  // friends: the puppy trots in before verse 2, the turtle walks in before verse 3
  for(let k=0;k<2;k++){
    const [a,b]=ENTER[k]; if(t<a)continue;
    const x=friendX(k,t);let y=520,rot=0;
    if(k===0){
      if(t<b+.3){rot=5*Math.sin((t-a)*11);y-=Math.abs(Math.sin((t-a)*11))*7;}
      else if(t<END+.4)y-=6*p;
      chars+=shadow(x,524,52,520-y)+place(x,y,puppy({eye:blink(t,.7),tail:Math.sin(t*5),ear:.6*p}),{s:.78,rot,flip:true});
    }else{
      const walking=t<b+.2;
      if(!walking&&t<END+.4)y-=4*p;
      chars+=shadow(x,524,64,520-y)+place(x,y,turtle({eye:blink(t,1.6),step:walking?(t-a)*9:0}),{s:.8,flip:true});
    }
  }

  // Lulu: flaps on "Hot cross buns!", leans towards the buns on "One a penny, two a penny"
  let ly=520,rot=0,wing=0;
  if(L){if(li===2)rot=6*Math.sin(Math.PI*prog(t,L.t0,L.t1));else wing=-30*p;ly-=5*p;}
  if(t>END+1)wing=-20*Math.max(0,Math.sin((t-END)*4))*(1-prog(t,END+2,END+3));
  chars+=shadow(LX,524,62,520-ly)+place(LX,ly,duck({eye:blink(t,0),wing}),{s:.9,rot});

  const to=1-prog(t,3.9,4.5);
  if(to>0)pops+=`<g opacity="${to}">`+pop('Hot Cross',640,165,104,'#FF5D8F',t,.4,-2,'#fff')+pop('Buns!',640,285,116,'#FF9F1C',t,1.0,2,'#fff')+`</g>`;
  cap=t<END+.6?karaoke(LINES,t,'#E8742A'):caption('Yum! Buns to share!',t-END,.7);

  const warm=d>0?`<defs><linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FB4F2"/><stop offset=".45" stop-color="#FFB27A"/><stop offset="1" stop-color="#FFE29A"/></linearGradient></defs><rect width="1280" height="720" fill="url(#warm)" opacity="${(.85*d).toFixed(3)}"/>`:'';
  const sn=warm+sun(t,1150,100+d*130);
  const glow=d>0?`<rect width="1280" height="720" fill="#FFB347" opacity="${(.1*d).toFixed(3)}"/>`:'';
  svg.innerHTML=bg(t,0,sn,{noSun:true,noFlowers:true,noClouds:true})+autumnTree(95,525,.7)+leaves(t)+back+props+chars+front+glow+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=bg(0,0,sun(0,1150,100),{noSun:true,noFlowers:true,noClouds:true})+autumnTree(95,525,.7);
  s+=autumnLeaf(240,340,1.3,30,'#E63946')+autumnLeaf(1180,330,1.3,-20,'#F6C026');
  s+=picnicBlanket(640,575,.85)+picnicBasket(KX,KY,.8,0);
  s+=shadow(LX,524,62,0)+place(LX,520,duck({wing:-30}),{s:.9,rot:4});
  s+=shadow(FX[0],524,52,0)+place(FX[0],520,puppy({tail:.5}),{s:.78,flip:true});
  s+=shadow(FX[1],524,64,0)+place(FX[1],520,turtle({}),{s:.8,flip:true});
  BX.forEach((x,i)=>{s+=bun(x,BY,1.15,1,.3+i*.37);});
  s+=label('Hot Cross',640,140,110,'#FF5D8F',-3,'#fff')+label('Buns!',640,268,124,'#FF9F1C',-2,'#fff');
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
