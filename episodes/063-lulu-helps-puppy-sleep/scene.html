<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 63 - Lulu Helps Puppy Sleep. Lulu and Puppy play ball all day; the sun goes down.
   Lulu is sleepy but Puppy is wide awake (boing, boing!). Lulu brings a soft blanket (cosy!),
   they count three stars, Lulu hums a soft song and Puppy yawns. Puppy falls asleep;
   Lulu snuggles under her own blanket next to him. Good night. */
const DUR=55, SC=[0,5,12,19,26,33,40,47,55];
const NAVY='#2D2A6E', PINK='#FF5D8F', PURPLE='#7B5CFF', ORANGE='#F27A12', TEAL='#19B8A6', GOLD='#FFE58A', BLUE='#3FA9F5';
const PX=780, BLX=822;   // Puppy's place at night and the middle of his blanket

const lulu=(lt,t,o={})=>{
  const x=o.x, j=jumps(lt,o.hops||[],.6,o.h||26), w=o.wave?20+20*Math.sin(lt*9):(o.wing||0);
  return shadow(x,522,60,-j.y)+place(x,520+j.y+(o.bob||0),duck({eye:o.eye!=null?o.eye:blink(t,0),wing:w,asleep:o.asleep}),{s:1,sx:j.sx,sy:j.sy*(o.sy||1),rot:o.rot||0,flip:o.flip});
};
// Puppy faces left (towards Lulu). yawn = 0..1 how wide his mouth is open.
const pup=(lt,t,o={})=>{
  const x=o.x, j=o.j||jumps(lt,o.hops||[],.6,o.h||24), yw=o.yawn||0;
  const mouth=yw>0?`<ellipse cx="94" cy="-92" rx="${7+3*yw}" ry="${3+10*yw}" fill="#5a2a1a"/><ellipse cx="94" cy="${-88+6*yw}" rx="${4+2*yw}" ry="${2+3*yw}" fill="#FF8FA3"/>`:'';
  return (o.noShadow?'':shadow(x,522,70,-j.y))+place(x,520+j.y+(o.bob||0),puppy({eye:o.eye!=null?o.eye:blink(t,1.6),tail:o.asleep?-3.4:(o.tail!=null?o.tail:Math.sin(t*9)),ear:o.ear||0,asleep:o.asleep})+mouth,{s:.95,sx:j.sx,sy:j.sy*(o.sy||1),rot:o.rot||0,flip:true});
};
const hopList=(a,b,step)=>{const r=[];for(let s=a;s<b-.01;s+=step)r.push(s);return r;};
const walkBob=(w,lt)=>w>0&&w<1?-8*Math.abs(Math.sin(lt*7)):0;
const sideClouds=(t,n)=>cloud(1000+12*Math.sin(t*.3),250,.6,1-n*.9);
const zzz=(lt,x,y,t0=2)=>{let s='';for(let k=0;k<3;k++){let q=lt-t0-k*.9;if(q>0){q%=2.7;
  s+=`<text x="${x+q*24+8*Math.sin(q*3)}" y="${y-q*30}" font-size="${28+q*11}" fill="#fff" opacity="${Math.sin(Math.PI*q/2.7)*.95}">z</text>`;}}return s;};
const blanket=u=>cosyBlanket(BLX,520,176,96,u,'#8FB8FF','#FFFFFF');
const STAR3=[[400,96,PINK],[640,78,ORANGE],[880,96,BLUE]];
const notes=(lt,x,y,t0,t1)=>{let s='';for(let k=0;k<6;k++){const q=lt-t0-k*.7;if(q>0&&q<2.6&&t0+k*.7<t1){const u=q/2.6;
  s+=musicNote(x+40*u*3+14*Math.sin(q*3+k),y-170*u,1+.2*u,['#FFE58A','#FFB3C7','#BFD8FF'][k%3],Math.sin(Math.PI*u));}}return s;};

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let n=0,props='',chars='',pops='',cap='',o={},behind='',front='';
  switch(i){
  case 0:{
    // title: Lulu waves, Puppy hops
    props=tree(150,520,.8);
    chars=lulu(lt,t,{x:400,hops:[.8,3.0],h:20,wave:lt>1.4&&lt<3})+pup(lt,t,{x:840,hops:[1.2,2.0,3.4],h:30});
    pops=pop(`${LULU}<tspan fill="${NAVY}"> Helps Puppy Sleep</tspan>`,640,150,60,PINK,lt,.4,-2);
    break;}
  case 1:{
    // Lulu and Puppy play ball; the sun goes down
    n=lerp(0,.45,eio(prog(lt,3.8,7))); o={noSun:true,noMoon:true};
    behind=sun(t,1150,lerp(100,560,eio(prog(lt,3.8,7))));
    props=tree(150,520,.8);
    // ball goes back and forth three times, then rests by Puppy
    const bt=clamp(lt/4.2)*3, k=Math.min(2,Math.floor(bt)), u=Math.min(1,bt-k), dir=k%2?-1:1;
    const bx=lerp(dir>0?500:740,dir>0?740:500,u), by=486-150*4*u*(1-u);
    chars=lulu(lt,t,{x:380,hops:[2.6],h:22})+pup(lt,t,{x:860,hops:[1.2,3.8],h:26});
    front=shadow(bx,522,30,486-by)+ball(bx,by,34,lt*360);
    cap=lt<3.8?caption('Lulu and Puppy play all day.',lt,.3):caption('The sun goes down.',lt,3.8);
    pops=pop('Catch!',640,160,92,ORANGE,lt,.6,-3);
    break;}
  case 2:{
    // Lulu is sleepy, but Puppy is wide awake (boing, boing!)
    n=lerp(.45,.7,eio(prog(lt,0,7))); o={noSun:true};
    props=tree(150,520,.8)+ball(1040,486,34,20);
    const sleepy=lt>.8&&lt<3.2;
    chars=lulu(lt,t,{x:400,eye:sleepy?.35:blink(t,0),rot:sleepy?-4:0})
         +pup(lt,t,{x:PX,hops:hopList(3.4,6.6,.8),h:40,ear:lt>3.4?.8:0});
    cap=lt<3.4?caption('Lulu is sleepy.',lt,.3):caption('But Puppy is wide awake!',lt,3.4);
    pops=lt<3.4?pop('Yawn...',400,165,80,PURPLE,lt,.8,-3):pop('Boing! Boing!',800,165,80,ORANGE,lt,3.6,3);
    break;}
  case 3:{
    // Lulu brings a soft blanket; snuggle in, Puppy
    n=lerp(.7,.85,eio(prog(lt,0,7))); o={noSun:true};
    const w=eio(prog(lt,.2,1.6)), bu=eout(prog(lt,1.8,3.0)), back2=eio(prog(lt,3.4,4.6));
    props=tree(150,520,.8)+ball(1040,486,34,20);
    // the folded blanket Lulu carries in her wing, then it covers Puppy
    const carry=bu<=0?`<g transform="translate(${lerp(-60,480,w)+70},${450+walkBob(w,lt)})"><rect x="-44" y="-22" width="88" height="44" rx="14" fill="#8FB8FF"/><circle cx="-20" cy="-4" r="6" fill="#fff" opacity=".75"/><circle cx="14" cy="6" r="6" fill="#fff" opacity=".75"/></g>`:'';
    const lx=bu>0?lerp(480,400,back2):lerp(-60,480,w);
    chars=lulu(lt,t,{x:lx,bob:walkBob(w,lt)+walkBob(back2,lt)})+carry
         +pup(lt,t,{x:PX,tail:-3.4+Math.sin(t*4)*.5})+blanket(bu);
    if(bu>0&&bu<1)front=sparkle(BLX-60,420,1,1-bu)+sparkle(BLX+70,440,.8,1-bu);
    cap=lt<3.4?caption('Lulu brings a soft blanket.',lt,.3):caption('Snuggle in, Puppy!',lt,3.4);
    pops=pop('Cosy!',640,165,100,TEAL,lt,3.6,-3);
    break;}
  case 4:{
    // let's count the stars: one, two, three
    n=lerp(.85,1,eio(prog(lt,0,4))); o={noSun:true};
    props=tree(150,520,.8)+ball(1040,486,34,20);
    STAR3.forEach(([x,y,c],k)=>{const u=prog(lt,1.0+k*1.1,1.5+k*1.1);if(u>0)
      props+=bigStar(x,y,44*back(u)*(1+.06*Math.sin(t*4+k)),'#FFE58A',8*Math.sin(t*2+k),true,blink(t,k*.7));});
    chars=lulu(lt,t,{x:400,rot:-6})+pup(lt,t,{x:PX,tail:-3.4+Math.sin(t*3)*.4,ear:.3})+blanket(1);
    cap=lt<4.6?caption('Let’s count the stars.',lt,.3):caption('Good night, stars!',lt,4.6);
    STAR3.forEach(([x,y,c],k)=>{pops+=pop(['One,','two,','three!'][k],x,230,72,c,lt,1.1+k*1.1,-3);});
    break;}
  case 5:{
    // Lulu hums a soft song; Puppy yawns
    n=1; o={noSun:true};
    props=tree(150,520,.8)+ball(1040,486,34,20)+notes(lt,500,400,.6,5.6);
    const yw=prog(lt,3.8,4.4)*(1-prog(lt,5.4,6.0));
    chars=lulu(lt,t,{x:400,bob:2*Math.sin(lt*3)})+pup(lt,t,{x:PX,eye:lt>3.6?.45:.8,yawn:yw,tail:-3.4+Math.sin(t*2)*.3})+blanket(1);
    cap=lt<3.6?caption('Lulu hums a soft song.',lt,.3):caption('Puppy yawns.',lt,3.6);
    pops=lt<3.6?pop('Hmm, hmm, hmm...',480,165,72,PURPLE,lt,.6,-3):pop('Yaaawn!',800,165,84,ORANGE,lt,3.9,3);
    break;}
  case 6:{
    // Puppy falls asleep; good night, Puppy
    n=1; o={noSun:true};
    props=tree(150,520,.8)+ball(1040,486,34,20);
    for(let k=0;k<4;k++){let q=lt-1.0-k*.6;if(q>0&&q<2.4){const u=q/2.4;
      props+=heart(560+k*30+10*Math.sin(q*4+k),360-110*u,1,['#FF5D8F','#FF9F1C','#7B5CFF'][k%3],Math.sin(Math.PI*u));}}
    const asleep=lt>1.0;
    chars=lulu(lt,t,{x:400})+pup(lt,t,{x:PX,asleep,eye:.45,tail:-3.4,sy:1+.02*Math.sin(lt*2.2)})+blanket(1);
    pops=zzz(lt,700,380,1.6)+pop('Shh...',400,165,80,PURPLE,lt,3.6,-3);
    cap=lt<3.6?caption('Puppy falls asleep.',lt,.3):caption('Good night, Puppy.',lt,3.6);
    break;}
  case 7:{
    // Lulu is sleepy too; she snuggles under her own blanket. The End.
    n=1; o={noSun:true};
    props=tree(150,520,.8)+ball(1040,486,34,20);
    const asleep=lt>2.2, lb=eout(prog(lt,.8,1.8)), br=k=>1+.02*Math.sin(lt*2.2+k);
    chars=shadow(520,522,60)+place(520,520,duck({asleep,eye:.45}),{s:1,sy:br(0),rot:asleep?3:0})
         +cosyBlanket(505,520,170,66,lb,'#FFB3C7','#FFFFFF')
         +pup(lt,t,{x:PX,asleep:true,tail:-3.4,sy:br(1)})+blanket(1);
    pops=zzz(lt,700,380,0)+zzz(lt,560,370,2.8);
    cap=lt<3.6?caption('Lulu is sleepy too.',lt,.4):caption('Good night, Lulu.',lt,3.6);
    pops+=pop('The End',640,150,112,GOLD,lt,4.6,-3,NAVY);
    break;}
  }
  o.noClouds=true;
  svg.innerHTML=bg(t,n,sideClouds(t,n)+behind,o)+props+chars+front+nightTint(n)+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=bg(0,.85,'',{noSun:true,noClouds:true});
  s+=bigStar(150,90,40,'#FFE58A',-8,true)+bigStar(1010,120,34,'#FFE58A',10,true);
  s+=`<g transform="translate(0,40)">`+place(400,520,duck({wing:22}),{s:1.25})+place(820,520,puppy({eye:1,tail:-3.4}),{s:1.2,flip:true})+cosyBlanket(872,520,220,118,1,'#8FB8FF','#fff')+'</g>';
  s+=label(`${LULU}<tspan fill="${NAVY}"> Helps</tspan>`,640,125,100,PINK,-2);
  s+=label(`<tspan fill="${NAVY}">Puppy Sleep</tspan>`,640,235,96,PINK,-2);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
