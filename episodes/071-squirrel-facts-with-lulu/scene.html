<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 71 - Did you know? Squirrel facts.  Title (Squirrel hops in with an acorn, Lulu waves),
   fact 1 (squirrels bury nuts to eat later: dig, drop, pat pat), some buried nuts grow into new oak trees,
   fact 2 (the bushy tail helps it balance: runs along a branch and jumps to the next one),
   fact 3 (its front teeth never stop growing, close-up), crunch (chewing keeps its teeth short),
   recap (bury, balance, teeth), bye bye. */
const SC=[0,5.5,12.5,19,26,32.5,39,45.5,52], DUR=52;
const NAVY='#2D2A6E', PURPLE='#7B5CFF', ORANGE='#E76F2E', BROWN='#A65D2A', GOLD='#FFE58A';
const lulu=(x,lt,t,o={})=>{
  const j=jumps(lt,o.hops||[],.6,o.h||24), w=o.wave?20+20*Math.sin(lt*9):0, s=o.s||.9;
  return shadow(x,522,56*s/.95,-j.y)+place(x,520+j.y,duck({eye:o.eye!=null?o.eye:blink(t,0),wing:w}),{s,sx:j.sx,sy:j.sy,flip:o.flip});
};
const sq=(x,y,lt,t,o={},s=.85)=>{
  const j=jumps(lt,o.hops||[],.45,o.h||26);
  return shadow(x,y+2,52*s/.85,-j.y)+place(x,y+j.y,squirrel(Object.assign({eye:blink(t,1.3),tail:Math.sin(t*2.2)*.6},o)),{s,sx:j.sx,sy:j.sy,flip:o.flip});
};
const grow=(lt,t0)=>lt>t0?back(prog(lt,t0,t0+.4)):0;
let WIN=0;
function closeWin(x,y,r,g,inner,bgc){
  if(g<=0)return '';
  const id='w'+(WIN++);
  return `<g transform="translate(${x},${y}) scale(${g})"><defs><clipPath id="${id}"><circle r="${r}"/></clipPath></defs>
  <g clip-path="url(#${id})"><circle r="${r}" fill="${bgc}"/>${inner}</g>
  <circle r="${r}" fill="none" stroke="#fff" stroke-width="9"/></g>`;
}
const HX=600; // the hole where the acorn is buried
function render(t){
  WIN=0;
  const [i,lt]=sceneAt(t,SC);
  let props='',chars='',pops='',cap='',o={noSun:true};
  if(i===0){
    const u=prog(lt,0,1.6), x=lerp(-140,430,eio(u));
    chars=sq(x,520,lt,t,{acorn:true,hops:[.1,.6,1.1,2.4],h:30})+lulu(900,lt,t,{hops:[1.8],h:28,wave:lt>.6,flip:true});
    pops=pop('Did you know?',640,165,96,PURPLE,lt,.3,-3);
    cap=caption('Fun squirrel facts with Lulu',lt,2.0);
  }else if(i===1){
    const x=lerp(-120,480,eio(prog(lt,0,1.4)));
    const dig=lt<2.8?(prog(lt,1.5,1.8)-prog(lt,2.5,2.8)):[3.6,4.0,4.4].reduce((a,p)=>Math.max(a,1-Math.abs(lt-p)/.2),0);
    const held=lt<2.8;
    if(lt>1.8&&lt<4.6) props+=hole(HX,524);
    if(!held&&lt<3.2){const u=prog(lt,2.8,3.2);props+=acorn(lerp(HX-40,HX,u),lerp(470,526,u*u),.9);}
    if(lt>3.3) props+=soil(HX,522,prog(lt,3.4,4.6));
    chars=sq(x,520,lt,t,{acorn:held,dig,hops:[.1,.55,1.0],h:26})+lulu(1010,lt,t,{flip:true,hops:[5.0],h:20});
    pops=pop('Fact 1',640,160,100,ORANGE,lt,.3)+(lt>3.6?pop('Pat, pat!',850,330,72,GOLD,lt,3.6,-4,NAVY):'');
    cap=lt<3.6?caption('Squirrels bury nuts to eat later.',lt,.6):caption('They hide them in the ground.',lt,3.6);
  }else if(i===2){
    const h=160*eio(prog(lt,1.0,4.6));
    props=soil(HX,522,1-prog(lt,1.0,2.0)*.6)+sapling(HX,520,h,t);
    let sp='';
    if(lt>1&&lt<4.8)[[HX-80,420],[HX+70,380],[HX-50,330],[HX+90,460]].forEach(([x,y],k)=>{const q=(lt*1.4+k*.25)%1;sp+=sparkle(x,y,.7+.3*Math.sin(q*Math.PI),Math.sin(q*Math.PI));});
    chars=sq(380,520,lt,t,{})+lulu(1010,lt,t,{flip:true,hops:[4.8],h:22});
    props+=sp;
    pops=lt>4.6?pop('Wow!',870,320,80,GOLD,lt,4.6,-4,NAVY):'';
    cap=lt<3.6?caption('Some nuts stay in the ground.',lt,.5):caption('They grow into new oak trees!',lt,3.6);
  }else if(i===3){
    const BY=360;
    props=branch(-40,BY-8,520,BY)+branch(1320,BY-8,760,BY);
    let x,y=BY-4,j={y:0},st=0;
    if(lt<3.6){x=lerp(-60,470,eio(prog(lt,.2,3.2)));st=lt<3.2?lt*14:0;}
    else if(lt<4.4){const u=prog(lt,3.6,4.4);x=lerp(470,800,u);y=BY-4-48*4*u*(1-u);}
    else {x=lerp(800,960,eio(prog(lt,4.6,6)));st=lt<6?lt*14:0;}
    chars=shadow(x,BY+2,30,BY-4-y)+place(x,y,squirrel({eye:blink(t,1.3),tail:Math.sin(lt*7)*.9,step:st}),{s:.6});
    chars+=lulu(640,lt,t,{s:.8,eye:blink(t,0),hops:[4.6],h:16});
    pops=pop('Fact 2',640,160,100,ORANGE,lt,.3);
    cap=lt<3.6?caption('Its bushy tail helps it balance.',lt,.6):caption('Jump! From branch to branch!',lt,3.6);
  }else if(i===4){
    chars=sq(300,520,lt,t,{teeth:true},.9)+lulu(1060,lt,t,{flip:true,hops:[4.6],h:20});
    const g=grow(lt,1.4);
    props=closeWin(690,385,128,g,`<rect x="-140" y="60" width="280" height="90" fill="#6CC24A"/>`+place(-128,232,squirrel({eye:blink(t,.4),teeth:true,tail:0}),{s:2.3}),'#BFE8FF');
    pops=pop('Fact 3',640,160,100,ORANGE,lt,.3);
    cap=lt<3.6?caption('Its front teeth never stop growing.',lt,.6):caption('So it chews and chews!',lt,3.6);
  }else if(i===5){
    const chewing=lt>.8&&lt<4.2;
    let bits='';
    [1.8,2.6,3.4].forEach((p,k)=>{const u=prog(lt,p,p+.7);if(u>0&&u<1){const dx=(k-1)*40;bits+=`<circle cx="${560+dx*u}" cy="${440-50*Math.sin(u*Math.PI)+40*u}" r="5" fill="#C27A3A" opacity="${1-u}"/>`;}});
    chars=sq(500,520,lt,t,{acorn:lt<4.4,teeth:true,chew:chewing?lt*3:0},.95)+bits+lulu(920,lt,t,{flip:true,hops:[4.6],h:22,wave:lt>4.9});
    pops=pop('Crunch, crunch!',640,165,90,GOLD,lt,.5,-3,NAVY);
    cap=lt<3.6?caption('Chewing keeps its teeth short.',lt,.6):caption('Good job, Squirrel!',lt,3.6);
  }else if(i===6){
    const b=k=>1+.05*Math.sin(t*4+k*2), X=[300,640,980], Y=390, sky='#BFE8FF';
    const gr='<rect x="-130" y="50" width="260" height="120" fill="#7CCB5E"/>';
    props=closeWin(X[0],Y,118,grow(lt,.4)*b(0),gr+soil(-30,52,1)+acorn(-30,30,1.1)+sapling(50,52,110,t),sky);
    props+=closeWin(X[1],Y,118,grow(lt,1.4)*b(1),branch(-140,36,140,40)+place(-10,36,squirrel({eye:blink(t,.8),tail:Math.sin(t*3)*.8}),{s:.55}),sky);
    props+=closeWin(X[2],Y,118,grow(lt,2.4)*b(2),gr+place(-118,214,squirrel({eye:blink(t,1.6),teeth:true,tail:0}),{s:2.1}),sky);
    pops=pop('bury',X[0],230,54,GOLD,lt,.4,0,NAVY)+pop('balance',X[1],230,54,GOLD,lt,1.4,0,NAVY)+pop('teeth',X[2],230,54,GOLD,lt,2.4,0,NAVY);
    cap=caption('Squirrels are amazing!',lt,3.6);
  }else{
    props=tree(170,520,.9);
    const u=prog(lt,1.4,5.2);
    chars=sq(lerp(560,300,eio(u)),520,lt,t,{acorn:true,flip:true,hops:[.8,1.6,2.1,2.6,3.1,3.6,4.1,4.6],h:22},.85);
    chars+=lulu(1000,lt,t,{flip:true,wave:lt>.8,hops:[.8],h:22});
    pops=pop('Bye bye!',700,165,100,GOLD,lt,.4,-3,NAVY);
    cap=caption('Bye bye, little squirrel!',lt,1.4);
  }
  o.noFlowers=(i===1||i===2||i===6);
  svg.innerHTML=bg(t,0,'',o)+props+chars+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=`<defs>${skyGrad('g','#6CC6FF','#CFF0FF')}${CLIP}</defs><rect width="1280" height="720" fill="url(#g)"/>`;
  s+=cloud(140,120,1,1)+cloud(1130,110,.9,1);
  s+=`<path d="M0,500 Q300,430 640,480 T1280,470 L1280,720 L0,720Z" fill="#8FD86E"/>`;
  s+=`<path d="M0,580 Q380,520 760,565 T1280,550 L1280,720 L0,720Z" fill="#6DBF55"/>`;
  s+=sapling(1150,640,120,0)+acorn(1050,662,1.3,-10);
  s+=shadow(860,664,110)+place(840,660,squirrel({acorn:true,tail:.3}),{s:1.55});
  s+=shadow(255,662,100)+place(250,658,duck({wing:22}),{s:1.45});
  s+=label('Did you know?',640,175,120,PURPLE,-3);
  s+=label('Fun squirrel facts',640,295,96,'#fff',-2,BROWN);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
