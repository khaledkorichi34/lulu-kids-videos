<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script src="../../toolkit/rhymes.js"></script>
<script>
/* Episode 74 - Twinkle, Twinkle, Little Star in the snow (sing-along, third time for this rhyme, new
   setting and cast). A snowy winter night: Lulu in her woolly hat stands by a friendly snowman who
   waves on every "twinkle"; the big star rises on "Up above the world so high" and diamonds sparkle
   around it. Verse 2: soft snow begins to fall and Penguin waddles in to listen.
   Ending: everyone waves, the star closes its eyes, "Good night, little star!" */
const BPM=92, START=5.0;
const LINES=rhymeTimes(RHYMES.twinkle,START,2,4,BPM);
const END=rhymeEnd(LINES);                 // about 70.2 s
const DUR=76, SC=[0,DUR];
const SPB=60/BPM;
const V2=LINES[6].t0;                      // second verse starts (about 39.5 s)
const SX=800, SY=215;                      // the big star
const LX=440, MX=175, PXEND=1110;          // Lulu, the snowman, where Penguin stops

const GLOW='<defs><radialGradient id="glow"><stop offset="0" stop-color="#FFF3B8" stop-opacity=".5"/><stop offset="1" stop-color="#FFF3B8" stop-opacity="0"/></radialGradient></defs>';
function diamond(x,y,s,o){return `<path transform="translate(${x},${y}) scale(${s})" d="M0,-16 L11,0 L0,16 L-11,0Z" fill="#CFF3FF" opacity="${o}"/><path transform="translate(${x},${y}) scale(${s})" d="M0,-16 L3,0 L0,16 L-3,0Z" fill="#fff" opacity="${o}"/>`;}
// soft falling snow from verse 2 (small flakes, faint where the star and the words sit)
function snowfall(t,o){
  if(o<=0)return '';let s='';
  for(let k=0;k<16;k++){const sp=24+(k%4)*7, y=((k*83+t*sp)%560)-30, x=(k*151+40)%1280+18*Math.sin(t*.8+k);
    const near=y>40&&y<360&&x>560&&x<1040?.15:1;
    s+=snowflake(x.toFixed(1),y.toFixed(1),.42+(k%3)*.14,t*20+k*30,o*.8*near);}
  return s;
}
const drifts=()=>snowDrift(1235,540,.55)+snowDrift(40,560,.45);

function render(t){
  const n=t<3?lerp(.55,1,eio(prog(t,0,3))):1;
  const li=currentLine(LINES,t), L=li>=0?LINES[li]:null, line=L?L.index:-1;
  const p=t<END+.5?beatPulse(LINES,t):0;
  const sway=t>START-.5&&t<END+.6?Math.sin(2*Math.PI*(t-START)/(2*SPB)):0;
  const bye=t>END+1.2?Math.sin((t-END-1.2)*5):0, byeOn=t>END+1.2&&t<DUR-1.6;
  const starSleep=t>END+2.6;
  let props='',chars='',sky='',pops='',cap='';

  // the star rises a little on "Up above the world so high"
  const up=line===2?eio(prog(t,L.t0,L.t0+1.2)):line===3?1-eio(prog(t,L.t0,L.t0+1.4)):0;
  const sg=back(prog(t,4.3,5.0))*(t>4.3?1:0);
  const sy=SY-50*up, sr=68*sg*(1+.12*p);

  props+=drifts();

  // the snowman waves on every "twinkle"
  const tw=(line===0||line===4)?p:0;
  const arm=byeOn?.5+.5*bye:(t>START?.25+.75*tw:0);
  chars+=place(MX,524,snowman({eye:blink(t,1.2),arm}),{s:.82});

  // Lulu in her woolly hat sways with the music
  const lw=byeOn?30+30*bye:12+10*sway;
  chars+=shadow(LX,522,60)+place(LX,520-6*p,duck({eye:blink(t,0),wing:lw})+woollyHat(42,-138,.62,'#FF5D8F'),{s:1.0,rot:4*sway});

  // verse 2: Penguin waddles in from the right to listen
  const ws=V2-4.5, we=V2-.8;
  if(t>ws){
    const u=eio(prog(t,ws,we)), x=lerp(1380,PXEND,u), walking=t<we;
    const wad=walking?6*Math.sin(t*14):0;
    const fl=byeOn?.6+.4*bye:.2+.5*tw;
    chars+=shadow(x,522,52)+place(x,520-(walking?0:5*p),penguin({eye:blink(t,.8),flap:fl}),{s:.85,flip:true,rot:wad-3*sway});
  }

  // the big star
  if(sg>0){
    sky+=GLOW+`<circle cx="${SX}" cy="${sy}" r="${160*sg*(1+.1*p)}" fill="url(#glow)"/>`;
    sky+=bigStar(SX,sy,sr,'#FFD93B',6*Math.sin(t*1.3),true,starSleep?.12:blink(t,2));
  }
  // diamonds on "Like a diamond in the sky", one per syllable
  for(const Lx of LINES)if(Lx.index===3&&t>=Lx.t0&&t<Lx.t1+2.5){
    const fade=1-prog(t,Lx.t1+1.2,Lx.t1+2.5);
    Lx.words.forEach((w,k)=>{if(t>=w.t0){const a=-2.7+k*.9,s=back(prog(t,w.t0,w.t0+.3))*(1+.15*Math.sin(t*6+k));
      sky+=diamond(SX+170*Math.cos(a),SY+20+115*Math.sin(a),s*1.3,fade);}});
  }
  // a little wonder bubble above Lulu on "How I wonder what you are!"
  for(const Lx of LINES)if(Lx.index===1&&t>=Lx.t0-.2&&t<Lx.t1+.6){
    const o=prog(t,Lx.t0-.2,Lx.t0+.3)*(1-prog(t,Lx.t1,Lx.t1+.6));
    sky+=`<g opacity="${o}"><circle cx="505" cy="292" r="9" fill="#fff"/><circle cx="525" cy="264" r="13" fill="#fff"/><circle cx="555" cy="214" r="38" fill="#fff"/><text x="555" y="230" text-anchor="middle" font-size="46" fill="#7B5CFF">?</text></g>`;
  }
  // soft snow from the start of verse 2
  const so=prog(t,V2-6,V2-3);

  // title, then the words of the song, then good night
  const to=1-prog(t,3.7,4.3);
  if(to>0)pops=`<g opacity="${to}">`+pop('Twinkle, Twinkle,',760,160,82,'#FFD23F',t,.4,-2,'#2D2A6E')+pop('Little Star',760,272,110,'#FFD23F',t,1.0,2,'#2D2A6E')+`</g>`;
  cap=t<END+1.4?karaoke(LINES,t,'#3FA9F5'):caption('Good night, little star!',t-END,1.6);

  svg.innerHTML=bg(t,n,'',{noMoon:true,noSun:true,noFlowers:true})+snowHills(1,n)+props+chars+nightTint(.4*n)+snowfall(t,so)+sky+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=bg(0,1,'',{noMoon:true,noSun:true,noFlowers:true})+snowHills(1,1)+snowDrift(1230,600,.6);
  s+=place(120,670,snowman({arm:.8}),{s:.95});
  s+=shadow(420,662,110)+place(410,658,duck({wing:24})+woollyHat(42,-138,.62,'#FF5D8F'),{s:1.55});
  s+=nightTint(.4)+snowfall(3,1);
  s+=GLOW+`<circle cx="910" cy="200" r="230" fill="url(#glow)"/>`+bigStar(910,200,110,'#FFD93B',-6,true);
  s+=label('Twinkle, Twinkle,',905,430,72,'#FFD23F',-3,'#2D2A6E')+label('Little Star',905,530,100,'#FFD23F',-2,'#2D2A6E');
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
