<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 79 - Lulu Tidies Up. Lulu and Pip the kitten play all day and the toys are everywhere.
   Time to tidy up: here is the toy box. Pip pushes the ball in (boing!), Lulu puts in three blocks
   (one, two, three), the xylophone goes in last (ding!). All tidy, hooray! The sun goes down,
   thank you, Pip; Lulu and Pip sleep by the toy box. Good night. */
const DUR=55, SC=[0,5,12,19,26,33,40,47,55];
const NAVY='#2D2A6E', PINK='#FF5D8F', PURPLE='#7B5CFF', ORANGE='#F27A12', TEAL='#19B8A6', GOLD='#FFE58A', BLUE='#3FA9F5';
const BX=640;                                   // the toy box
const BLK=[[130,BLOCKS[0],-8],[198,BLOCKS[2],6],[266,BLOCKS[4],-4]];   // blocks on the grass
const BLK_IN=[[588,446,-10],[640,442,8],[694,446,-6]];                 // blocks in the box
const BALL_X=840, BALL_IN=[700,442];
const XY_X=1140, XY_S=.55, XY_IN=[628,430];

const lulu=(lt,t,o={})=>{
  const x=o.x, j=jumps(lt,o.hops||[],.6,o.h||24), w=o.wave?20+20*Math.sin(lt*9):(o.wing||0);
  return shadow(x,522,60,-j.y)+place(x,520+j.y+(o.bob||0),duck({eye:o.eye!=null?o.eye:blink(t,0),wing:w,asleep:o.asleep}),{s:1,sx:j.sx,sy:j.sy*(o.sy||1),rot:o.rot||0,flip:o.flip});
};
const pip=(lt,t,o={})=>{
  const x=o.x, j=jumps(lt,o.hops||[],.6,o.h||24);
  return shadow(x,522,56,-j.y)+place(x,520+j.y,kitten({eye:o.eye!=null?o.eye:blink(t,1.3),tail:o.tail!=null?o.tail:Math.sin(t*3),asleep:o.asleep,tilt:o.tilt||0}),{s:.95,sx:j.sx,sy:j.sy*(o.sy||1)});
};
const walkBob=(w,lt)=>w>0&&w<1?-8*Math.abs(Math.sin(lt*7)):0;
// arc from (x0,y0) to (x1,y1) with the top at height top, u = 0..1
const arc=(x0,y0,x1,y1,top,u)=>{const e=eio(u);return [lerp(x0,x1,e),lerp(y0,y1,e)-4*top*u*(1-u)];};
const zzz=(lt,x,y,t0=2)=>{let s='';for(let k=0;k<3;k++){let q=lt-t0-k*.9;if(q>0){q%=2.7;
  s+=`<text x="${x+q*24+8*Math.sin(q*3)}" y="${y-q*30}" font-size="${28+q*11}" fill="#fff" opacity="${Math.sin(Math.PI*q/2.7)*.95}">z</text>`;}}return s;};
const notes=(lt,x,y,t0,t1)=>{let s='';for(let k=0;k<5;k++){const q=lt-t0-k*.6;if(q>0&&q<2.4&&t0+k*.6<t1){const u=q/2.4;
  s+=musicNote(x+30*u*3+12*Math.sin(q*3+k),y-150*u,.9+.2*u,['#FF5D8F','#7B5CFF','#3FA9F5'][k%3],Math.sin(Math.PI*u));}}return s;};
const hearts=(lt,x,y,t0)=>{let s='';for(let k=0;k<5;k++){const q=lt-t0-k*.45;if(q>0&&q<2.4){const u=q/2.4;
  s+=heart(x+(k-2)*60+10*Math.sin(q*4+k),y-120*u,1.1,['#FF5D8F','#FF9F1C','#7B5CFF'][k%3],Math.sin(Math.PI*u));}}return s;};
// toys: state = how many are already in the box (0 none, 1 ball, 4 ball + blocks, 5 everything)
const toysOut=(t,st)=>{let s='';
  if(st<4)BLK.forEach(([x,c,r],k)=>{if(st<2+k)s+=toyBlock(x,520,c,r);});
  if(st<1)s+=ball(BALL_X,520,34,0);
  if(st<5)s+=xylophone(XY_X,520,XY_S);
  return s;};
const boxIn=(st,extra='')=>{let s=boxBack(BX,520);
  if(st>=1)s+=ball(BALL_IN[0],BALL_IN[1],32,30);
  BLK_IN.forEach(([x,y,r],k)=>{if(st>=2+k)s+=toyBlock(x,y,BLK[k][1],r,.9);});
  if(st>=5)s+=xylophone(XY_IN[0],XY_IN[1],XY_S);
  return s+extra+boxFront(BX,520);};

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let n=0,props='',chars='',pops='',cap='',o={},behind='',front='';
  switch(i){
  case 0:{
    // title: Lulu and Pip with their toys
    props=toysOut(t,0);
    chars=lulu(lt,t,{x:520,hops:[.8,3.0],h:22,wave:lt>1.4&&lt<3})+pip(lt,t,{x:700,hops:[1.2,2.2,3.4],h:28});
    pops=pop(`${LULU}<tspan fill="${NAVY}"> Tidies Up</tspan>`,640,150,76,PINK,lt,.4,-2);
    break;}
  case 1:{
    // Lulu and Pip play all day; now the toys are everywhere
    const hit=lt<1.2?0:lt<2.0?2:lt<2.8?4:-1, ht=lt<1.2?lt-.6:lt<2.0?lt-1.4:lt-2.2;
    props=BLK.map(([x,c,r])=>toyBlock(x,520,c,r)).join('')+xylophone(XY_X,520,XY_S,lt>.6&&lt<2.8?hit:-1,Math.max(0,ht))+notes(lt,XY_X,400,.6,2.8);
    // Pip pats the ball: it rolls a little left and back
    const bu=prog(lt,3.0,4.2)-prog(lt,4.6,5.8), bx=lerp(BALL_X,BALL_X-90,eio(Math.max(0,bu)));
    props+=ball(bx,520,34,(bx-BALL_X)*1.7);
    chars=lulu(lt,t,{x:470,hops:[.6,1.4,2.2],h:18})+pip(lt,t,{x:930,hops:[2.8,4.4],h:22});
    cap=lt<3.6?caption('Lulu and Pip play all day.',lt,.3):caption('Now toys are everywhere!',lt,3.6);
    pops=lt<3.6?pop('Ding, ding!',640,160,84,PURPLE,lt,.7,-3):pop('Oh my!',640,160,92,ORANGE,lt,3.9,3);
    break;}
  case 2:{
    // time to tidy up! here is the toy box
    props=toysOut(t,0);
    const w=eio(prog(lt,.2,1.0)), bu=prog(lt,1.4,1.9);
    if(bu>0)props+=`<g transform="translate(${BX},520) scale(${back(bu)}) translate(${-BX},-520)">${boxIn(0)}</g>`;
    if(bu>0&&lt<3.4)props+=sparkle(BX-140,360,1.1,1-prog(lt,2.2,3.2))+sparkle(BX+150,340,.9,1-prog(lt,2.2,3.2))+sparkle(BX+10,330,.8,1-prog(lt,2.2,3.2));
    chars=lulu(lt,t,{x:lerp(520,400,w),bob:walkBob(w,lt),hops:[2.4,4.6],h:18,wave:lt>2.4&&lt<3.4})+pip(lt,t,{x:lerp(700,960,w),hops:[2.6,4.8],h:22});
    cap=lt<3.6?caption('Time to tidy up!',lt,.3):caption('Here is the toy box.',lt,3.6);
    pops=pop('Tidy time!',640,160,92,TEAL,lt,.6,-3);
    break;}
  case 3:{
    // Pip pushes the ball: boing, into the box!
    const u=prog(lt,1.0,2.2);
    props=toysOut(t,1);
    let bl='';
    if(u<1){const [x,y]=arc(BALL_X,520,BALL_IN[0],BALL_IN[1],150,u);bl=ball(x,y,u>0?lerp(34,32,u):34,-u*420);}
    // the ball is drawn between the box back and front once it is over the box
    props+=u<.55?boxIn(0)+bl:boxIn(u>=1?1:0,bl);
    chars=lulu(lt,t,{x:400,hops:[2.4,4.4],h:20})+pip(lt,t,{x:930,hops:[.6,4.6],h:26});
    cap=lt<3.6?caption('Pip pushes the ball.',lt,.3):caption('In the box!',lt,3.6);
    pops=pop('Boing!',840,160,88,ORANGE,lt,1.0,4)+pop('Yay!',420,160,84,PINK,lt,4.2,-4);
    break;}
  case 4:{
    // Lulu puts in the blocks: one, two, three
    let inside='', st=1;
    BLK.forEach(([x,c,r],k)=>{const u=prog(lt,.8+k*1.3,1.8+k*1.3);
      if(u>=1)st=2+k; else if(u>0){const [X,Y]=arc(x,520,BLK_IN[k][0],BLK_IN[k][1],260,u);inside+=toyBlock(X,Y,c,lerp(r,BLK_IN[k][2],u)+u*360,lerp(1,.9,u));}});
    props=BLK.map(([x,c,r],k)=>prog(lt,.8+k*1.3,1.8+k*1.3)>0?'':toyBlock(x,520,c,r)).join('')+xylophone(XY_X,520,XY_S)+boxIn(st,inside);
    chars=lulu(lt,t,{x:400,hops:[.7,2.0,3.3],h:18})+pip(lt,t,{x:930,hops:[5.0],h:22});
    cap=lt<4.6?caption('Lulu puts in the blocks.',lt,.3):caption('Three blocks in the box!',lt,4.6);
    ['One,','two,','three!'].forEach((w,k)=>{pops+=pop(w,[300,590,880][k],160,84,[PINK,ORANGE,BLUE][k],lt,1.7+k*1.3,-3);});
    break;}
  case 5:{
    // the xylophone goes in last; all tidy, hooray!
    const u=prog(lt,2.0,3.2), hit=lt<1.2?1:3, ht=lt<1.2?lt-.6:lt-1.2;
    let xy='';
    if(u<=0)xy=xylophone(XY_X,520,XY_S,lt>.6?hit:-1,Math.max(0,ht));
    else if(u<1){const [x,y]=arc(XY_X,520,XY_IN[0],XY_IN[1],130,u);xy=xylophone(x,y,XY_S);}
    props=hearts(lt,640,300,3.6)+(u<.6?boxIn(4)+xy:boxIn(u>=1?5:4,xy));
    chars=lulu(lt,t,{x:400,hops:[3.8,4.6,5.4],h:20,wave:lt>3.8&&lt<5})+pip(lt,t,{x:180,hops:[3.9,4.7,5.5],h:24});
    if(u>=1&&lt<4.2)front=sparkle(BX-120,360,1,1-prog(lt,3.2,4.2))+sparkle(BX+130,350,1,1-prog(lt,3.2,4.2));
    cap=lt<3.6?caption('Ding! The last toy.',lt,.3):caption('All tidy! Hooray!',lt,3.6);
    pops=lt<2.0?pop('Ding!',1140,390,76,PURPLE,lt,.6,3):lt<3.6?'':pop('Hooray!',640,160,100,PINK,lt,3.8,-3);
    break;}
  case 6:{
    // the sun goes down; thank you, Pip
    n=lerp(0,.7,eio(prog(lt,.3,6.5))); o={noSun:true,noMoon:true};
    behind=sun(t,1150,lerp(100,560,eio(prog(lt,.3,6.5))));
    props=boxIn(5);
    if(lt>3.6)props=hearts(lt,640,300,3.8)+props;
    chars=lulu(lt,t,{x:400,eye:lt>5.4?.5:blink(t,0),wing:lt>3.6&&lt<5?20:0})+pip(lt,t,{x:900,tilt:lt>3.6?8:0,eye:lt>5.4?.5:blink(t,1.3)});
    cap=lt<3.6?caption('The sun goes down.',lt,.3):caption('Thank you, Pip!',lt,3.6);
    break;}
  case 7:{
    // Lulu and Pip sleep by the toy box. The End.
    n=lerp(.7,1,eio(prog(lt,0,2))); o={noSun:true};
    props=boxIn(5);
    const br=k=>1+.02*Math.sin(lt*2.2+k);
    chars=lulu(lt,t,{x:400,asleep:lt>.8,eye:.45,sy:br(0),rot:lt>.8?3:0})+pip(lt,t,{x:900,asleep:lt>.8,eye:.45,tail:-.6,sy:br(1),tilt:lt>.8?-6:0});
    pops=zzz(lt,470,330,1.0)+zzz(lt,950,330,1.8);
    cap=lt<3.6?caption('Good night, Lulu.',lt,.3):caption('Good night, Pip.',lt,3.6);
    pops+=pop('The End',640,150,112,GOLD,lt,4.6,-3,NAVY);
    break;}
  }
  o.noClouds=true;
  svg.innerHTML=bg(t,n,cloud(1000+12*Math.sin(t*.3),250,.6,1-n*.9)+behind,o)+props+chars+front+nightTint(n)+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=bg(0,0,'',{noClouds:true,noSun:true});
  s+=`<g transform="translate(0,40)">`+boxIn(5)+place(330,520,duck({wing:24}),{s:1.2})+place(960,520,kitten({tail:.5}),{s:1.15})+'</g>';
  s+=sparkle(470,380,1.2)+sparkle(810,370,1)+sparkle(640,330,.9);
  s+=label(`${LULU}<tspan fill="${NAVY}"> Tidies Up</tspan>`,640,170,124,PINK,-2);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
