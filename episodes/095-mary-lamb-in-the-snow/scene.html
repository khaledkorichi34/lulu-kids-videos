<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script src="../../toolkit/rhymes.js"></script>
<script>
/* Episode 95 - Mary Had a Little Lamb in the snow (sing-along, third time for this rhyme, new
   setting and cast). A snowy winter day: Mary in a red woolly hat, her white lamb, Lulu in her
   pink woolly hat and a friendly snowman. The lamb hops on every "little lamb"; on "white as snow"
   little snowflakes swirl round its fleece and it says "Baa!".
   Verse 2: a little blue bird flies down and sits on the snowman's head.
   Verse 3: soft snow begins to fall and Bunny hops in.
   Ending: the snowman waves, the lamb snuggles up to Mary - "Bye-bye, little lamb!" */
const BPM=108, START=5.0;
const LINES=rhymeTimes(RHYMES.mary,START,3,4,BPM);
const END=rhymeEnd(LINES);                 // about 62.8 s
const DUR=68, SC=[0,DUR];
const VS=[0,4,8].map(i=>LINES[i].t0);      // verse starts
const SMX=120, MX=350, LX0=570, DX=800, BNX=1040;   // snowman, Mary, lamb, Lulu, Bunny
const SNOW=LINES.filter(L=>L.index===3).map(L=>L.words[5].t0);
const WHITE=LINES.filter(L=>L.index===3).map(L=>L.words[3].t0);
const BIRD_IN=[VS[1]-3.2,VS[1]-.6], BUN_IN=[VS[2]-3.0,VS[2]-.3];

function lineAt(t){const li=currentLine(LINES,t);return li>=0&&t<LINES[li].t1+.05?LINES[li]:null;}

function lambHop(t){
  for(const L of LINES){if(L.index!==1)continue;
    for(const k of [2,5]){const j=jump(t,L.words[k].t0,.45,38);if(j)return j;}}
  return {y:0,sx:1,sy:1};
}

// snowflakes swirling round the lamb's white fleece on "white as snow"
function fleeceFlakes(t,lx){
  let s='';
  WHITE.forEach(w=>{const a=t-w;if(a<0||a>3.2)return;
    const o=Math.min(1,a*3)*(1-prog(a,2.4,3.2));
    for(let k=0;k<6;k++){const ang=k*Math.PI/3+a*.9, r=100+8*Math.sin(a*5+k);
      s+=snowflake((lx+Math.cos(ang)*r).toFixed(1),(450+Math.sin(ang)*r*.72).toFixed(1),.6+.15*Math.sin(a*6+k),a*60+k*30,o);}
  });
  return s;
}

// soft falling snow from verse 3 (small flakes, kept above the caption bar)
function snowfall(t,o){
  if(o<=0)return '';let s='';
  for(let k=0;k<16;k++){const sp=26+(k%4)*7, y=((k*83+t*sp)%560)-30, x=(k*151+40)%1280+18*Math.sin(t*.8+k);
    s+=snowflake(x.toFixed(1),y.toFixed(1),.4+(k%3)*.13,t*20+k*30,o*.85);}
  return s;
}

// the little bird flies down onto the snowman's head before verse 2
function birdPos(t){
  const [a,b]=BIRD_IN, u=eio(prog(t,a,b));
  const x=lerp(-60,SMX,u), y=lerp(150,316,u)-Math.sin(Math.PI*u)*60;
  return {x,y,fly:t<b};
}

function render(t){
  const p=t>START-.2&&t<END+.4?beatPulse(LINES,t):0;
  const L=lineAt(t), li=L?L.index:-1;
  const bye=t>END+.8&&t<DUR-1.2?Math.sin((t-END-.8)*5):0;
  let back='',chars='',pops='',cap='';

  // soft hearts behind everyone at the end
  if(t>END+1.9)for(let k=0;k<4;k++){const q=((t-END-1.9)*.35+k*.25)%1;
    back+=heart(440+k*160,330-q*110,1.5,'#FF8FB1',Math.sin(Math.PI*q)*.8);}

  // the snowman: sways a little with the music, waves goodbye at the end
  const arm=t>END+.8?.5+.5*bye:(li===0||li===2?.3*p:0);
  chars+=place(SMX,524,snowman({eye:blink(t,1.1),arm}),{s:.82});

  // verse 2: the bird flies down and sits on the snowman's head, bobbing with the beat
  if(t>BIRD_IN[0]){
    const b=birdPos(t);
    const wing=b.fly?40*Math.sin(t*18):(t>END+.8?25+25*bye:10*p);
    chars+=place(b.x,b.y-(b.fly?0:3*p),bird({eye:blink(t,.5),wing}),{s:.45});
  }

  // verse 3: Bunny hops in from the right
  if(t>BUN_IN[0]){
    const [a,b]=BUN_IN, u=prog(t,a,b), x=lerp(1400,BNX,eio(u));
    let y=520; if(t<b)y-=Math.abs(Math.sin((t-a)*Math.PI*2.2))*34; else if(t<END+.4)y-=5*p;
    chars+=shadow(x,524,50,520-y)+place(x,y,bunny({eye:blink(t,1.7),ear:li>=0?8*p:0}),{s:.8,flip:true});
  }

  // Lulu in her pink woolly hat sings along: flaps her wings with the beat
  {let y=520-(L?5*p:0), wing=t>END+.8?30+30*bye:(L?-26*p:0);
   chars+=shadow(DX,524,56,520-y)+place(DX,y,duck({eye:blink(t,2.9),wing})+woollyHat(42,-138,.62,'#FF5D8F'),{s:.82,flip:true});}

  // the lamb: bobs with the music, hops on "lamb", fluffs up on "snow"; at the end it snuggles to Mary
  const lx=lerp(LX0,MX+150,eio(prog(t,END+.4,END+1.6)));
  const h=lambHop(t);
  let fluff=0;SNOW.forEach(s0=>{const a=t-s0;if(a>0&&a<1.2)fluff=Math.sin(a*Math.PI*4)*(1-a/1.2);});
  const bob=(li===0||li===2)?5*p:0;
  chars+=shadow(lx,524,70,-h.y)+place(lx,520+h.y-bob,lamb({eye:blink(t,2.3),fluff,ear:li>=0?14*p:0}),{s:1,sx:h.sx,sy:h.sy,flip:true});

  // Mary in a red woolly hat: waves on "Mary had a little lamb", sways on the other lines
  let wave=0,sway=0,my=520;
  if(L){
    if(li===0||li===2)wave=.55+.45*Math.sin(Math.PI*2*prog(t,L.t0,L.t1)*2);
    else sway=5*Math.sin((t-L.t0)*3);
    my-=4*p;
  }
  if(t>END+.4)sway=-8*eio(prog(t,END+.6,END+1.6));
  const mHat=`<g transform="rotate(${sway} 0 -125)">`+woollyHat(0,-170,.66,'#E63946')+`</g>`;
  chars+=shadow(MX,524,54,520-my)+place(MX,my,mary({eye:blink(t,0),wave,sway})+mHat,{s:1});

  back+=fleeceFlakes(t,LX0);

  // "Baa!" from the lamb on "snow"
  SNOW.forEach(s0=>{const a=t-s0;if(a<0||a>4.1)return;
    const u=back_(prog(a,0,.35)), o=1-prog(a,3.7,4.1);
    pops+=`<g opacity="${o}" transform="translate(${LX0+30},285) scale(${u}) translate(${-(LX0+30)},-285)">`+speech(LX0+30,285,95,52,LX0+20,360,'Baa!',58,'#3FA9F5')+`</g>`;});

  // title card, then the words of the song, then goodbye
  const to=1-prog(t,3.9,4.5);
  if(to>0)pops+=`<g opacity="${to}">`+pop('Mary Had a',640,150,96,'#FF5D8F',t,.4,-2,'#fff')+pop('Little Lamb',640,262,104,'#3FA9F5',t,1.0,2,'#fff')+`</g>`;
  cap=t<END+.6?karaoke(LINES,t,'#3FA9F5'):caption('Bye-bye, little lamb!',t-END,.7);

  // verse 3: soft snow falls and the sun goes behind a soft winter haze
  const so=prog(t,VS[2]-5,VS[2]-2);
  const haze=so>0?`<rect width="1280" height="720" fill="#DCE8F5" opacity="${(.18*so).toFixed(3)}"/>`:'';
  const scenery=snowDrift(1250,548,.45);
  svg.innerHTML=bg(t,0,sun(t,1150,100),{noSun:true,noFlowers:true,noClouds:true})+snowHills(1,0)+scenery+back+chars+haze+snowfall(t,so)+pops+cap+fades(t,SC,DUR);
}
const back_=u=>u<=0?0:back(u);

function thumb(){
  let s=bg(0,0,sun(0,1150,100),{noSun:true,noFlowers:true,noClouds:true})+snowHills(1,0)+snowDrift(1250,548,.45);
  s+=place(SMX,524,snowman({arm:.8}),{s:.82})+place(SMX,316,bird({wing:20}),{s:.45});
  s+=shadow(MX+20,524,54,0)+place(MX+20,520,mary({wave:.9})+woollyHat(0,-170,.66,'#E63946'),{s:1.05});
  s+=shadow(LX0+30,524,70,0)+place(LX0+30,520,lamb({}),{s:1.1,flip:true});
  s+=shadow(850,524,56,0)+place(850,520,duck({wing:-30})+woollyHat(42,-138,.62,'#FF5D8F'),{s:.85,flip:true});
  s+=shadow(1060,524,50,0)+place(1060,520,bunny({}),{s:.8,flip:true});
  s+=snowfall(3,.9);
  s+=label('Mary Had a',640,108,100,'#FF5D8F',-3,'#fff')+label('Little Lamb',640,222,110,'#3FA9F5',-1,'#fff');
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
