<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 99 - Lulu and the Sleepy Hedgehog. Autumn leaves fall from the tree. The little leaf pile
   wiggles (rustle!) and a hedgehog peeks out (peek-a-boo!). Hello, little hedgehog! She is very sleepy
   (yawn) and winter is coming: she needs a cosy bed. Lulu can help! Whoosh, she sweeps leaves onto the
   pile: one, two, three. A big, cosy bed (ta-da!). The hedgehog curls up tight. Sleep well, see you in
   spring! The sun goes down; the hedgehog sleeps in her leaves and Lulu sleeps under the tree. */
const DUR=57, SC=[0,5,11,17,23,32,38,44,50,57];
const NAVY='#2D2A6E', PINK='#FF5D8F', PURPLE='#7B5CFF', ORANGE='#F27A12', TEAL='#19B8A6', GOLD='#FFE58A', BLUE='#1B7FD6', BROWN='#9C6A42', RED='#E63946';
const TX=170, TS=.8;                  // autumn tree on the left (canopy x 50..290, y 192..368)
const LX=390;                         // Lulu
const HX=610, HS=1.1;                 // hedgehog standing on the grass
const PX=800, PS=1.1;                 // leaf pile (bed)
const NEST=[PX,468];                  // where she curls up in the pile
const SCOOP=[3.0,4.4,5.8], FLY=1.2;   // scene 4: Lulu sweeps leaves at these times; they land FLY later
const S4=SC[4];

// ground leaves under the tree: 12 leaves, 4 fly away with each sweep
let k0=5;const rr=()=>(k0=(k0*16807)%2147483647)/2147483647;
const GL=[];for(let i=0;i<12;i++)GL.push([60+rr()*240,528+rr()*30,rr()*360,AUTUMN[i%3]]);
const sweepT=k=>S4+SCOOP[k];
const groundLeaves=t=>{let s='';GL.forEach((g,i)=>{const k=i%3, o=1-prog(t,sweepT(k),sweepT(k)+.25);if(o>0)s+=`<g opacity="${o.toFixed(2)}">${autumnLeaf(g[0],g[1],1.2,g[2],g[3])}</g>`;});return s;};
// pile size from the time
const pileU=t=>{let u=.45;for(let k=0;k<3;k++)u+=.183*eout(prog(t,sweepT(k)+FLY-.1,sweepT(k)+FLY+.4));return u;};
const pile=(t,w=0)=>`<g transform="rotate(${w.toFixed(2)} ${PX} 520)">${leafPile(PX,520,pileU(t),PS)}</g>`;
// flying leaves of each sweep, from the ground under the tree over to the pile
const flying=t=>{let s='';for(let k=0;k<3;k++){const q=prog(t,sweepT(k),sweepT(k)+FLY);if(q<=0||q>=1)continue;
  GL.forEach((g,i)=>{if(i%3!==k)return;const tx=PX-30+((i*37)%140), ty=465-((i*13)%35);
    const x=lerp(g[0],tx,q), y=lerp(g[1],ty,q)-300*4*q*(1-q);
    s+=autumnLeaf(x,y,1.3,g[2]+q*540,g[3]);});}
  return s;};
// leaves falling from the tree (u = how many, 0..1)
const falling=(t,u=1)=>{let s='';for(let i=0;i<6;i++){if(i/6>=u)break;const q=((t*.22+i*.31)%1.6)/1.6;
  const x=TX-110+i*44+18*Math.sin(t*2+i), y=lerp(330,525,q);s+=autumnLeaf(x,y,1.1,t*90+i*60,AUTUMN[i%3]);}return s;};
const hedge=(x,y,t,o={})=>(o.noShadow?'':shadow(x,y+2,58*(o.s||HS)))+place(x,y,hedgehog({eye:o.eye!=null?o.eye:blink(t,1.7),asleep:o.asleep,yawn:o.yawn,curled:o.curled}),{s:o.s||HS,flip:o.flip,sx:o.sx,sy:o.sy});
// curled up asleep in the pile, a few leaves tucked over her
const nested=(t,br=1)=>place(NEST[0],NEST[1],hedgehog({curled:true}),{s:1,sy:br})
  +autumnLeaf(PX-58,470,1.3,20,AUTUMN[0])+autumnLeaf(PX-20,480,1.4,-15,AUTUMN[2])+autumnLeaf(PX+30,478,1.3,190,AUTUMN[1])+autumnLeaf(PX+66,466,1.2,160,AUTUMN[0]);
const lulu=(lt,t,o={})=>{
  const x=o.x!=null?o.x:LX, j=jumps(lt,o.hops||[],.6,o.h||22), w=o.wave?20+20*Math.sin(lt*9):(o.wing!=null?o.wing:-20+6*Math.sin(lt*3));
  return shadow(x,522,58,-j.y)+place(x,520+j.y,duck({eye:o.eye!=null?o.eye:blink(t,0),wing:w,asleep:o.asleep}),{s:1,sx:j.sx,sy:j.sy*(o.sy||1),rot:o.rot||0,flip:o.flip});
};
const scenery=t=>autumnTree(TX,520,TS)+flower(1215,600,90,'#FFFFFF',t,1,.5)+flower(1150,615,90,'#B58CFF',t,3,.42);
const hearts=(lt,t0,x,y)=>{let s='';for(let k=0;k<4;k++){const q=lt-t0-k*.5;if(q>0&&q<2.4){const u=q/2.4;
  s+=heart(x+k*40+10*Math.sin(q*4+k),y-90*u,1,[PINK,'#FF9F1C',PURPLE][k%3],Math.sin(Math.PI*u));}}return s;};
const zzz=(lt,x,y,t0=2)=>{let s='';for(let k=0;k<3;k++){let q=lt-t0-k*.9;if(q>0){q%=2.7;
  s+=`<text x="${(x+q*24+8*Math.sin(q*3)).toFixed(1)}" y="${(y-q*30).toFixed(1)}" font-size="${(28+q*11).toFixed(1)}" fill="#fff" opacity="${(Math.sin(Math.PI*q/2.7)*.95).toFixed(2)}">z</text>`;}}return s;};
// peeking up from behind the pile: only the part above the ground shows
const peek=(u,t)=>{const y=520+110*(1-eout(clamp(u)));
  return `<defs><clipPath id="hpeek"><rect x="0" y="0" width="1280" height="521"/></clipPath></defs><g clip-path="url(#hpeek)">${hedge(PX,y,t,{flip:true,noShadow:true})}</g>`;};

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let n=0,props='',chars='',pops='',cap='',behind='',front='',noSun=false,noClouds=false,noMoon=false;
  switch(i){
  case 0:{
    // title
    props=scenery(t)+groundLeaves(t)+pile(t)+falling(t,.6);
    chars=lulu(lt,t,{hops:[2.6],h:16,wave:lt>1&&lt<2.4});
    pops=pop(`${LULU}<tspan fill="${NAVY}"> and the</tspan>`,670,115,72,PINK,lt,.4,-2)
        +pop(`<tspan fill="${BROWN}">Sleepy Hedgehog</tspan>`,670,198,80,BROWN,lt,.9,-2);
    break;}
  case 1:{
    // leaves fall down. the leaf pile wiggles: rustle!
    const w=lt>3.0&&lt<5.6?5*Math.sin(lt*16)*Math.sin(Math.PI*prog(lt,3.0,5.6)):0;
    props=scenery(t)+groundLeaves(t)+falling(t,1);
    props+=pile(t,w);
    chars=lulu(lt,t,{hops:[3.6],h:18,rot:lt>3.4?6:0});
    cap=lt<3.0?caption('The leaves fall down.',lt,.3):caption('The leaf pile wiggles!',lt,3.0);
    pops=pop('Rustle!',640,165,100,ORANGE,lt,3.1,-3);
    break;}
  case 2:{
    // peek-a-boo! a hedgehog. she walks out: hello, little hedgehog!
    const out=lt>2.6;
    props=scenery(t)+groundLeaves(t);
    let h;
    if(!out){h=peek(prog(lt,.5,1.4),t);props+=h+pile(t);h='';}
    else{const u=eio(prog(lt,2.6,4.2)), x=lerp(PX,HX,u), bob=lt<4.2?-6*Math.abs(Math.sin(lt*10)):0;
      props+=pile(t);h=hedge(x,520+bob,t,{flip:true});}
    chars=lulu(lt,t,{wave:lt>3.4&&lt<5.4,hops:[1.5],h:18})+h;
    cap=lt<3.0?caption('Who is that?',lt,.3):caption('Hello, little hedgehog!',lt,3.0);
    pops=pop('Peek-a-boo!',640,165,96,PINK,lt,.9,-3);
    break;}
  case 3:{
    // she is very sleepy (yawn). winter is coming.
    const yw=Math.sin(Math.PI*prog(lt,.6,2.4));
    props=scenery(t)+groundLeaves(t)+pile(t)+falling(t,.5);
    chars=lulu(lt,t,{rot:lt>3.2?-5:0})+hedge(HX,520,t,{flip:true,yawn:yw,eye:lt>.6&&lt<2.6?.4:undefined});
    cap=lt<3.0?caption('She is very sleepy.',lt,.3):caption('Winter is coming.',lt,3.0);
    pops=pop('Yawn!',640,165,100,PURPLE,lt,.8,-3);
    break;}
  case 4:{
    // she needs a cosy bed. Lulu can help! whoosh: one, two, three
    let hop=[];SCOOP.forEach(s=>hop.push(s-.05));
    const sweeping=lt>2.8&&lt<7.4;
    const wing=sweeping?(SCOOP.some(s=>lt>s-.2&&lt<s+.5)?40:-10):undefined;
    props=scenery(t)+groundLeaves(t)+pile(t);
    chars=lulu(lt,t,{flip:sweeping,wing,hops:hop,h:16})+hedge(HX,520,t,{flip:lt<2.8,sx:1});
    front=flying(t);
    cap=lt<3.0?caption('She needs a cosy bed.',lt,.3):caption('Lulu can help!',lt,3.0);
    pops=pop('One!',380,155,80,ORANGE,lt,SCOOP[0]+FLY,-3)+pop('Two!',640,155,80,RED,lt,SCOOP[1]+FLY,-3)+pop('Three!',900,155,80,'#E0A400',lt,SCOOP[2]+FLY,-3);
    break;}
  case 5:{
    // a big, cosy bed! she hops in and curls up tight
    const sp=Math.sin(Math.PI*prog(lt,.2,2.4));
    props=scenery(t)+groundLeaves(t)+pile(t)+sparkle(PX-120,380,1.4,sp)+sparkle(PX+130,370,1.2,sp)+sparkle(PX,330,1.5,sp);
    let h;
    if(lt<3.0){const q=eio(prog(lt,2.0,3.0)), x=lerp(HX,PX,q), y=lerp(520,NEST[1],q)-120*4*q*(1-q);
      h=hedge(x,y,t,{noShadow:lt>2.0});}
    else{const c=eout(prog(lt,3.0,3.4));
      h=nested(t,lerp(.9,1,c));}
    chars=lulu(lt,t,{hops:[.4],h:20})+h;
    cap=lt<3.0?caption('A big, cosy bed!',lt,.3):caption('She curls up tight.',lt,3.0);
    pops=pop('Ta-da!',640,165,100,ORANGE,lt,.4,-3);
    break;}
  case 6:{
    // sleep well, little hedgehog. see you in spring!
    const br=1+.025*Math.sin(lt*2.2);
    props=hearts(lt,3.2,PX-70,360)+scenery(t)+groundLeaves(t)+pile(t);
    chars=lulu(lt,t,{wave:lt>3.2&&lt<5.4})+nested(t,br);
    cap=lt<3.0?caption('Sleep well, little hedgehog.',lt,.3):caption('See you in spring!',lt,3.0);
    pops=pop('Shh...',640,165,96,TEAL,lt,.6,-3);
    break;}
  case 7:{
    // the sun goes down
    n=lerp(0,.45,eio(prog(lt,.3,5.4))); noSun=true; noMoon=true;
    behind=sun(t,1000,lerp(200,560,eio(prog(lt,.3,5.4))));
    props=scenery(t)+groundLeaves(t)+pile(t);
    chars=lulu(lt,t,{eye:lt>4.0?.5:undefined,wave:lt>2.8&&lt<4.0})+nested(t,1+.025*Math.sin(lt*2.2));
    cap=lt<3.0?caption('The sun goes down.',lt,.3):caption('Bye-bye, autumn day.',lt,3.0);
    pops=pop('Yawn!',600,165,96,PURPLE,lt,4.2,-3);
    break;}
  case 8:{
    // night: the hedgehog sleeps in her leaves, Lulu sleeps under the tree
    n=lerp(.45,1,eio(prog(lt,0,4))); noSun=true; noClouds=lt>0; noMoon=true;
    behind=moon(1050,lerp(330,120,eio(prog(lt,0,4))));
    const asleep=lt>1.2, br=1+.025*Math.sin(lt*2.2);
    props=scenery(t)+groundLeaves(t)+pile(t);
    chars=lulu(lt,t,{asleep,eye:.45,sy:br,rot:asleep?-3:0})+nested(t,br);
    pops=zzz(lt,LX+80,330,2.0);
    cap=caption('Good night, little hedgehog.',lt,.5);
    pops+=pop('The End',640,150,112,GOLD,lt,3.6,-3,NAVY);
    break;}
  }
  svg.innerHTML=bg(t,n,behind,{noSun,noFlowers:true,noMoon,noClouds})+props+chars+front+nightTint(n)+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=bg(0,0,'',{noFlowers:true,noSun:true})+autumnTree(TX,560,TS)+flower(1215,610,90,'#FFFFFF',0,1,.5);
  s+=leafPile(960,620,.8,1.2);
  GL.slice(0,8).forEach(g=>{s+=autumnLeaf(g[0],g[1]+50,1.3,g[2],g[3]);});
  s+=shadow(700,622,80)+place(700,620,hedgehog({}),{s:1.6,flip:true});
  s+=shadow(380,622,80)+place(380,620,duck({wing:25}),{s:1.4});
  s+=label(`${LULU}<tspan fill="${NAVY}"> and the</tspan>`,700,115,92,PINK,-2);
  s+=label(`<tspan fill="${BROWN}">Sleepy Hedgehog</tspan>`,700,225,100,BROWN,-2);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
