<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 103 - The Four Seasons with Lulu (learning, first words).
   Title, then one scene per season with the same tree: spring (flowers grow, blossom, a butterfly),
   summer (the sun, Lulu's sun hat, watermelon), autumn (leaves fall into a pile), winter (snow, bare tree,
   a snowman, Lulu's woolly hat). Lulu hops and reacts each time. Then the four seasons in order. */
const SC=[0,5,12,19,26,33,42], DUR=42;
const NAVY='#2D2A6E';
const NAME=['Spring','Summer','Autumn','Winter'];
const COL=['#FF5D8F','#E59A00','#E8742A','#3FA9F5'];
const PALE=['#FFE0EC','#FFF4C2','#FFE3C7','#6BBCF0'];
const CAP=['Flowers grow in spring.','Summer is warm and sunny.','Leaves fall in autumn.','It can snow in winter.'];
const SAY=['Pretty!','So warm!','Whee!','Brrr!'];
const TW=.4, TH=.6, TC=2.4, TB=3.6, TY=4.4;
const TX=960, TS=.85; // the tree

const sideClouds=t=>cloud(125+10*Math.sin(t*.3),96,.9,.95)+cloud(520+12*Math.sin(t*.25+1),70,.6,.9);

function lulu(x,lt,t,s,hopAt,extra=''){
  const j=jumps(lt,hopAt,.55,24), w=j.y<0?30*Math.abs(Math.sin(lt*10)):12+8*Math.sin(lt*3);
  return shadow(x,522,52*s/.9,-j.y)+place(x,520+j.y,duck({eye:blink(t,0),wing:w})+extra,{s,sx:j.sx,sy:j.sy});
}
function say(k,lt){
  if(lt<TY)return '';
  const x=450,y=300,g=back(prog(lt,TY,TY+.35)), w=SAY[k].length*17+50;
  return `<g transform="translate(${x},${y}) scale(${g}) translate(${-x},${-y})">${speech(x,y,w,62,330,420,SAY[k],54,COL[k])}</g>`;
}
const grow=(x,y,g,inner)=>g>0?`<g transform="translate(${x},${y}) scale(${g}) translate(${-x},${-y})">${inner}</g>`:'';

/* pink blossom dots on the spring tree (local tree coordinates) */
const BLOS=[[-95,-280],[-40,-370],[30,-340],[95,-270],[-10,-260],[70,-380],[-120,-230],[120,-235],[0,-330],[-70,-310],[50,-290]];
function blossom(u){
  let s='';BLOS.forEach(([a,b],i)=>{const g=back(clamp(u*1.6-i*.06));if(g<=0)return;
    s+=`<g transform="translate(${TX+a*TS},${520+b*TS}) scale(${g})"><circle r="13" fill="#FFB3CF"/><circle r="5" fill="#FFF0F5"/></g>`;});
  return s;
}
/* falling autumn leaves: start near the canopy, sway down, rest on the ground */
const FALL=[[880,.9,0],[1040,1.3,1],[930,1.7,2],[1080,2.1,0],[850,2.5,1],[990,2.9,2],[910,3.3,0],[1060,3.7,1],[960,4.1,2],[870,4.5,0],[1020,4.9,1],[940,5.3,2]];
function leaves(lt){
  let s='';FALL.forEach(([x,t0,c],i)=>{if(lt<t0)return;const u=clamp((lt-t0)/2.2);
    const lx=x-60*u+26*Math.sin((lt-t0)*3+i), ly=lerp(300,512,u), rot=u<1?40*Math.sin((lt-t0)*3.4+i):(i*47)%180;
    s+=autumnLeaf(lx,ly,1.1,rot,AUTUMN[c]);});
  return s;
}
/* falling snow, fixed positions */
const FLAKES=[];(function(){let k=103;const r=()=>(k=(k*16807)%2147483647)/2147483647;for(let i=0;i<30;i++)FLAKES.push([r()*1280,r(),.6+r()*.6,r()*6.28]);})();
function snowfall(lt,u){
  if(u<=0)return '';let s='';
  FLAKES.forEach(([x,ph,sz,w])=>{const y=((ph*640+lt*70)%640)-30;
    s+=snowflake(x+18*Math.sin(lt*1.2+w),y,sz,lt*30+w*50,u*(y>540?clamp((600-y)/60):1));});
  return s;
}

function seasonScene(k,lt,t){
  const g=back(prog(lt,TH,TH+.5));
  let s='',extra='';
  if(k===0){ // spring
    s+=tree(TX,520,TS)+blossom(prog(lt,1.0,2.6));
    const F=[[620,110,'#FF7FB0'],[720,140,'#FFFFFF'],[820,100,'#B58CFF']];
    F.forEach(([x,h,c],i)=>{const u=prog(lt,TH+i*.3,TH+i*.3+1.4);
      s+=growFlower(x,520,h*clamp(u*1.6),clamp(u*2-1),c,t,{face:true});});
    if(lt>2.0){const a=eio(prog(lt,2.0,3.4)), fx=lerp(1340,760,a)+30*Math.sin(lt*1.4), fy=lerp(240,300,a)+14*Math.sin(lt*2.6);
      s+=place(fx,fy,bigButterfly({eye:blink(t,1.2),flap:.5+.5*Math.sin(lt*14)}),{s:.4});}
  }else if(k===1){ // summer
    s+=tree(TX,520,TS);
    s+=grow(1170,105,back(prog(lt,TH,TH+.6)),sun(t,1170,105));
    s+=grow(680,520,back(prog(lt,1.4,1.9)),watermelon(680,520,.75));
    const hy=lt<1.8?-800:lerp(-800,0,eout(prog(lt,1.8,2.4)));
    extra=`<g transform="translate(0,${hy})">${hat(42,-142,.72)}</g>`;
  }else if(k===2){ // autumn
    s+=autumnTree(TX,520,TS)+leafPile(TX,522,prog(lt,1.6,5.4),.8)+leaves(lt);
  }else{ // winter
    const sn=prog(lt,.3,2.0);
    s+=snowHills(sn)+winterTree(TX,520,TS,sn);
    s+=grow(700,520,back(prog(lt,1.6,2.1)),place(700,520,snowman({eye:blink(t,.5),arm:lt>TY?.5+.5*Math.sin(lt*6):0}),{s:.75}));
    const hy=lt<2.0?-800:lerp(-800,0,eout(prog(lt,2.0,2.6)));
    extra=`<g transform="translate(0,${hy})">${woollyHat(42,-138,.62,'#FF5D8F')}</g>`;
    s+=snowfall(lt,prog(lt,0,.8));
  }
  return [s,extra];
}

/* round season badge with an icon: flower, sun, leaf, snowflake */
function badge(k,x,y,r,t){
  let ic='';
  if(k===0){for(let p=0;p<6;p++){const a=p*Math.PI/3+.26;ic+=`<circle cx="${(Math.cos(a)*30).toFixed(1)}" cy="${(Math.sin(a)*30).toFixed(1)}" r="24" fill="#FF7FB0"/>`;}
    ic+=`<circle r="20" fill="#FFB703"/><circle cx="-7" cy="-4" r="3.5" fill="#7a4b00"/><circle cx="7" cy="-4" r="3.5" fill="#7a4b00"/><path d="M-7,6 Q0,12 7,6" stroke="#7a4b00" stroke-width="3" fill="none" stroke-linecap="round"/>`;}
  else if(k===1)ic=`<g transform="scale(.8)">${sun(t,0,0)}</g>`;
  else if(k===2)ic=autumnLeaf(6,0,2.8,-25,'#E8742A');
  else ic=snowflake(0,0,3.6,t*15);
  const sc=r/95;
  return `<g transform="translate(${x},${y}) scale(${sc})"><circle r="100" fill="#fff"/><circle r="90" fill="${PALE[k]}"/>${ic}</g>`;
}
const arrow=(x,y,op)=>`<path d="M${x-22},${y} L${x+14},${y} M${x+2},${y-14} L${x+16},${y} L${x+2},${y+14}" stroke="${NAVY}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let chars='',pops='',cap='',talk='',props='';
  const o={noSun:true,noClouds:true,noFlowers:true};
  if(i===0){
    const X=[150,300,980,1130];
    for(let k=0;k<4;k++){const t0=1.0+k*.4, g=lt>t0?back(prog(lt,t0,t0+.35)):0;if(g<=0)continue;
      const j=jumps(lt,[3.0+k*.3],.5,14);
      props+=`<g transform="translate(0,${j.y})">${grow(X[k],400,g,badge(k,X[k],400,62,t))}</g>`;}
    chars+=lulu(640,lt,t,1.15,[1.4,2.4,3.4]);
    pops=pop('Four Seasons',640,132,104,NAVY,lt,.3)+pop('with '+LULU,640,236,84,NAVY,lt,.7,-2);
  }else if(i<=4){
    const k=i-1, [s,extra]=seasonScene(k,lt,t);
    props=s;
    chars+=lulu(250,lt,t,.95,[TB+.15,TY],extra);
    talk=say(k,lt);
    pops=pop(NAME[k],640,160,124,COL[k],lt,TW);
    cap=caption(CAP[k],lt,TC);
  }else{
    const X=[190,490,790,1090];
    for(let k=0;k<4;k++){
      const t0=.5+k*.6, g=lt>t0?back(prog(lt,t0,t0+.35)):0;
      if(g<=0)continue;
      const j=jumps(lt,[3.2+k*.45,6.4+(k===0?0:9)],.5,18);
      props+=`<g transform="translate(0,${j.y})">${grow(X[k],330,g,badge(k,X[k],330,95,t))}</g>`;
      pops+=pop(NAME[k],X[k],490,52,COL[k],lt,t0+.2);
      if(k<3)props+=arrow(X[k]+150,330,clamp((lt-t0-.3)*3));
    }
    pops+=pop('The four seasons!',640,150,92,NAVY,lt,.2);
    cap=lt<5.8?caption('Spring, summer, autumn, winter!',lt,2.8):caption('Then spring comes again!',lt,5.8);
  }
  svg.innerHTML=bg(t,0,'',o)+sideClouds(t)+props+chars+talk+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=bg(0,0,'',{noSun:true,noClouds:true,noFlowers:true})+cloud(130,110,1.2,.95);
  s+=badge(0,820,470,78,0)+badge(1,1000,420,78,0)+badge(2,1170,470,78,0)+badge(3,1000,600,70,0);
  s+=shadow(330,662,90)+place(330,658,duck({wing:22})+hat(42,-142,.72),{s:1.25});
  s+=label('Four Seasons',640,190,118,'#3E9E3E',-3);
  s+=label('with '+LULU,640,305,84,NAVY,-2);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
