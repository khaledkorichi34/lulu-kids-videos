<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 104 - Who am I? A prickly riddle.  Title, three clues (I have lots of spines on my back;
   I have a little pointy nose; I like to hide in piles of leaves (spines peek over the leaf pile)),
   "Who am I?", the reveal (the leaves fly up: a hedgehog!), fact 1 (hedgehogs can roll up into a ball,
   the spines keep them safe), fact 2 (hedgehogs look for food at night, they sniff for worms and bugs),
   fact 3 (many hedgehogs sleep through winter: hibernation), goodbye. */
const SC=[0,5.5,12,18.5,25,30.5,37.5,45,52.5,60,66], DUR=66;
const NAVY='#2D2A6E', PURPLE='#7B5CFF', ORANGE='#E76F2E', BROWN='#8A5A2B', GREEN='#2E9E48', PINK='#FF5D8F', BLUE='#2F8FE0';
const BX=820, BY=528, BS=1.2;                       // leaf pile centre and scale (spans x 640..1000, top 403)
const lulu=(x,lt,t,hops,h=20,s=.95,wave=false,extra='')=>{
  const j=jumps(lt,hops,.6,h), w=wave?20+20*Math.sin(lt*9):0;
  return shadow(x,522,56*s/.95,-j.y)+place(x,520+j.y,duck({eye:blink(t,0),wing:w})+extra,{s,sx:j.sx,sy:j.sy});
};
const H=(t,o={})=>hedgehog(Object.assign({eye:blink(t,.7)},o));
const qmark=(t,x=BX,y=315)=>label('?',x,y+4*Math.sin(t*3),110,'#fff',0,BROWN,.12);
const grow=(lt,t0)=>lt>t0?back(prog(lt,t0,t0+.4)):0;
function grass(x,y,s=1){
  let g='';[-24,-12,0,12,24].forEach((d,k)=>{const h=34+(k%2)*14;g+=`<path d="M${d-6},0 Q${d},${-h} ${d+3+k%3*3},${-h-6} Q${d+2},${-h*.5} ${d+6},0 Z" fill="${k%2?'#4CB85A':'#3FA34D'}"/>`;});
  return `<g transform="translate(${x},${y}) scale(${s})">${g}</g>`;
}
function scene(t){ return grass(560,528,1)+grass(1160,540,1.1)+grass(110,548,.9)+autumnLeaf(500,535,1,20,AUTUMN[0])+autumnLeaf(1080,545,1,-30,AUTUMN[2]); }
// a hedgehog hiding behind the leaf pile; u = 0 hidden, 1 the spines peek over the top
function pileWithPeek(t,u,wig=0){
  let s='';
  if(u>0)s+=place(BX-20,lerp(BY+40,BY-62,u),H(t),{s:1.1,rot:wig});
  return s+leafPile(BX,BY,1,BS);
}
function icon(x,y,g,inner){
  if(g<=0)return '';
  return `<g transform="translate(${x},${y}) scale(${g})"><defs><clipPath id="ic"><circle r="88"/></clipPath></defs>
  <circle r="92" fill="#fff" stroke="#FFD23F" stroke-width="7"/><g clip-path="url(#ic)">${inner}</g></g>`;
}
function spineIcon(t){
  return `<rect x="-100" y="-100" width="200" height="200" fill="#FFF1D6"/>
  <g transform="translate(18,72) scale(1.45)"><path d="${HEDGE_SPINES.back}" fill="#7A4E2D" stroke="#7A4E2D" stroke-width="7" stroke-linejoin="round"/>
  <ellipse cx="-12" cy="-44" rx="60" ry="40" fill="#9C6A42"/><circle cx="-40" cy="-62" r="9" fill="#B07C50" opacity=".7"/><circle cx="-6" cy="-72" r="7" fill="#B07C50" opacity=".7"/></g>`;
}
function noseIcon(t){
  const w=3*Math.sin(t*8);
  return `<rect x="-100" y="-100" width="200" height="200" fill="#E6F8D8"/>
  <g transform="translate(-62,${62+w}) scale(1.45)"><path d="M10,-74 Q52,-74 70,-42 Q82,-34 84,-28 Q70,-12 40,-12 Q14,-12 8,-34 Z" fill="#F3D6A8"/>
  <circle cx="84" cy="-31" r="8" fill="#3a2a1a"/><circle cx="86" cy="-34" r="2.4" fill="#fff" opacity=".7"/></g>`;
}
function leafIcon(t){
  return `<rect x="-100" y="-100" width="200" height="200" fill="#FFF4E0"/>
  ${autumnLeaf(-30,-30,2.2,-20,AUTUMN[0])}${autumnLeaf(35,0,2.2,25,AUTUMN[1])}${autumnLeaf(-15,45,2.2,160,AUTUMN[2])}`;
}
function sparkles(x,y,lt,t0){
  const u=prog(lt,t0,t0+1.2);if(u<=0||u>=1)return '';
  let s='';for(let k=0;k<6;k++){const a=k*Math.PI/3+.4, d=40+u*110;s+=sparkle(x+Math.cos(a)*d,y+Math.sin(a)*d*.7,1.3,1-u);}
  return s;
}
// leaves flying up out of the pile and drifting down
function leafBurst(x,y,lt,t0){
  const u=lt-t0;if(u<=0||u>3)return '';
  let s='';for(let k=0;k<12;k++){const a=-Math.PI*(.1+.8*k/11), sp=180+60*(k%3);
    const lx=x+Math.cos(a)*sp*Math.min(u,1.2)+10*Math.sin(u*3+k), ly=y+Math.sin(a)*sp*Math.min(u,.8)*1.2+80*Math.max(0,u-.8)*u;
    s+=autumnLeaf(lx,Math.min(ly,525),1.3,u*200+k*40,AUTUMN[k%3]);}
  return s;
}
function worm(x,y,u,t){ // little pink worm peeking out of a hole in the ground, u = 0..1 how far out
  if(u<=0)return `<ellipse cx="${x}" cy="${y}" rx="20" ry="6" fill="#3a2614"/>`;
  const h=50*u, w=8*Math.sin(t*5);
  return `<ellipse cx="${x}" cy="${y}" rx="20" ry="6" fill="#3a2614"/>
  <path d="M${x},${y} Q${x+w},${y-h*.5} ${x-w*.6},${y-h}" stroke="#F49AA8" stroke-width="15" fill="none" stroke-linecap="round"/>
  <circle cx="${x-w*.6+2}" cy="${y-h-1}" r="2.6" fill="#3a2a1a"/>`;
}
function zzz(x,y,lt){
  let s='';for(let k=0;k<3;k++){const q=(lt*.4+k/3)%1;s+=label('z',x+q*60,y-q*90,26+q*22,'#fff',-10,PURPLE,.12).replace('<g','<g opacity="'+(1-q)+'"');}
  return s;
}

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let back_='',props='',chars='',tint='',pops='',cap='';
  const o={noFlowers:true,noSun:true,noClouds:true};
  back_=bg(t,0,cloud(130+8*Math.sin(t*.3),90,.75,.95),o);
  if(i===0){
    const peek=eio(prog(lt,2.2,2.8))-eio(prog(lt,4.2,4.8));
    props=scene(t)+pileWithPeek(t,peek,3*Math.sin(lt*6))+qmark(t);
    chars=lulu(280,lt,t,[1.3,2.3],30,1.1,true);
    pops=pop('Who am I?',640,165,120,PURPLE,lt,.3,-3);
    cap=caption('A new riddle with '+LULU,lt,1.8,'A new riddle with Lulu');
  }else if(i>=1&&i<=3){
    const N=i;
    let u=0,wig=0;
    if(N===3){u=eio(prog(lt,2.4,3.2))-eio(prog(lt,5.4,6.0));wig=3*Math.sin(lt*6);}
    props=scene(t)+pileWithPeek(t,u,wig)+qmark(t);
    if(N===1)props+=icon(1110,300,grow(lt,2.4),spineIcon(t));
    if(N===2)props+=icon(1110,300,grow(lt,2.4),noseIcon(t));
    if(N===3)props+=icon(1110,300,grow(lt,2.4),leafIcon(t));
    chars=lulu(250,lt,t,[3.2]);
    pops=pop('Clue '+N,560,150,100,ORANGE,lt,.3);
    cap=caption(['','I have lots of spines on my back.','I have a little pointy nose.','I like to hide in piles of leaves.'][N],lt,1.2);
  }else if(i===4){
    props=scene(t)+pileWithPeek(t,0)+qmark(t);
    chars=lulu(250,lt,t,[]);
    pops=pop('spines',380,165,60,BROWN,lt,.3)+pop('nose',640,165,60,PINK,lt,.9)+pop('leaves',900,165,60,ORANGE,lt,1.5);
    cap=caption('Who am I? Can you guess?',lt,2.2);
  }else if(i===5){
    // the leaves fly up and the hedgehog is there; then it trots to the right
    const pu=1-eio(prog(lt,.4,1.0)), x=lerp(BX,980,eio(prog(lt,4.4,5.6)));
    props=scene(t)+leafPile(BX,BY,pu,BS);
    props+=shadow(x,522,95)+place(x,520-2*Math.abs(Math.sin((lt>4.4&&lt<5.6)?lt*12:0)),H(t),{s:1.35});
    props+=leafBurst(BX,440,lt,.4)+sparkles(x+20,430,lt,1.0);
    chars=lulu(250,lt,t,[2.0,2.7],30,.95,lt>1.6);
    pops=pop('A hedgehog!',600,165,105,BROWN,lt,1.2,-3);
    cap=caption('I am a hedgehog!',lt,1.6);
  }else if(i===6){
    // fact 1: it rolls up into a ball, a leaf lands on the spines, then it opens again
    const c=prog(lt,2.0,2.4)-prog(lt,6.0,6.4), X=700;
    props=scene(t);
    props+=shadow(X,522,95*(1-.25*c));
    if(c<1)props+=`<g opacity="${1-c}">${place(X,520,H(t),{s:1.35,sx:1-.3*c,sy:1-.2*c})}</g>`;
    if(c>0)props+=`<g opacity="${c}">${place(X,520,H(t,{curled:true}),{s:1.45*(.75+.25*c)})}</g>`;
    const lf=prog(lt,3.0,4.6);
    if(lf>0&&lt<6.0)props+=autumnLeaf(lerp(620,680,lf)+14*Math.sin(lf*7)*(1-lf),lerp(230,372,eio(lf)),1.3,30+40*Math.sin(lf*6),AUTUMN[0]);
    chars=lulu(300,lt,t,[]);
    pops=pop('Fact 1',420,150,100,'#fff',lt,.3,0,ORANGE)+(lt>2.2?pop('Roll up!',960,170,80,PURPLE,lt,2.2,-3):'');
    cap=lt<4.0?caption('Hedgehogs can roll up into a ball.',lt,.9):caption('The spines keep them safe.',lt,4.0);
  }else if(i===7){
    // fact 2: night time, the hedgehog trots out and sniffs; a worm peeks out of the ground
    back_=bg(t,1,'',{noFlowers:true,noClouds:true});
    const x=lerp(180,700,eio(prog(lt,.3,3.0))), trot=lt>.3&&lt<3.0, sn=lt>3.2?Math.sin(lt*16)*3:0;
    props=grass(560,528,1)+grass(1160,540,1.1)+worm(900,528,eout(prog(lt,3.8,4.6)),t);
    chars=shadow(x,522,95)+place(x,520-(trot?3*Math.abs(Math.sin(lt*12)):0),H(t),{s:1.35,rot:sn});
    tint=nightTint(.6);
    pops=pop('Fact 2',420,150,100,'#fff',lt,.3,0,ORANGE)+(lt>4.4?pop('Sniff, sniff!',700,300,64,'#FFD23F',lt,4.4,-3,NAVY):'');
    cap=lt<4.0?caption('Hedgehogs look for food at night.',lt,.9):caption('They sniff for worms and bugs.',lt,4.0);
  }else if(i===8){
    // fact 3: snowy winter, the hedgehog sleeps curled up in its leaf nest; Lulu whispers "Shh!"
    props=snowHills(1,0)+leafPile(760,528,1,1.3);
    props+=place(770,512,H(t,{curled:true}),{s:1.2});
    for(let k=0;k<14;k++){const fx=(k*97+40)%1280, fy=((lt*45+k*61)%560)+10;
      if(!(fx>300&&fx<980&&fy>90&&fy<230)&&!(fx>230&&fx<430&&fy>330&&fy<540))props+=snowflake(fx+12*Math.sin(lt+k),fy,.8,lt*30+k*20,.9);}
    props+=zzz(830,390,lt);
    chars=lulu(330,lt,t,[],20,.95,false,woollyHat(42,-138,.62));
    pops=pop('Fact 3',640,150,100,'#fff',lt,.3,0,ORANGE)+(lt>4.4?pop('Shh!',480,320,70,BLUE,lt,4.4,-4):'');
    cap=lt<4.0?caption('Many hedgehogs sleep through winter.',lt,.9):caption('It is called hibernation.',lt,4.0);
  }else{
    props=heart(640,330+6*Math.sin(t*3),1.4,'#FF7FB0',.85*prog(lt,2,2.5))+heart(600,275+6*Math.sin(t*3+1),1,'#FF9AA2',.85*prog(lt,2.3,2.8));
    props+=scene(t)+leafPile(1060,528,1,.9);
    const hx=lerp(820,880,eio(prog(lt,3.6,4.6)));
    props+=shadow(hx,522,85)+place(hx,520-(lt>3.6&&lt<4.6?3*Math.abs(Math.sin(lt*12)):0),H(t),{s:1.2});
    chars=lulu(400,lt,t,[1.0,1.8],26,.95,true);
    pops=pop('Bye bye!',560,160,110,PURPLE,lt,.4,-2);
    cap=caption('Bye bye, little hedgehog!',lt,1.6);
  }
  svg.innerHTML=back_+props+chars+tint+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=`<defs>${skyGrad('g','#4DB9FF','#DDF5FF')}${CLIP}</defs><rect width="1280" height="720" fill="url(#g)"/>`;
  s+=cloud(140,110,1.1,.95);
  s+=`<path d="M0,500 Q300,410 640,480 T1280,470 L1280,720 L0,720Z" fill="#9ADB6F"/>`;
  s+=`<path d="M0,580 Q380,510 760,565 T1280,550 L1280,720 L0,720Z" fill="#6CC24A"/>`;
  s+=place(960,640,hedgehog({}),{s:1.6,rot:-4})+leafPile(980,690,1,1.7);
  s+=grass(700,670,1.3)+grass(1230,660,1.2);
  s+=label('?',1150,400,170,'#fff',0,BROWN,.12);
  s+=shadow(165,702,85)+place(160,698,duck({wing:22}),{s:1.25});
  s+=label('Who',560,190,150,'#FF5D8F',-3)+label('am I?',580,350,150,PURPLE,-3);
  s+=label('A new riddle with '+LULU,560,440,60,NAVY);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
