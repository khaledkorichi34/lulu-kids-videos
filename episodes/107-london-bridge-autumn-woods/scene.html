<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script src="../../toolkit/rhymes.js"></script>
<script>
/* Episode 107 - London Bridge Is Falling Down in the autumn woods (sing-along). Lulu builds a little bridge
   of wooden blocks between two autumn trees, with a small pile of leaves under it. On "my fair lady" the
   top blocks tumble softly onto the grass, and they hop back up again in the gap. Verse 2: Squirrel scampers
   in. Verse 3: autumn leaves drift down, evening comes and Hedgehog joins. Ending: built again, hooray! */
const BPM=112, START=5.0;
const LINES=rhymeTimes(RHYMES.london,START,3,4,BPM);
const END=rhymeEnd(LINES);
const DUR=66, SC=[0,DUR];
const SPB=60/BPM;
const V2=LINES[4].t0, V3=LINES[8].t0;

const WOOD=['#D9954A','#C67C3E','#E2A95B','#B8713A'];
const PX=[526,754];
const PIL=[];PX.forEach((x,i)=>{for(let r=0;r<3;r++)PIL.push([x,520-42*r,WOOD[(r+i)%2]]);});
const TOPY=394, TOP=[526,602,678,754], TOPC=[WOOD[2],WOOD[0],WOOD[3],WOOD[2]];
const LAND=[[425,-12],[640,8],[838,-10],[910,14]];
const FALL=[3,7,11].map(i=>LINES[i].words[3].t0);
const BUILD=[FALL[0]+1.6,FALL[1]+1.6,END+.3];

function topBlock(t,k){
  const x0=TOP[k], y0=TOPY, [x1,r1]=LAND[k];
  let x=x0,y=y0,r=0;
  for(let v=0;v<3;v++){
    const tf=FALL[v]+k*.08, tb=BUILD[v]+k*.3;
    if(t>=tf&&t<tb){
      const u=prog(t,tf,tf+.55);
      x=lerp(x0,x1,eout(u)); y=lerp(y0,520,u*u)-30*Math.sin(Math.PI*u); r=r1*u;
      const q=t-(tf+.55); if(q>0)y-=12*Math.abs(Math.sin(q*9))*Math.exp(-q*6);
    }else if(t>=tb&&t<tb+.5){
      const u=eio(prog(t,tb,tb+.5));
      x=lerp(x1,x0,u); y=lerp(520,y0,u)-60*Math.sin(Math.PI*u); r=r1*(1-u);
    }
  }
  return woodBlock(x.toFixed(1),y.toFixed(1),r,1,TOPC[k]);
}
// autumn leaves drifting down in verse 3 and the ending (faint where the big words sit)
function leaffall(t,o){
  if(o<=0)return '';let s='';
  for(let k=0;k<12;k++){const sp=30+(k%4)*8, y=((k*97+t*sp)%540)-30, x=(k*163+60)%1280+26*Math.sin(t*.9+k);
    const near=y>70&&y<250&&x>250&&x<1030?.2:1;
    s+=`<g opacity="${(o*near).toFixed(2)}">`+autumnLeaf(x.toFixed(1),y.toFixed(1),.6+(k%3)*.12,(t*40+k*50)%360,AUTUMN[k%3])+'</g>';}
  return s;
}
const GROUND_LEAVES=[[60,640,'#E63946',20],[210,690,'#F6C026',-30],[400,600,'#F28C28',60],[560,676,'#F6C026',10],[700,640,'#E63946',-50],[880,690,'#F28C28',35],[1010,610,'#F6C026',-15],[1230,660,'#E63946',45]];
const ground=n=>`<path d="M0,440 Q300,330 640,410 T1280,400 L1280,720 L0,720Z" fill="${mix('#B9D96B','#4F6B4A',n)}"/>`+autumnTree(95,468,.72)+autumnTree(1200,472,.6)+`<path d="M0,500 Q380,440 760,490 T1280,470 L1280,720 L0,720Z" fill="${mix('#8CC152','#3B5A3E',n)}"/>`+GROUND_LEAVES.map(([x,y,c,r])=>autumnLeaf(x,y,.8,r,c)).join('');

function render(t){
  const n=t<V3-2.2?0:lerp(0,.45,eio(prog(t,V3-2.2,V3)));
  const p=t<END+.5?beatPulse(LINES,t):0;
  const sway=t>START-.5&&t<END+.4?Math.sin(2*Math.PI*(t-START)/(2*SPB)):0;
  let props='',chars='',pops='',cap='';

  const standing=!FALL.some((f,v)=>t>=f&&t<BUILD[v]+1.4);
  const wob=standing?1.4*sway:0;
  let br='';
  PIL.forEach(([x,y,c])=>br+=woodBlock(x,y,0,1,c));
  props+=leafPile(640,526,1,.42)+shadow(526,524,74)+shadow(754,524,74)+`<g transform="rotate(${wob.toFixed(2)} 640 520)">${br}`;
  for(let k=0;k<4;k++)props+=topBlock(t,k);
  props+='</g>';

  const hop=v=>{const q=t-FALL[v];return q>0&&q<.6?40*Math.sin(Math.PI*q/.6):0;};
  const h=hop(0)+hop(1)+hop(2);
  const cheer=t>END+2.0?Math.abs(Math.sin((t-END-2.0)*4.5))*24*(1-prog(t,DUR-2.6,DUR-1.6)):0;
  // Lulu on the left
  chars+=shadow(290,522,62)+place(290,520-7*p-h-cheer,duck({eye:blink(t,0),wing:14+12*sway}),{s:.95,rot:4*sway});
  // verse 2: Squirrel scampers in from the right and faces Lulu
  const g2=t>V2-2.4?prog(t,V2-2.4,V2-.6):0;
  if(g2>0){
    const x=lerp(1360,1010,eout(g2)), st=g2<1?t*16:0;
    chars+=shadow(x,522,52)+place(x,520-6*p-h*.8-cheer,squirrel({eye:blink(t,.8),tail:sway*.8,step:st}),{s:.82,flip:true,rot:-3*sway});
  }
  // verse 3: Hedgehog trots in on the left
  const g3=t>V3-2.4?prog(t,V3-2.4,V3-.8):0;
  if(g3>0){
    const x=lerp(-90,135,eout(g3));
    chars+=shadow(x,522,50)+place(x,520-5*p-h*.7-cheer,hedgehog({eye:blink(t,2.3)}),{s:.8,rot:-3*sway});
  }

  BUILD.forEach(b=>{const q=t-(b+1.5);if(q>0&&q<1.2){const o=1-q/1.2;
    pops+=sparkle(480,330-30*q,1.1,o)+sparkle(800,320-30*q,1,o)+sparkle(640,290-30*q,.8,o);}});

  const to=1-prog(t,3.7,4.3);
  if(to>0)pops+=`<g opacity="${to}">`+pop('London Bridge',640,150,92,'#FF5D8F',t,.4,-2,'#fff')+pop('Is Falling Down',640,262,78,'#7B5CFF',t,1.0,2,'#fff')+`</g>`;
  [0,1].forEach(v=>{const a=FALL[v]+1.2,o=1-prog(t,a+2.6,a+3.0);if(t>a&&o>0)pops+=`<g opacity="${o}">`+pop('Build it up!',640,165,84,'#19B8A6',t-a,0,-2)+`</g>`;});
  cap=t<END+1.2?karaoke(LINES,t,'#F28C28'):caption('We built it again!',t-END,2.0);
  if(t>END+2.2)pops+=pop('Hooray!',640,165,96,'#FF9F1C',t-END,2.2,-3);

  const lf=prog(t,V3-2.2,V3);
  const so=1-clamp(n/.25);
  const sky=(so>0?`<g opacity="${so.toFixed(2)}">`+sun(t,1150,100)+'</g>':'')+(n>.2?`<g opacity="${clamp((n-.2)/.2).toFixed(2)}">`+moon(1150,110)+'</g>':'')+cloud(190+12*Math.sin(t*.3),90,.85,1-n*.75);
  svg.innerHTML=bg(t,n,sky,{noFlowers:true,noClouds:true,noSun:true,noMoon:true})+ground(n)+leaffall(t,lf)+props+chars+nightTint(n)+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=bg(0,0,cloud(95,60,.6,1),{noFlowers:true,noClouds:true,noSun:true})+ground(0);
  [[1230,40,0],[560,370,1],[1000,380,2],[40,360,0]].forEach(([x,y,c],k)=>s+=autumnLeaf(x,y,.9,k*70,AUTUMN[c]));
  let br='';PIL.forEach(([x,y,c])=>br+=woodBlock(x,y,0,1,c));TOP.forEach((x,k)=>br+=woodBlock(x,TOPY,0,1,TOPC[k]));
  s+=shadow(720,664,96)+shadow(965,664,96)+`<g transform="translate(840,660) scale(1.3) translate(-640,-520)">${leafPile(640,526,1,.42)}${br}</g>`;
  s+=shadow(1150,664,70)+place(1150,660,squirrel({tail:.4}),{s:1.05,flip:true});
  s+=shadow(250,662,140)+place(240,658,duck({wing:20}),{s:1.9});
  s+=label('London Bridge',640,180,118,'#FF5D8F',-3)+label('in the Autumn Woods',760,292,76,'#7B5CFF',-2);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
