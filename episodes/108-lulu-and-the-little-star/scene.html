<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 108 - Lulu and the Little Star. The sun goes down and the stars come out. One little star
   wobbles and falls down into the grass (plink!). Hello, little star! Please help me go home!
   Lulu hops up high, but the sky is too high. Hoo! Hoo! Owl wakes up: I can help! Owl carries the
   little star up, up, up, back to the sky. The little star is home: thank you, Lulu and Owl!
   Lulu falls asleep while Owl keeps watch and the little star shines over her. Good night. */
const DUR=58, SC=[0,5,11,17,24,31,38,45,51,58];
const NAVY='#2D2A6E', PINK='#FF5D8F', PURPLE='#7B5CFF', GOLD='#FFE58A', ORANGE='#FF9F1C', TEAL='#19B8A6', YEL='#FFD93B';
const LX=560, GX=820, GY=484, HX=960, HY=280, SR=40;   // Lulu, the star on the grass, the star's home in the sky
const TX=190, OX=370, OY=316, OS=.8, LAND=1060;          // tree, owl on its branch, where Owl lands
const scenery=()=>tree(TX,520,1)+branch(TX+10,334,OX+40,OY+2);
const flap=(lt,k=14)=>30+30*Math.sin(lt*k);
const lulu=(lt,t,o={})=>{
  const j=jumps(lt,o.hops||[],.6,o.h||18), w=o.wave?20+20*Math.sin(lt*9):0;
  return shadow(LX,522,60,-j.y)+place(LX,520+j.y,duck({eye:o.eye!=null?o.eye:blink(t,0),wing:w,asleep:o.asleep}),{s:1,sx:j.sx,sy:j.sy*(o.sy||1)});
};
const owlAt=(x,y,o={})=>place(x,y,owl(o),{s:OS});
// the little star with a soft glow (drawn after nightTint so it shines)
function star(x,y,t,o={}){
  const g=o.glow==null?1:o.glow, p=.5+.5*Math.sin(t*3);
  return `<circle cx="${x}" cy="${y}" r="${SR*1.9+6*p}" fill="#FFF3B8" opacity="${(.16*g).toFixed(2)}"/><circle cx="${x}" cy="${y}" r="${SR*1.35}" fill="#FFF3B8" opacity="${(.22*g).toFixed(2)}"/>`
    +bigStar(x,y,SR,YEL,o.rot||0,true,o.eye!=null?o.eye:blink(t,.7));
}
const hearts=(lt,t0,x,y)=>{let s='';for(let k=0;k<4;k++){const q=lt-t0-k*.5;if(q>0&&q<2.4){const u=q/2.4;
  s+=heart(x+k*40+10*Math.sin(q*4+k),y-90*u,1,[PINK,ORANGE,PURPLE][k%3],Math.sin(Math.PI*u));}}return s;};
const twinkles=(lt,x,y,r=80)=>{let s='';for(let k=0;k<6;k++){const a=k*Math.PI/3+lt*.6, q=(lt*1.3+k*.37)%1;
  s+=sparkle(x+Math.cos(a)*r,y+Math.sin(a)*r,.6+.5*Math.sin(Math.PI*q),Math.sin(Math.PI*q));}return s;};
const zzz=(lt,x,y,t0=2)=>{let s='';for(let k=0;k<3;k++){let q=lt-t0-k*.9;if(q>0){q%=2.7;
  s+=`<text x="${(x+q*24+8*Math.sin(q*3)).toFixed(1)}" y="${(y-q*30).toFixed(1)}" font-size="${(28+q*11).toFixed(1)}" fill="#fff" opacity="${(Math.sin(Math.PI*q/2.7)*.95).toFixed(2)}">z</text>`;}}return s;};

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let n=.75,chars='',lights='',pops='',cap='',behind='',noMoon=false;
  switch(i){
  case 0:{
    // title at dusk: the little star twinkles in the sky, Owl sleeps on the branch
    n=.35; noMoon=true; behind=sun(t,1000,470);
    chars=owlAt(OX,OY,{asleep:true})+lulu(lt,t,{hops:[2.6],h:16});
    lights=star(HX,HY,t,{glow:.6});
    pops=pop(`${LULU}<tspan fill="${NAVY}"> and the</tspan>`,640,115,72,PINK,lt,.4,-2)
        +pop(`<tspan fill="${ORANGE}">Little Star</tspan>`,640,198,84,ORANGE,lt,.9,-2);
    break;}
  case 1:{
    // the sun goes down and the stars come out
    const u=eio(prog(lt,.2,4.5)); n=lerp(.35,.75,u); noMoon=n<.5;
    behind=sun(t,1000,lerp(470,600,u));
    chars=owlAt(OX,OY,{asleep:true})+lulu(lt,t,{wave:lt>3.4&&lt<4.6});
    lights=star(HX,HY,t,{glow:lerp(.6,1,u)});
    cap=lt<3.0?caption('The sun goes down.',lt,.3):caption('The stars come out.',lt,3.0);
    pops=pop('Twinkle!',640,165,100,GOLD,lt,3.2,-3,NAVY);
    break;}
  case 2:{
    // the little star wobbles and falls down into the grass: plink!
    let x=HX,y=HY,rot=0,eye;
    if(lt<2.0)rot=lt>1.0?14*Math.sin((lt-1.0)*14):0;
    else if(lt<3.4){const u=prog(lt,2.0,3.4); x=lerp(HX,GX,u); y=lerp(HY,GY,u*u); rot=u*200; eye=.4;}
    else {const j=jumps(lt,[3.4],.5,22); x=GX; y=GY+j.y; rot=0;}
    let trail='';
    if(lt>2.0&&lt<4.2)for(let k=1;k<5;k++){const u=prog(lt-k*.12,2.0,3.4); if(u>0&&u<1)trail+=sparkle(lerp(HX,GX,u),lerp(HY,GY,u*u),.9-k*.15,.9-k*.18);}
    chars=owlAt(OX,OY,{asleep:true})+lulu(lt,t,{wave:lt>3.6&&lt<4.8,hops:[3.8],h:14});
    lights=trail+star(x,y,t,{rot,eye});
    cap=lt<3.4?caption('Oh! What is that?',lt,.3):caption('A little star!',lt,3.6);
    pops=pop('Plink!',640,165,104,GOLD,lt,3.4,-3,NAVY);
    break;}
  case 3:{
    // hello, little star! please help me go home
    const j=jumps(lt,[3.6,4.3],.5,16);
    chars=owlAt(OX,OY,{asleep:true})+lulu(lt,t,{hops:[1.0],h:16,wave:lt>.6&&lt<1.8});
    lights=star(GX,GY+j.y,t,{rot:lt>3.4?-8:0})+(lt>3.4?twinkles(lt,HX,HY,30):'');
    cap=lt<3.4?caption('Hello, little star!',lt,.3):caption('Please help me go home!',lt,3.4);
    pops=pop('Hello!',640,165,104,PINK,lt,.5,-3);
    break;}
  case 4:{
    // Lulu hops up high, but the sky is too high
    chars=owlAt(OX,OY,{asleep:true})+lulu(lt,t,{hops:[.8,1.7,2.6],h:70});
    lights=star(GX,GY,t)+twinkles(lt,HX,HY,30);
    cap=lt<3.4?caption('Lulu hops up high.',lt,.3):caption('The sky is too high!',lt,3.4);
    pops=lt<3.4?pop('Hop! Hop!',720,165,100,TEAL,lt,.6,-3):pop('Oh no!',640,165,104,PURPLE,lt,3.6,-3);
    break;}
  case 5:{
    // Hoo! Hoo! Owl wakes up and flies down: I can help!
    let ox=OX,oy=OY,ow=0;
    if(lt>2.0&&lt<3.8){const u=eio(prog(lt,2.0,3.8)); ox=lerp(OX,LAND-80,u); oy=lerp(OY,520,u)-40*Math.sin(Math.PI*u); ow=flap(lt);}
    else if(lt>=3.8){ox=LAND-80; oy=520;}
    const asleep=lt<.3;
    chars=owlAt(ox,oy,{asleep,wing:ow||(lt>.4&&lt<1.6?20+20*Math.sin(lt*10):0),eye:blink(t,.4)})+lulu(lt,t,{wave:lt>4.0&&lt<5.2});
    lights=star(GX,GY,t);
    cap=lt<3.8?caption('Hoo! Hoo! It is Owl.',lt,.3):caption('I can help!',lt,3.8);
    pops=lt<3.8?pop('Hoo! Hoo!',760,165,100,ORANGE,lt,.4,-3):pop('Hello, Owl!',640,165,96,PINK,lt,4.0,-3);
    break;}
  case 6:{
    // Owl takes the little star and flies up, up, up, back to the sky
    const s0=[LAND-80,520];
    let ox,oy,sx=GX,sy=GY;
    if(lt<1.3){const u=eio(prog(lt,.2,1.3)); ox=lerp(s0[0],GX,u); oy=lerp(s0[1],GY-44,u)-30*Math.sin(Math.PI*u);}
    else {const u=eio(prog(lt,1.3,5.4)); sx=lerp(GX,HX,u); sy=lerp(GY,HY,u)-20*Math.sin(Math.PI*u); ox=sx; oy=sy-44;}
    chars=lulu(lt,t,{wave:lt>1.4&&lt<5.0});
    chars+=owlAt(ox,oy,{wing:lt>.2?flap(lt):0,eye:blink(t,.4)});
    lights=star(sx,sy,t);
    cap=lt<3.4?caption('Owl flies up, up, up!',lt,.3):caption('Back to the sky!',lt,3.4);
    pops=pop('Whoosh!',640,165,104,TEAL,lt,1.4,-3);
    break;}
  case 7:{
    // the little star is home: thank you, Lulu and Owl!
    let ox=LAND,oy=520,ow=0;
    if(lt<2.4){const u=prog(lt,.4,2.4); ox=lerp(HX,LAND,eout(u)); oy=lerp(HY-44,520,eio(u)); ow=flap(lt);}
    chars=lulu(lt,t,{hops:[3.4,4.2],h:16})+owlAt(ox,oy,{wing:ow||(lt>3.4&&lt<4.6?20+20*Math.sin(lt*10):0),eye:blink(t,.4)});
    lights=star(HX,HY,t,{glow:1+.3*Math.sin(Math.PI*prog(lt,.3,2.0))})+twinkles(lt,HX,HY,82)+hearts(lt,3.3,HX-210,HY+40);
    cap=lt<3.2?caption('The little star is home!',lt,.3):caption('Thank you, Lulu and Owl!',lt,3.2);
    pops=pop('Hooray!',640,165,104,PINK,lt,3.4,-3);
    break;}
  case 8:{
    // Lulu falls asleep, Owl keeps watch, the little star shines over them
    n=lerp(.75,1,eio(prog(lt,0,4)));
    const asleep=lt>1.2, br=1+.025*Math.sin(lt*2.2);
    chars=lulu(lt,t,{asleep,eye:.45,sy:br})+owlAt(LAND,520,{eye:lt>1.5?(.8+.2*Math.sin(lt*.8))*blink(t,.4):blink(t,.4)});
    lights=star(HX,HY,t,{eye:.5});
    pops=zzz(lt,620,330,2.0);
    cap=caption('Good night, little star.',lt,.5);
    pops+=pop('The End',640,150,112,GOLD,lt,3.6,-3,NAVY);
    break;}
  }
  svg.innerHTML=bg(t,n,behind,{noSun:true,noFlowers:true,noMoon,noClouds:true})+scenery()+chars+nightTint(n)+lights+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  const n=.6, t=1.2;
  let s=bg(t,n,'',{noSun:true,noFlowers:true,noClouds:true})+scenery();
  s+=owlAt(OX,OY,{wing:20});
  s+=shadow(LX,522,60)+place(LX,520,duck({eye:1,wing:20}),{s:1});
  s+=nightTint(n)+star(GX,GY,t,{eye:1});
  [[1000,330],[1100,420],[760,330],[1220,280],[60,90]].forEach((p,k)=>{s+=sparkle(p[0],p[1],1+(k%2)*.4,.9);});
  s+=label(`${LULU}<tspan fill="${NAVY}"> and the</tspan>`,770,120,92,PINK,-2);
  s+=label(`<tspan fill="${ORANGE}">Little Star</tspan>`,770,235,108,ORANGE,-2);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
