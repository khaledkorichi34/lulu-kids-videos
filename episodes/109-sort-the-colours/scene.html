<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 109 - Sort the Colours with Lulu: sorting things by colour into a red bin and a blue bin.
   Title, the two bins, six things (red apple, blue ball, red block, blue crayon, red strawberry,
   blue block) each float in and hop into the right bin, then count each bin (three and three), finale. */
// TIMING-START
const ITEMS=[['apple','red','A red apple!'],['ball','blue','A blue ball!'],['block','red','A red block!'],
             ['crayon','blue','A blue crayon!'],['strawberry','red','A red strawberry!'],['block','blue','A blue block!']];
const IT=6.5, FLY0=2.4, FLY1=3.2;
const SC=[0,5,10];ITEMS.forEach(()=>SC.push(SC[SC.length-1]+IT));SC.push(SC[SC.length-1]+8);SC.push(SC[SC.length-1]+6);
const DUR=SC[SC.length-1];
// TIMING-END
const RED='#E63946', BLUE='#2F80ED', INK='#2D2A6E', VIO='#7B5CFF';
const BX={red:270,blue:1010}, SLOT=[-95,0,95], IN_Y=404, FX=640, FY=318;
const FLOAT_S=1.3, IN_S=1;

// one thing, bottom-centre at (x,y), size s
function thing(kind,col,x,y,s){
  if(kind==='apple')return apple(x,y,.5*s);
  if(kind==='strawberry')return strawberry(x,y,.48*s);
  if(kind==='block')return toyBlock(x,y,col==='red'?'#FF5D5D':'#3FA9F5',0,s);
  if(kind==='crayon')return place(x,y,crayon(0,0,120,'#3FA9F5','#1E7FC9'),{s:s*.85,rot:-8});
  // blue ball
  const r=34*s;
  return `<g transform="translate(${x},${y-r})"><circle r="${r}" fill="#3FA9F5"/>
  <path d="M${-r*.97},${-r*.22} Q0,${r*.32} ${r*.97},${-r*.22}" stroke="#fff" stroke-width="${r*.3}" fill="none"/>
  <circle cx="${-r*.36}" cy="${-r*.42}" r="${r*.2}" fill="#fff" opacity=".55"/></g>`;
}
// slot of item n inside its bin
function slotOf(n){const c=ITEMS[n][1];let k=0;for(let m=0;m<n;m++)if(ITEMS[m][1]===c)k++;return [BX[c]+SLOT[k],k];}
function badge(x,y,k,lt,t0,col){
  const u=prog(lt,t0,t0+.3);if(u<=0)return '';
  return `<g transform="translate(${x},${y}) scale(${back(u)})"><circle r="26" fill="#fff" stroke="${col}" stroke-width="5"/><text y="12" text-anchor="middle" font-size="34" fill="${INK}">${k+1}</text></g>`;
}
function hearts(lt,t0){
  let s='';
  for(let k=0;k<9;k++){const q=lt-(t0+k*.4);if(q>0){const y=610-q*120,x=110+k*132+25*Math.sin(q*2+k),o=clamp((y-300)/120)*clamp(q*3)*.9;
    if(y>300)s+=heart(x,y,1+(k%3)*.25,['#FF5D8F','#FF9F1C','#FFFFFF'][k%3],o);}}
  return s;
}
function lulu(x,lt,t,jt,s=.75,cheer=false){
  const j=jumps(lt,jt,.55,18);
  return shadow(x,522,56*s/.8,-j.y)+place(x,520+j.y,duck({eye:blink(t,0),wing:cheer?28*Math.abs(Math.sin(lt*10)):0}),{s,sx:j.sx,sy:j.sy});
}
// bins with every item already sorted before item `upto` (items inside are drawn between back and front)
function bins(upto,binO={}){
  let s=binBack(BX.red,520,RED)+binBack(BX.blue,520,BLUE);
  for(let n=0;n<upto;n++){const [x]=slotOf(n);s+=thing(ITEMS[n][0],ITEMS[n][1],x,IN_Y,IN_S);}
  if(binO.extra)s+=binO.extra;
  s+=binFront(BX.red,520,RED,'red')+binFront(BX.blue,520,BLUE,'blue');
  return s;
}

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let props='',chars='',pops='',cap='',o={noSun:true,noFlowers:true,noClouds:true};
  if(i===0){
    chars=bins(0)+lulu(640,lt,t,[1.6,2.6],.85,true);
    pops=pop('Sort the Colours',640,128,92,INK,lt,.3)+pop(`<tspan fill="${INK}">with </tspan>`+LULU,640,250,104,INK,lt,.8,-3);
  }else if(i===1){
    chars=bins(0)+lulu(640,lt,t,[3.0],.75,lt>2.8);
    const pr=back(prog(lt,.3,.7)), pb=back(prog(lt,1.2,1.6));
    pops=pop('red',BX.red,330,90,RED,lt,.4)+pop('blue',BX.blue,330,90,BLUE,lt,1.3);
    cap=lt<2.8?caption('Red bin, blue bin.',lt,.3):caption('Let’s sort!',lt,2.8);
  }else if(i<2+ITEMS.length){
    const n=i-2, [kind,col,txt]=ITEMS[n], [tx]=slotOf(n);
    // grows in, floats, then hops into its bin
    const g=back(prog(lt,.3,.7)), u=eio(prog(lt,FLY0,FLY1));
    let x=lerp(FX,tx,u), y=lerp(FY,IN_Y,u)-160*Math.sin(Math.PI*u), s=lerp(FLOAT_S,IN_S,u)*g;
    if(u===0)y+=6*Math.sin(lt*3);
    let extra='';
    if(g>0&&u>=1)extra=thing(kind,col,x,y,s);
    chars=bins(n,{extra});
    if(g>0&&u<1)props=thing(kind,col,x,y,s);
    if(lt>.3&&lt<1.0)props+=sparkle(FX-80,FY-90,.8,1-prog(lt,.3,1))+sparkle(FX+85,FY-40,.6,1-prog(lt,.4,1));
    if(lt>FLY1&&lt<FLY1+.7)props+=sparkle(tx,IN_Y-110,.8,1-prog(lt,FLY1,FLY1+.7));
    chars+=lulu(640,lt,t,[FLY1+.1],.75,lt>FLY1);
    pops=pop(col,640,150,104,col==='red'?RED:BLUE,lt,.5);
    cap=lt<FLY1+.1?caption(txt,lt,.3):caption(`In the ${col} bin!`,lt,FLY1+.1);
  }else if(i===2+ITEMS.length){
    chars=bins(ITEMS.length)+lulu(640,lt,t,[3.4,7.0],.75,lt>3.3&&lt<3.9||lt>6.9);
    for(let k=0;k<3;k++){pops+=badge(BX.red+SLOT[k],282,k,lt,.7+k*.6,RED);pops+=badge(BX.blue+SLOT[k],282,k,lt,4.3+k*.6,BLUE);}
    pops+=pop('3',BX.red,186,120,RED,lt,2.6)+pop('3',BX.blue,186,120,BLUE,lt,6.2);
    cap=lt<3.9?caption('One, two, three red!',lt,.4):caption('One, two, three blue!',lt,3.9);
  }else{
    props=hearts(lt,1.2);
    chars=bins(ITEMS.length)+lulu(640,lt,t,[1.0,2.0,3.0],.85,true);
    pops=pop('Well done!',640,140,110,'#FF9F1C',lt,.3,-3);
    cap=caption('All sorted!',lt,.8);
  }
  svg.innerHTML=bg(t,0,'',o)+props+chars+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=`<defs>${skyGrad('g','#4DB9FF','#DDF5FF')}${CLIP}</defs><rect width="1280" height="720" fill="url(#g)"/>`;
  s+=cloud(1130,90,1.0,.95);
  s+=`<path d="M0,500 Q300,410 640,480 T1280,470 L1280,720 L0,720Z" fill="#9ADB6F"/>`;
  s+=`<path d="M0,580 Q380,510 760,565 T1280,550 L1280,720 L0,720Z" fill="#6CC24A"/>`;
  s+=binBack(300,690,RED,1.1)+thing('apple','red',215,585,1.05)+thing('strawberry','red',300,585,1.05)+thing('block','red',390,585,1.05)+binFront(300,690,RED,'red',1.1);
  s+=binBack(980,690,BLUE,1.1)+thing('ball','blue',895,585,1.05)+thing('crayon','blue',980,585,1.05)+thing('block','blue',1070,585,1.05)+binFront(980,690,BLUE,'blue',1.1);
  s+=shadow(640,662,80)+place(640,658,duck({wing:22}),{s:1.25});
  s+=label('Sort the Colours',640,150,100,INK,-2)+label(`<tspan fill="${INK}">with </tspan>`+LULU,640,270,100,INK,2);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
