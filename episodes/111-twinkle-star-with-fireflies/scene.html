<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script src="../../toolkit/rhymes.js"></script>
<script>
/* Episode 111 - Twinkle, Twinkle, Little Star with fireflies (sing-along, fourth time for this rhyme,
   new setting and cast). A warm summer evening in the meadow: Lulu and Pip the kitten sit on a picnic
   blanket; four little fireflies glow brighter on every "twinkle"; the big star rises on "Up above";
   diamonds sparkle round it. Verse 2: Puppy trots in to listen. Ending: the fireflies glow softly,
   Lulu and Pip fall asleep, the star closes its eyes, "Good night, little star!" */
const BPM=92, START=5.0;
const LINES=rhymeTimes(RHYMES.twinkle,START,2,4,BPM);
const END=rhymeEnd(LINES);
const DUR=76, SC=[0,DUR];             // END is about 70.2 s
const SPB=60/BPM;
const V2=LINES[6].t0;
const SX=860, SY=215;                      // the big star
const LX=300, KX=500, PXEND=1080;          // Lulu, Pip, where Puppy stops
// fireflies: home position, size, which way they face
const FF=[[110,330,1.0,false],[660,420,.85,true],[1190,300,.95,true],[900,455,.8,true]];

const GLOW='<defs><radialGradient id="glow"><stop offset="0" stop-color="#FFF3B8" stop-opacity=".5"/><stop offset="1" stop-color="#FFF3B8" stop-opacity="0"/></radialGradient></defs>';
function diamond(x,y,s,o){return `<path transform="translate(${x},${y}) scale(${s})" d="M0,-16 L11,0 L0,16 L-11,0Z" fill="#CFF3FF" opacity="${o}"/><path transform="translate(${x},${y}) scale(${s})" d="M0,-16 L3,0 L0,16 L-3,0Z" fill="#fff" opacity="${o}"/>`;}
function meadow(t){
  let s='';
  s+=flower(40,560,90,'#FF7BAC',t,0,.8)+flower(80,575,70,'#B98CFF',t,1,.7);
  s+=flower(760,560,80,'#FFD23F',t,2,.75)+flower(1240,565,85,'#FF7BAC',t,3,.8);
  return s;
}

function render(t){
  const n=t<4?lerp(.5,.9,eio(prog(t,0,4))):.9+.1*prog(t,END,END+3);
  const li=currentLine(LINES,t), L=li>=0?LINES[li]:null, line=L?L.index:-1;
  const p=t<END+.5?beatPulse(LINES,t):0;
  const sway=t>START-.5&&t<END+.6?Math.sin(2*Math.PI*(t-START)/(2*SPB)):0;
  const sleep=t>END+1.4, starSleep=t>END+2.6;
  let props='',chars='',sky='',flies='',pops='',cap='';

  // the star rises a little on "Up above the world so high"
  const up=line===2?eio(prog(t,L.t0,L.t0+1.2)):line===3?1-eio(prog(t,L.t0,L.t0+1.4)):0;
  const sg=back(prog(t,4.3,5.0))*(t>4.3?1:0);
  const sy=SY-50*up, sr=68*sg*(1+.12*p);

  props+=picnicBlanket(400,575,.48)+meadow(t);

  // Pip the kitten on the blanket, tail sways with the music
  chars+=shadow(KX,522,52)+place(KX,520-(sleep?0:5*p),kitten({eye:blink(t,1.4),tail:sleep?.2:sway,asleep:sleep,tilt:sleep?10:6*sway}),{s:.82});
  // Lulu sways and waves her wing
  const lw=sleep?6:12+10*sway+12*((line===0||line===4)?p:0);
  chars+=shadow(LX,522,60)+place(LX,520-(sleep?0:6*p),duck({eye:blink(t,0),wing:lw,asleep:sleep}),{s:1.0,rot:sleep?0:4*sway});

  // verse 2: Puppy trots in from the right and sits to listen
  const ws=V2-4.5, we=V2-.8;
  if(t>ws){
    const u=eio(prog(t,ws,we)), x=lerp(1400,PXEND,u), walking=t<we;
    const hop=walking?Math.abs(Math.sin(t*9))*-8:-(sleep?0:4*p);
    chars+=shadow(x,522,56)+place(x,520+hop,puppy({eye:blink(t,.7),tail:sleep?0:Math.sin(t*9),asleep:sleep&&t>END+2}),{s:.8,flip:true});
  }

  // the fireflies glow brighter on every "twinkle"
  const tw=(line===0||line===4)?p:0;
  FF.forEach(([x,y,s,l],k)=>{
    const g=t<.8?0:clamp((sleep?.55:.45+.55*tw)*prog(t,.8+k*.4,1.6+k*.4));
    const fx=x+14*Math.sin(t*1.1+k*2), fy=y+9*Math.sin(t*1.7+k);
    if(t>.8+k*.4) flies+=place(fx,fy,firefly({glow:g,flap:.5+.5*Math.sin(t*26+k),eye:sleep&&t>END+2.2?.1:blink(t,k*.9)}),{s:s,flip:l});
  });

  // the big star
  if(sg>0){
    sky+=GLOW+`<circle cx="${SX}" cy="${sy}" r="${160*sg*(1+.1*p)}" fill="url(#glow)"/>`;
    sky+=bigStar(SX,sy,sr,'#FFD93B',6*Math.sin(t*1.3),true,starSleep?.12:blink(t,2));
  }
  // diamonds on "Like a diamond in the sky", one per syllable
  for(const Lx of LINES)if(Lx.index===3&&t>=Lx.t0&&t<Lx.t1+2.5){
    const fade=1-prog(t,Lx.t1+1.2,Lx.t1+2.5);
    Lx.words.forEach((w,k)=>{if(t>=w.t0){const a=-2.7+k*.9,s=back(prog(t,w.t0,w.t0+.3))*(1+.15*Math.sin(t*6+k));
      sky+=diamond(SX+170*Math.cos(a),SY+20+115*Math.sin(a),s*1.3,fade);}});
  }
  // a little wonder bubble above Lulu on "How I wonder what you are!"
  for(const Lx of LINES)if(Lx.index===1&&t>=Lx.t0-.2&&t<Lx.t1+.6){
    const o=prog(t,Lx.t0-.2,Lx.t0+.3)*(1-prog(t,Lx.t1,Lx.t1+.6));
    sky+=`<g opacity="${o}"><circle cx="360" cy="292" r="9" fill="#fff"/><circle cx="382" cy="264" r="13" fill="#fff"/><circle cx="412" cy="214" r="38" fill="#fff"/><text x="412" y="230" text-anchor="middle" font-size="46" fill="#7B5CFF">?</text></g>`;
  }

  const to=1-prog(t,3.7,4.3);
  if(to>0)pops=`<g opacity="${to}">`+pop('Twinkle, Twinkle,',760,160,82,'#FFD23F',t,.4,-2,'#2D2A6E')+pop('Little Star',760,272,110,'#FFD23F',t,1.0,2,'#2D2A6E')+`</g>`;
  cap=t<END+1.4?karaoke(LINES,t,'#3FA9F5'):caption('Good night, little star!',t-END,1.6);

  svg.innerHTML=bg(t,n,'',{noMoon:true,noSun:true,noFlowers:true,noClouds:true})+props+chars+nightTint(.4*n)+sky+flies+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=bg(0,.95,'',{noMoon:true,noSun:true,noFlowers:true,noClouds:true})+picnicBlanket(330,700,.5);
  s+=shadow(470,662,80)+place(470,660,kitten({tail:.4,tilt:6}),{s:1.1});
  s+=shadow(250,662,110)+place(240,658,duck({wing:24}),{s:1.45});
  s+=nightTint(.38);
  s+=GLOW+`<circle cx="910" cy="200" r="230" fill="url(#glow)"/>`+bigStar(910,200,110,'#FFD93B',-6,true);
  s+=place(120,330,firefly({glow:1,flap:.6}),{s:1.2})+place(640,330,firefly({glow:1,flap:.3}),{s:1.0,flip:true})+place(1190,620,firefly({glow:1,flap:.5}),{s:1.1,flip:true});
  s+=label('Twinkle, Twinkle,',905,430,72,'#FFD23F',-3,'#2D2A6E')+label('Little Star',905,530,100,'#FFD23F',-2,'#2D2A6E');
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
