<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 114 - Did you know? Snow facts, with Lulu and Bunny.
   Title (snowy hills, Lulu in her woolly hat, Bunny hops), fact 1 (snow falls from cold clouds,
   snowflakes are made of ice), a snowflake lands on Lulu's beak (close-up, it sparkles),
   fact 2 (many snowflakes have six points, count them 1 to 6), fact 3 (snow melts when it gets warm,
   a snowball shrinks into a puddle), when it gets very cold the water freezes into ice,
   recap (ice, six points, melts), bye bye. */
const SC=[0,5.5,12,18.5,25,31.5,38,44.5,50.5,56], DUR=56;
const NAVY='#2D2A6E', PURPLE='#7B5CFF', ORANGE='#E76F2E', GOLD='#FFE58A', PINK='#FF5D8F', BLUE='#3FA9F5';
const HAT=woollyHat(42,-138,.62,'#FF5D8F');
const lulu=(x,lt,t,o={})=>{
  const j=jumps(lt,o.hops||[],.6,o.h||22), w=o.wave?20+20*Math.sin(lt*9):(o.wing||0), s=o.s||.95;
  return shadow(x,522,58*s,-j.y)+place(x,520+j.y,duck({eye:o.eye!=null?o.eye:blink(t,0),wing:w})+HAT,{s,sx:j.sx,sy:j.sy,flip:o.flip});
};
const bunC=(x,lt,t,o={})=>{
  const j=jumps(lt,o.hops||[],.55,o.h||22), s=o.s||.9;
  return shadow(x,522,46*s,-j.y)+place(x,520+j.y,bunny({eye:blink(t,.8),ear:6*Math.sin(lt*2)})+scarfWrap(0,-74,84,'#3FA9F5'),{s,sx:j.sx,sy:j.sy});
};
// gently falling snow, kept out of the text area and out of the given boxes [x0,y0,x1,y1]
function snowfall(t,n=26,boxes=[],op=1){
  let s='';
  for(let k=0;k<n;k++){
    const sp=38+(k%5)*9, y=((k*97+t*sp)%560)-30, x=((k*151+37)%1260)+10+14*Math.sin(t*.9+k);
    if(x>270&&x<1010&&y>70&&y<240)continue;
    if(boxes.some(b=>x>b[0]&&x<b[2]&&y>b[1]&&y<b[3]))continue;
    const o=op*.9*clamp((510-y)/40)*clamp((y+30)/30);
    if(o>0)s+=snowflake(x,y,.45+(k%3)*.15,t*25+k*30,o);
  }
  return s;
}
const grow=(lt,t0)=>lt>t0?back(prog(lt,t0,t0+.4)):0;
let WIN=0;
function closeWin(x,y,r,g,inner,bgc){
  if(g<=0)return '';
  const id='w'+(WIN++);
  return `<g transform="translate(${x},${y}) scale(${g})"><defs><clipPath id="${id}"><circle r="${r}"/></clipPath></defs>
  <g clip-path="url(#${id})"><circle r="${r}" fill="${bgc}"/>${inner}</g>
  <circle r="${r}" fill="none" stroke="#fff" stroke-width="9"/></g>`;
}
// number badge
const badge=(x,y,n,u)=>u<=0?'':`<g transform="translate(${x},${y}) scale(${back(clamp(u))})"><circle r="27" fill="${PURPLE}" stroke="#fff" stroke-width="5"/><text y="12" text-anchor="middle" font-size="34" fill="#fff">${n}</text></g>`;
// a flat patch of ice: pale blue with white shine streaks, about 2w wide
function icePatch(x,y,w,u){
  if(u<=0)return '';
  return `<g opacity="${u}"><ellipse cx="${x}" cy="${y+3}" rx="${w}" ry="${w*.16}" fill="#A9D4F0"/><ellipse cx="${x-w*.04}" cy="${y}" rx="${w*.9}" ry="${w*.12}" fill="#E4F4FF"/>
  <path d="M${x-w*.5},${y-2} L${x-w*.2},${y-8} M${x+w*.1},${y+4} L${x+w*.45},${y-4}" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>`;
}
const BIGFLAKE=(t,s,rot)=>snowflake(0,0,s,rot,1);

function render(t){
  WIN=0;
  const [i,lt]=sceneAt(t,SC);
  let props='',chars='',pops='',cap='',o={noSun:true,noFlowers:true},hills=1;
  if(i===0){
    props=snowfall(t,26,[[90,280,560,540],[700,300,960,540]])+winterTree(1120,520,.8,1);
    chars=lulu(lerp(140,420,eio(prog(lt,0,2.2))),lt,t,{wave:lt>2.4})+bunC(820,lt,t,{hops:[2.8,3.6]});
    pops=pop('Did you know?',640,165,96,PURPLE,lt,.3,-3);
    cap=caption('Fun snow facts with Lulu',lt,2.0);
  }else if(i===1){
    // fact 1: snow falls from a cold cloud
    props=rainCloud(900,290,1.1,blink(t,.4));
    for(let k=0;k<9;k++){const sp=55, y=340+((k*61+lt*sp)%180), x=820+(k*37)%170+8*Math.sin(lt+k);
      props+=snowflake(x,y,.55+(k%3)*.15,lt*30+k*40,clamp((510-y)/30)*clamp((y-340)/20)*clamp(lt*2));}
    chars=lulu(330,lt,t,{hops:[.6,4.4],h:20});
    pops=pop('Fact 1',640,160,100,ORANGE,lt,.3);
    cap=lt<3.4?caption('Snow falls from cold clouds.',lt,.6):caption('Snowflakes are made of ice.',lt,3.4);
  }else if(i===2){
    // a snowflake drifts down onto Lulu's beak; close-up shows it sparkling
    const u=eio(prog(lt,.3,2.6)), fx=lerp(640,522,u)+16*Math.sin(lt*2)*(1-u), fy=lerp(260,412,u);
    props=snowfall(t,14,[[220,250,640,540],[740,200,1060,520]],.8);
    const sk=lt>3.2?Math.sin(Math.PI*prog(lt,3.2,4.4)):0, sk2=lt>3.8?Math.sin(Math.PI*prog(lt,3.8,5.2)):0;
    props+=closeWin(900,370,140,grow(lt,2.9),BIGFLAKE(t,5.2,lt*6)+sparkle(-60,-70,1.3,sk)+sparkle(70,40,1.1,sk2)+sparkle(30,-90,.9,sk2),'#CFEBFF');
    chars=lulu(420,lt,t,{eye:lt>2.6&&lt<3.1?.1:blink(t,0)})+snowflake(fx,fy,.7,lt*40,1);
    pops=lt>3.6?pop('Sparkly!',640,165,96,BLUE,lt,3.6,-3):'';
    cap=lt<3.2?caption('A snowflake lands on Lulu.',lt,.4):caption('Look how it sparkles!',lt,3.2);
  }else if(i===3){
    // fact 2: six points, count them
    const g=grow(lt,.5), R=140, cx=700, cy=380;
    props=`<g transform="translate(${cx},${cy}) scale(${g})">${snowflake(0,0,6,-90,1)}</g>`;
    for(let k=0;k<6;k++){const a=(-90+k*60)*Math.PI/180, t0=3.0+k*.5;
      if(lt>t0)props+=sparkle(cx+Math.cos(a)*100,cy+Math.sin(a)*100,.8,Math.sin(Math.PI*prog(lt,t0,t0+.8)));
      props+=badge(cx+Math.cos(a)*R,cy+Math.sin(a)*R,k+1,prog(lt,t0,t0+.35));}
    chars=lulu(250,lt,t,{hops:[6.2]});
    pops=lt<6.0?pop('Fact 2',640,160,100,ORANGE,lt,.3):pop('Six!',640,165,100,PURPLE,lt,6.0,-3);
    cap=lt<2.8?caption('Many snowflakes have six points.',lt,.6):caption("Let's count them!",lt,2.8);
  }else if(i===4){
    // fact 3: the sun comes out, a snowball melts into a puddle
    o.noSun=false; hills=1-.45*prog(lt,.5,6);
    const m=prog(lt,1.2,5.6), r=lerp(70,0,eio(m));
    props=puddle(820,522,lerp(30,150,eio(m)),0,lt>2?((lt-2)%1.4)/1.4:-1);
    if(r>2)props+=snowball(820,524,r,0);
    if(lt>2.4&&r>8)for(let k=0;k<2;k++){const q=((lt-2.4+k*.6)%1.2)/1.2;props+=raindrop(820+(k?r*.7:-r*.6),524-r*.6+60*q*q,.8,1-q);}
    chars=lulu(380,lt,t,{wing:lt>3.6?14:0});
    pops=lt<3.4?pop('Fact 3',640,160,100,ORANGE,lt,.3):pop('Drip, drip!',640,165,96,BLUE,lt,3.4,-3);
    cap=lt<3.4?caption('Snow melts when it gets warm.',lt,.6):caption('It turns into water!',lt,3.4);
  }else if(i===5){
    // cold again: the puddle freezes into ice
    hills=.55+.45*prog(lt,.3,3); const f=prog(lt,2.6,3.8);
    props=snowfall(t,16,[[240,260,560,540],[600,420,1040,560]],prog(lt,.3,1.5));
    props+=puddle(820,522,150,0,-1)+icePatch(820,522,150,f);
    if(lt>3.8)props+=sparkle(740,500,1,Math.sin(Math.PI*prog(lt,3.8,5)))+sparkle(900,512,.8,Math.sin(Math.PI*prog(lt,4.3,5.5)));
    chars=lulu(380,lt,t,{hops:lt>4?[4.6]:[]});
    pops=lt>4.0?pop('Brr!',640,165,110,BLUE,lt,4.0,-3):'';
    cap=lt<3.2?caption('When it gets very cold...',lt,.4):caption('...water freezes into ice.',lt,3.2);
  }else if(i===6){
    // recap
    const b=k=>1+.05*Math.sin(t*4+k*2), X=[300,640,980], Y=390, sky='#CFEBFF';
        props=closeWin(X[0],Y,118,grow(lt,.4)*b(0),BIGFLAKE(t,3.6,t*10)+sparkle(-40,-50,1,.6+.4*Math.sin(t*4)),sky);
    let six='';for(let k=0;k<6;k++){const a=(-90+k*60)*Math.PI/180;six+=`<circle cx="${(Math.cos(a)*80).toFixed(1)}" cy="${(Math.sin(a)*80).toFixed(1)}" r="9" fill="${PURPLE}"/>`;}
    props+=closeWin(X[1],Y,118,grow(lt,1.4)*b(1),snowflake(0,0,3.6,-90,1)+six,sky);
    props+=closeWin(X[2],Y,118,grow(lt,2.4)*b(2),'<rect x="-130" y="30" width="260" height="120" fill="#9ADB6F"/>'+sun(t,55,-55).replace('translate(55,-55)','translate(55,-55) scale(.55)')+puddle(25,42,62,0,(t%1.4)/1.4)+snowball(-38,46,34,0),'#BFE8FF');
    pops=pop('ice',X[0],230,44,GOLD,lt,.4,0,NAVY)+pop('six points',X[1],230,44,GOLD,lt,1.4,0,NAVY)+pop('melts',X[2],230,44,GOLD,lt,2.4,0,NAVY);
    cap=caption('Snow is amazing!',lt,3.4);
  }else{
    props=snowfall(t,24,[[230,280,920,540]]);
    chars=lulu(lerp(300,470,eio(prog(lt,.4,2.2))),lt,t,{wave:lt>.8})+bunC(790,lt,t,{hops:[1.6,2.4]});
    pops=pop('Bye bye!',640,165,100,GOLD,lt,.4,-3,NAVY);
    cap=caption('Bye bye from Lulu and Bunny!',lt,1.4);
  }
  svg.innerHTML=bg(t,0,'',o)+snowHills(hills,0)+props+chars+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=`<defs>${skyGrad('g','#6CC6FF','#DDF3FF')}${CLIP}</defs><rect width="1280" height="720" fill="url(#g)"/>`;
  s+=cloud(140,110,1,1)+cloud(1140,120,.9,1);
  s+=snowHills(1,0);
  [[90,380,.9],[230,470,.6],[1040,330,.7],[1200,420,.9],[60,560,.6],[1220,600,.7]].forEach(([x,y,sc],k)=>{s+=snowflake(x,y,sc,k*20,.95);});
  s+=`<g transform="translate(880,470)">${snowflake(0,0,6.2,-90,1)}</g>`+sparkle(800,400,1.4,1)+sparkle(960,540,1.1,1);
  s+=place(330,700,duck({wing:24})+HAT,{s:1.3});
  s+=label('Did you know?',640,175,120,PURPLE,-3);
  s+=label('Fun snow facts',640,295,100,'#fff',-2,BLUE);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
