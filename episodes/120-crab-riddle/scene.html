<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 120 - Who am I? A seaside riddle.  Title, three clues (I have a hard shell; I have two big claws;
   I like to hide behind rocks (eyes and claws peek over the rock)), "Who am I?", the reveal (a crab steps out),
   fact 1 (most crabs walk sideways), fact 2 (a crab's eyes are on little stalks, they help it see all around),
   fact 3 (crabs pick up food with their claws), goodbye. All on a sunny beach. */
const SC=[0,5.5,12,18.5,25,30.5,37.5,45,52.5,60,66], DUR=66;
const NAVY='#2D2A6E', PURPLE='#7B5CFF', ORANGE='#E76F2E', RED='#E0453B', BLUE='#2F8FE0', TEAL='#19B8A6', GREY='#6E7180';
const BX=820, BY=522, RS=1.35;                     // rock centre and scale (spans x ~690..950, top ~375)
const lulu=(x,lt,t,hops,h=20,s=.95,wave=false,extra='')=>{
  const j=jumps(lt,hops,.6,h), w=wave?20+20*Math.sin(lt*9):0;
  return shadow(x,522,56*s/.95,-j.y)+place(x,520+j.y,duck({eye:blink(t,0),wing:w})+extra,{s,sx:j.sx,sy:j.sy});
};
const C=(t,o={})=>crab(Object.assign({eye:blink(t,.7)},o));
const qmark=(t,x=BX,y=315)=>label('?',x,y+4*Math.sin(t*3),110,'#fff',0,RED,.12);
const grow=(lt,t0)=>lt>t0?back(prog(lt,t0,t0+.4)):0;
// sunny beach: sky, sea with little waves, sand
function beach(t){
  let s=`<defs>${skyGrad('bsky','#5EC2FF','#DDF5FF')}<clipPath id="above"><rect width="1280" height="516"/></clipPath></defs>
  <rect width="1280" height="720" fill="url(#bsky)"/>`;
  s+=sun(t,1150,100);
  s+=cloud(130+8*Math.sin(t*.3),90,.75,.95);
  s+=`<rect y="372" width="1280" height="120" fill="#3FA9F5"/><rect y="372" width="1280" height="14" fill="#7CC8FF"/>`;
  s+=waves(250,410,300,t)+waves(950,430,300,t*1.1);
  s+=`<path d="M0,470 Q320,448 640,466 T1280,458 L1280,720 L0,720Z" fill="#F7E2B0"/>`;
  s+=`<path d="M0,478 Q320,456 640,474 T1280,466" stroke="#fff" stroke-width="7" fill="none" opacity=".7"/>`;
  s+=`<path d="M0,560 Q400,530 800,556 T1280,545 L1280,720 L0,720Z" fill="#EFD39A"/>`;
  return s;
}
function deco(t){ return seashell(500,566,.45,'#FFB4C2',-8)+seashell(1180,575,.5,'#FFD6A5',10)+seashell(90,585,.42,'#D9C2FF',4); }
// a crab hiding behind the rock; u = 0 hidden, 1 its eyes and claws peek over the top
function rockWithPeek(t,u,wig=0,claw=0){
  let s='';
  if(u>0)s+=`<g clip-path="url(#above)">${place(BX+6,lerp(BY+150,BY-40,u),C(t,{claw}),{s:1.1,rot:wig})}</g>`;
  return s+rock(BX,BY,RS);
}
function icon(x,y,g,inner){
  if(g<=0)return '';
  return `<g transform="translate(${x},${y}) scale(${g})"><defs><clipPath id="ic"><circle r="88"/></clipPath></defs>
  <circle r="92" fill="#fff" stroke="#FFD23F" stroke-width="7"/><g clip-path="url(#ic)">${inner}</g></g>`;
}
function shellIcon(t){
  return `<rect x="-100" y="-100" width="200" height="200" fill="#FFE9E2"/>
  <ellipse cx="0" cy="10" rx="74" ry="52" fill="#F2554A"/>
  <ellipse cx="-24" cy="-14" rx="26" ry="12" fill="#fff" opacity=".32" transform="rotate(-20 -24 -14)"/>
  <circle cx="18" cy="22" r="7" fill="#D63C33"/><circle cx="-20" cy="30" r="6" fill="#D63C33"/><circle cx="40" cy="-4" r="5" fill="#D63C33"/>`;
}
function clawIcon(t){
  const c=.5+.5*Math.sin(t*5);
  return `<rect x="-100" y="-100" width="200" height="200" fill="#FFF4E0"/>
  <path d="M-90,100 Q-70,60 -36,40" stroke="#F2554A" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M10,32 Q50,44 78,20 Q60,54 14,58 Z" fill="#F2554A"/>
  <g transform="rotate(${-18*c} 10 0)"><path d="M10,-6 Q50,-30 82,-6 Q58,-50 14,-30 Z" fill="#F2554A"/></g>
  <ellipse cx="-14" cy="16" rx="44" ry="38" fill="#F2554A"/>
  <ellipse cx="-28" cy="0" rx="16" ry="9" fill="#fff" opacity=".32" transform="rotate(-25 -28 0)"/>`;
}
function sparkles(x,y,lt,t0){
  const u=prog(lt,t0,t0+1.2);if(u<=0||u>=1)return '';
  let s='';for(let k=0;k<6;k++){const a=k*Math.PI/3+.4, d=40+u*110;s+=sparkle(x+Math.cos(a)*d,y+Math.sin(a)*d*.7,1.3,1-u);}
  return s;
}
// little pairs of dots the crab leaves in the sand while it walks from x0 to x (sideways)
function tracks(x0,x){
  let s='';for(let p=x0+30;p<x-40;p+=42)s+=`<circle cx="${p}" cy="532" r="4" fill="#D9B978"/><circle cx="${p+12}" cy="540" r="4" fill="#D9B978"/>`;
  return s;
}
function weed(x,y,s=1){ // a small piece of green seaweed lying on the sand
  return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-22,0 Q-10,-14 0,-6 Q10,-18 22,-4" stroke="#3FA34D" stroke-width="10" fill="none" stroke-linecap="round"/></g>`;
}

function render(t){
  const [i,lt]=sceneAt(t,SC);
  let back_=beach(t),props='',chars='',pops='',cap='';
  if(i===0){
    const peek=eio(prog(lt,2.2,2.8))-eio(prog(lt,4.2,4.8));
    props=deco(t)+rockWithPeek(t,peek,3*Math.sin(lt*6),.5+.5*Math.sin(lt*6))+qmark(t);
    chars=lulu(280,lt,t,[1.3,2.3],30,1.1,true);
    pops=pop('Who am I?',600,165,120,PURPLE,lt,.3,-3);
    cap=caption('A new riddle with '+LULU,lt,1.8,'A new riddle with Lulu');
  }else if(i>=1&&i<=3){
    const N=i;
    let u=0,wig=0;
    if(N===3){u=eio(prog(lt,2.4,3.2))-eio(prog(lt,5.4,6.0));wig=3*Math.sin(lt*6);}
    props=deco(t)+rockWithPeek(t,u,wig,N===3?.5+.5*Math.sin(lt*5):0)+qmark(t);
    if(N===1)props+=icon(1110,300,grow(lt,2.4),shellIcon(t));
    if(N===2)props+=icon(1110,300,grow(lt,2.4),clawIcon(t));
    chars=lulu(250,lt,t,[3.2]);
    pops=pop('Clue '+N,560,150,100,ORANGE,lt,.3);
    cap=caption(['','I have a hard shell.','I have two big claws.','I like to hide behind rocks.'][N],lt,1.2);
  }else if(i===4){
    props=deco(t)+rockWithPeek(t,0)+qmark(t);
    chars=lulu(250,lt,t,[]);
    pops=pop('shell',380,165,60,RED,lt,.3)+pop('claws',640,165,60,ORANGE,lt,.9)+pop('rocks',900,165,60,GREY,lt,1.5);
    cap=caption('Who am I? Can you guess?',lt,2.2);
  }else if(i===5){
    // the crab climbs out from behind the rock and walks sideways to the right
    const up=eout(prog(lt,.3,1.0)), x=lerp(BX,1040,eio(prog(lt,1.0,2.2))), walking=lt>1.0&&lt<2.2;
    props=deco(t);
    const y=lerp(BY+150,520,up);
    props+=`<g clip-path="url(#above)">${(up>=1?shadow(x,522,80):'')+place(x,y-(walking?3*Math.abs(Math.sin(lt*14)):0),C(t,{claw:lt>2.4?.5+.5*Math.sin(lt*7):0,step:walking?lt*14:0}),{s:1.2})}</g>`;
    props+=rock(BX,BY,RS)+sparkles(1040,430,lt,2.2);
    chars=lulu(250,lt,t,[2.6,3.3],30,.95,lt>2.4);
    pops=pop('A crab!',600,165,110,RED,lt,2.2,-3);
    cap=caption('I am a crab!',lt,2.4);
  }else if(i===6){
    // fact 1: the crab walks sideways along the sand, left then back right
    const a=eio(prog(lt,.6,3.2)), b=eio(prog(lt,4.0,6.4)), x=lerp(lerp(600,1000,a),780,b), moving=(lt>.6&&lt<3.2)||(lt>4.0&&lt<6.4);
    props=deco(t)+tracks(600,lerp(600,1000,a));
    chars=lulu(250,lt,t,[])+shadow(x,522,80)+place(x,520-(moving?3*Math.abs(Math.sin(lt*14)):0),C(t,{step:moving?lt*14:0}),{s:1.2});
    pops=pop('Fact 1',420,150,100,'#fff',lt,.3,0,ORANGE)+(lt>1.0?pop('Step, step!',790,175,70,PURPLE,lt,1.0,-3):'');
    cap=lt<4.0?caption('Most crabs walk sideways.',lt,.9):caption('Side to side, step, step!',lt,4.0);
  }else if(i===7){
    // fact 2: close-up circle of the eyes on their stalks
    props=deco(t)+rock(1060,522,.8);
    chars=lulu(250,lt,t,[])+shadow(680,522,80)+place(680,520,C(t),{s:1.2});
    const g=grow(lt,1.6);
    const ring=g>0?`<circle cx="680" cy="384" r="${52+4*Math.sin(lt*5)}" fill="none" stroke="#FFD23F" stroke-width="6" opacity="${.9*prog(lt,1.6,2.0)}"/>`:'';
    pops=ring+pop('Fact 2',420,150,100,'#fff',lt,.3,0,ORANGE)+icon(1000,300,grow(lt,2.4),`<rect x="-100" y="-100" width="200" height="200" fill="#FFE2A8"/>${place(0,205,C(t),{s:2.0})}`);
    cap=lt<4.0?caption('Its eyes are on little stalks.',lt,.9):caption('They help it see all around.',lt,4.0);
  }else if(i===8){
    // fact 3: the crab picks up a bit of seaweed with its claw and nibbles it
    const X=680, pick=prog(lt,1.6,2.4), toMouth=eio(prog(lt,4.0,4.8)), eat=prog(lt,5.0,6.4);
    const clawX=X+1.2*86, clawY=520-1.2*112;
    const mouthX=X+20, mouthY=520-1.2*40;
    let wx=lerp(X+110,clawX,eio(pick)), wy=lerp(530,clawY+10,eio(pick));
    wx=lerp(wx,mouthX,toMouth); wy=lerp(wy,mouthY,toMouth);
    const ws=1.1*(1-eat);
    props=deco(t);
    chars=lulu(300,lt,t,[])+shadow(X,522,80)+place(X,520,C(t,{claw:lt<2.4?prog(lt,1.0,1.6):.3}),{s:1.2});
    if(ws>.05)chars+=weed(wx,wy,ws);
    pops=pop('Fact 3',420,150,100,'#fff',lt,.3,0,ORANGE)+(lt>5.0?pop('Nibble, nibble!',950,300,56,TEAL,lt,5.0,-3):'');
    cap=lt<4.0?caption('Crabs pick up food with their claws.',lt,.9):caption('Then they nibble it. Yum!',lt,4.0);
  }else{
    props=heart(640,330+6*Math.sin(t*3),1.4,'#FF7FB0',.85*prog(lt,2,2.5))+heart(600,275+6*Math.sin(t*3+1),1,'#FF9AA2',.85*prog(lt,2.3,2.8));
    props+=deco(t)+rock(1100,522,.8);
    chars=lulu(400,lt,t,[1.0,1.8],26,.95,true)+shadow(820,522,80)+place(820,520,C(t,{claw:.5+.5*Math.sin(lt*6)}),{s:1.2});
    pops=pop('Bye bye!',560,160,110,PURPLE,lt,.4,-2);
    cap=caption('Bye bye, little crab!',lt,1.6);
  }
  svg.innerHTML=back_+props+chars+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=beach(0).replace(sun(0,1150,100),'');
  s+=place(966,640,crab({claw:.8}),{s:1.5,rot:-4})+rock(980,700,1.9);
  s+=label('?',1160,380,170,'#fff',0,RED,.12);
  s+=shadow(165,702,85)+place(160,698,duck({wing:22}),{s:1.25});
  s+=label('Who',540,200,150,'#FF5D8F',-3)+label('am I?',560,360,150,PURPLE,-3);
  s+=label('A new riddle with '+LULU,480,450,60,NAVY);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
