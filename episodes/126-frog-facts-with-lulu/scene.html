<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;width:1280px;height:720px}text{font-family:'Poppins',sans-serif;font-weight:700}</style>
</head><body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../toolkit/lib.js"></script>
<script>
/* Episode 126 - Did you know? Frog facts, with Lulu and Frog.
   Title (Lulu walks to the pond, Frog sits on a lily pad), fact 1: a frog starts as a tiny egg
   (frogspawn under the water), a tadpole hatches and swims with its long tail, the tadpole grows
   legs and its tail gets shorter, now it is a little frog (it pops up on a lily pad, ribbit!);
   fact 2: strong back legs, a big jump over the pond; fact 3: frogs drink through their skin
   (Frog sits in a rain puddle); recap (egg, tadpole, frog); bye bye. */
const SC=[0,5.5,12,18.5,25,31,37.5,44,50.5,57], DUR=57;
const NAVY='#2D2A6E', PURPLE='#7B5CFF', ORANGE='#E76F2E', GOLD='#FFE58A', GREEN='#2E9E44', BLUE='#3FA9F5';
const lulu=(x,lt,t,o={})=>{
  const j=jumps(lt,o.hops||[],.6,o.h||22), w=o.wave?20+20*Math.sin(lt*9):(o.wing||0), s=o.s||.95;
  return shadow(x,522,58*s,-j.y)+place(x,520+j.y,duck({eye:o.eye!=null?o.eye:blink(t,0),wing:w}),{s,sx:j.sx,sy:j.sy,flip:o.flip});
};
const frogC=(x,y,lt,t,o={})=>{
  const j=jumps(lt,o.hops||[],.5,o.h||22), s=o.s||1;
  return (o.noShadow?'':shadow(x,y+2,52*s,-j.y))+place(x,y+j.y,frog({eye:blink(t,1.3)}),{s,sx:j.sx,sy:j.sy});
};
const grow=(lt,t0)=>lt>t0?back(prog(lt,t0,t0+.4)):0;
let WIN=0;
function closeWin(x,y,r,g,inner,bgc){
  if(g<=0)return '';
  const id='w'+(WIN++);
  return `<g transform="translate(${x},${y}) scale(${g})"><defs><clipPath id="${id}"><circle r="${r}"/></clipPath></defs>
  <g clip-path="url(#${id})"><circle r="${r}" fill="${bgc}"/>${inner}</g>
  <circle r="${r}" fill="none" stroke="#fff" stroke-width="9"/></g>`;
}
// the pond seen from the side, with reeds
const POND=(t,x=860,w=300)=>pond(x,545,w)+reed(x-w+20,548,170,t,0)+reed(x-w+60,552,130,t,1)+reed(x+w-30,550,160,t,2);
const bgT=(t,o)=>bg(t,0,'',Object.assign({noClouds:true},o))+cloud(150,105,.9,1);
// little water ripple ring
const ripple=(x,y,u,w=60)=>u<=0||u>=1?'':`<ellipse cx="${x}" cy="${y}" rx="${w*(.3+u)}" ry="${w*(.3+u)*.16}" fill="none" stroke="#fff" stroke-width="4" opacity="${(1-u)*.85}"/>`;

function render(t){
  WIN=0;
  const [i,lt]=sceneAt(t,SC);
  let back_='',props='',chars='',pops='',cap='';
  if(i===0){
    back_=bgT(t);
    props=POND(t)+lilyPad(880,540);
    chars=lulu(lerp(120,380,eio(prog(lt,0,2.2))),lt,t,{wave:lt>2.4})+frogC(880,536,lt,t,{hops:[2.8,3.6],s:.95,noShadow:true});
    pops=pop('Did you know?',640,165,96,PURPLE,lt,.3,-3);
    cap=caption('Fun frog facts with Lulu',lt,2.0);
  }else if(i===1){
    // fact 1: a frog starts as a tiny egg (frogspawn under the water)
    back_=underwater(t);
    const g=grow(lt,.6);
    props=g>0?`<g transform="translate(640,390) scale(${g})">${frogspawn(0,0,1.25,0,t)}</g>`:'';
    for(let k=0;k<4;k++){const q=((lt*.35+k*.27)%1);props+=bubble(560+k*55,520-q*300,6+k%2*3,clamp((1-q)*2)*clamp(lt-1));}
    if(lt>3.6)props+=sparkle(470,320,1,Math.sin(Math.PI*prog(lt,3.6,4.8)))+sparkle(820,440,.9,Math.sin(Math.PI*prog(lt,4.1,5.3)));
    pops=pop('Fact 1',640,160,100,ORANGE,lt,.3);
    cap=lt<3.4?caption('A frog starts as a tiny egg.',lt,.6):caption('Frog eggs are called frogspawn.',lt,3.4);
  }else if(i===2){
    // a tadpole hatches and swims with its long tail
    back_=underwater(t);
    const h=prog(lt,.6,1.8);
    props=frogspawn(400,400,1,h,t);
    const u=eio(prog(lt,1.0,5.2)), x=lerp(430,840,u), y=400+18*Math.sin(lt*2.2)*prog(lt,1,1.6);
    chars=`<g opacity="${clamp((lt-.8)*3)}">${place(x,y,tadpole({eye:blink(t,.5),wig:Math.sin(t*9)}),{s:lerp(.7,1.25,prog(lt,.8,2.2))})}</g>`;
    for(let k=0;k<3;k++){const q=((lt*.4+k*.33)%1);props+=bubble(950+k*40,520-q*280,6+k*2,clamp((1-q)*2));}
    pops=lt>3.6?pop('Wiggle, wiggle!',640,165,90,GREEN,lt,3.6,-3):'';
    cap=lt<3.4?caption('A tadpole hatches from the egg.',lt,.4):caption('It swims with its long tail.',lt,3.4);
  }else if(i===3){
    // the tadpole grows legs and its tail gets shorter
    back_=underwater(t);
    const lg=prog(lt,.8,2.4), tl=lerp(1,.3,eio(prog(lt,3.6,5.8)));
    chars=place(640+30*Math.sin(lt*.9),395+10*Math.sin(lt*1.7),tadpole({eye:blink(t,.5),wig:.6*Math.sin(t*7),legs:lg,tail:tl}),{s:1.75});
    if(lt>1.6)props+=sparkle(560,470,.9,Math.sin(Math.PI*prog(lt,1.6,2.8)))+sparkle(720,480,.8,Math.sin(Math.PI*prog(lt,2,3.2)));
    pops=lt>3.6?pop('Growing!',640,165,96,GREEN,lt,3.6,-3):'';
    cap=lt<3.4?caption('The tadpole grows legs.',lt,.4):caption('Its tail gets shorter.',lt,3.4);
  }else if(i===4){
    // now it is a little frog: it pops up out of the pond onto a lily pad
    back_=bgT(t);
    const g=grow(lt,1.0);
    props=POND(t)+lilyPad(880,540)+ripple(880,540,prog(lt,.8,2.2),90)+ripple(880,540,prog(lt,1.4,2.8),90);
    chars=lulu(360,lt,t,{wing:lt>2.2?14:0,hops:[3.4]})+(g>0?place(880,536,frog({eye:blink(t,1.3)}),{s:.8*g}):'');
    pops=lt>3.0?pop('Ribbit!',640,165,100,GREEN,lt,3.0,-3):'';
    cap=caption('Now it is a little frog!',lt,1.2);
  }else if(i===5){
    // fact 2: strong back legs, a big jump over the pond
    back_=bgT(t);
    props=pond(660,545,170)+reed(480,548,140,t,0)+reed(840,550,150,t,2);
    const u=prog(lt,2.8,4.2), x=lerp(330,1000,eio(u)), hy=-4*170*u*(1-u);
    const sq=lt>2.5&&lt<2.8?1-.15*Math.sin(Math.PI*prog(lt,2.5,2.8)):1, land=lt>4.2&&lt<4.5?1-.15*Math.sin(Math.PI*prog(lt,4.2,4.5)):1;
    const sy=sq*land*(u>0&&u<1?1.1:1), sx=1/(sy);
    chars=lulu(150,lt,t,{wing:lt>4.4?16:0,s:.85})+shadow(x,522,52,-hy)+place(x,520+hy,frog({eye:blink(t,1.3)}),{s:1,sx,sy});
    pops=lt<4.4?pop('Fact 2',640,160,100,ORANGE,lt,.3):pop('So far!',640,165,100,GREEN,lt,4.4,-3);
    cap=lt<3.0?caption('Frogs have strong back legs.',lt,.6):caption('They can jump very far!',lt,3.0);
  }else if(i===6){
    // fact 3: frogs drink through their skin (Frog sits in a rain puddle)
    back_=bgT(t,{noSun:true});
    props=rainCloud(930,280,1.1,blink(t,.4))+puddle(900,524,170,0,((lt+.3)%1.3)/1.3);
    for(let k=0;k<8;k++){const q=((lt*.9+k*.37)%1), x=850+(k*29)%120, y=lerp(335,515,q);
      props+=raindrop(x,y,.7,clamp(lt*2)*clamp((1-q)*4));}
    chars=lulu(340,lt,t,{hops:[4.6],wing:lt>4?12:0})+frogC(900,524,lt,t,{noShadow:true});
    if(lt>3.4)chars+=sparkle(840,450,1,Math.sin(Math.PI*prog(lt,3.4,4.6)))+sparkle(965,430,.9,Math.sin(Math.PI*prog(lt,3.9,5.1)))+sparkle(905,505,.7,Math.sin(Math.PI*prog(lt,4.4,5.6)));
    pops=lt<4.0?pop('Fact 3',640,160,100,ORANGE,lt,.3):pop('Wow!',640,165,110,BLUE,lt,4.0,-3);
    cap=lt<3.4?caption('Frogs drink through their skin!',lt,.6):caption('Their skin soaks up water.',lt,3.4);
  }else if(i===7){
    // recap: egg, tadpole, frog
    back_=bgT(t);
    const b=k=>1+.05*Math.sin(t*4+k*2), X=[300,640,980], Y=390, W='#7FD0F5';
    props=closeWin(X[0],Y,118,grow(lt,.4)*b(0),frogspawn(0,0,.75,0,t),W);
    props+=closeWin(X[1],Y,118,grow(lt,1.4)*b(1),place(0,0,tadpole({eye:blink(t,.5),wig:Math.sin(t*8)}),{s:1.3}),W);
    props+=closeWin(X[2],Y,118,grow(lt,2.4)*b(2),'<rect x="-130" y="40" width="260" height="120" fill="#6CC24A"/>'+place(0,62,frog({eye:blink(t,1.3)}),{s:.95}),'#BFE8FF');
    pops=pop('eggs',X[0],230,46,GOLD,lt,.4,0,NAVY)+pop('tadpole',X[1],230,46,GOLD,lt,1.4,0,NAVY)+pop('frog',X[2],230,46,GOLD,lt,2.4,0,NAVY);
    cap=caption('Frogs are amazing!',lt,3.4);
  }else{
    back_=bgT(t);
    props=POND(t)+lilyPad(880,540);
    chars=lulu(lerp(260,430,eio(prog(lt,.4,2.2))),lt,t,{wave:lt>.8})+frogC(880,536,lt,t,{hops:[1.6,2.4,3.8],s:.95,noShadow:true});
    pops=pop('Bye bye!',640,165,100,GOLD,lt,.4,-3,NAVY);
    cap=caption('Bye bye from Lulu and Frog!',lt,1.4);
  }
  svg.innerHTML=back_+props+chars+pops+cap+fades(t,SC,DUR);
}

function thumb(){
  let s=bg(0,0,'',{noClouds:true,noSun:true});
  s+=pond(860,560,330)+reed(560,565,190,0,0)+reed(600,568,140,0,1)+reed(1170,566,170,0,2);
  s+=lilyPad(870,555);
  s+=place(870,552,frog({}),{s:1.55});
  s+=place(300,690,duck({wing:24}),{s:1.25});
  s+=label('Did you know?',640,175,120,PURPLE,-3);
  s+=label('Fun frog facts',640,295,100,'#fff',-2,GREEN);
  return s;
}
window.renderAt=render;
window.renderThumb=()=>{svg.innerHTML=thumb();};
</script></body></html>
